    ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
    const ka = Game.state === 'intro' ? intro.idx * 0.9 + i : i;
    line(ctx, kx, ky, kx + Math.cos(ka) * b * 0.3, ky + Math.sin(ka) * b * 0.3);
  }
  ctx.fillStyle = on ? '#ff2a1a' : '#3a0a08';
  circle(ctx, sx + sw - b * 3.3, sy + sh + b * 1.35, b * 0.12);

  ctx.save();
  rrect(ctx, sx, sy, sw, sh, sw * 0.06);
  ctx.clip();
  ctx.fillStyle = '#030403';
  ctx.fillRect(sx, sy, sw, sh);
  if (Game.state === 'intro' && intro.phase !== 'idle') {
    renderTVContent();
    let bandH = sh, bandW = sw, flashA = 0;
    if (intro.phase === 'poweron') {
      const k = intro.t / 0.9;
      if (k < 0.35) { bandH = 2; bandW = sw * (k / 0.35); flashA = 1; }
      else { bandH = sh * clamp((k - 0.35) / 0.65, 0.01, 1); flashA = 1 - (k - 0.35) / 0.65; }
    } else if (intro.phase === 'poweroff') {
      const k = intro.t;
      if (k < 0.35) { bandH = sh * (1 - k / 0.35) + 2; flashA = k / 0.35; }
      else if (k < 0.6) { bandH = 2; bandW = sw * (1 - (k - 0.35) / 0.25); flashA = 1; }
      else { bandH = 0; bandW = 0; }
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(W / 2 - bandW / 2, sy + sh / 2 - bandH / 2, bandW, bandH);
    ctx.clip();
    const N = 48;
    for (let i = 0; i < N; i++) {
      const v = ((i + 0.5) / N) * 2 - 1, s = 1 - 0.05 * v * v;
      const dw = sw * s;
      ctx.drawImage(tv, 0, (i * TVH) / N, TVW, TVH / N, sx + (sw - dw) / 2, sy + (i * sh) / N, dw, sh / N + 1);
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.12;
    ctx.drawImage(tv, sx + 2, sy, sw, sh);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.07;
    ctx.drawImage(noiseFrames[Math.floor(Math.random() * 4)], sx, sy, sw, sh);
    ctx.globalAlpha = 1;
    if (flashA > 0) { ctx.fillStyle = `rgba(230,240,255,${flashA})`; ctx.fillRect(sx, sy, sw, sh); }
    const roll = ((performance.now() / 4000) % 1) * (sh + 60) - 30;
    const rg = ctx.createLinearGradient(0, sy + roll - 30, 0, sy + roll + 30);
    rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(0.5, 'rgba(255,255,255,0.05)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(sx, sy + roll - 30, sw, 60);
    ctx.fillStyle = `rgba(0,0,0,${rand(0, 0.08)})`;
    ctx.fillRect(sx, sy, sw, sh);
    ctx.restore();
    if (intro.phase === 'poweroff' && intro.t >= 0.6 && intro.t < 1.0) {
      ctx.globalAlpha = 1 - (intro.t - 0.6) / 0.4;
      ctx.fillStyle = '#fff'; circle(ctx, W / 2, sy + sh / 2, 3);
      ctx.globalAlpha = 1;
    }
  }
  ctx.fillStyle = scanPattern;
  ctx.fillRect(sx, sy, sw, sh);
  const vg = ctx.createRadialGradient(sx + sw / 2, sy + sh / 2, sw * 0.25, sx + sw / 2, sy + sh / 2, sw * 0.68);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg;
  ctx.fillRect(sx, sy, sw, sh);
  const gl = ctx.createLinearGradient(sx, sy, sx + sw * 0.5, sy + sh * 0.6);
  gl.addColorStop(0, 'rgba(255,255,255,0.09)');
  gl.addColorStop(0.5, 'rgba(255,255,255,0.02)');
  gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl;
  ctx.fillRect(sx, sy, sw, sh);
  ctx.restore();

  if (Game.state === 'intro') {
    ctx.fillStyle = 'rgba(160,160,160,0.6)';
    ctx.font = '13px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('▲ / ▼  CHANGE CHANNEL   ·   SPACE / ENTER / CLICK  SKIP BROADCAST', W / 2, Math.min(H - 20, sy + sh + b * 3.2 + 22));
  }
}

// =====================================================================
// SYSTEMS: day/night clock, events, weather, horror, objectives,
// crafting, endgame, saving
// =====================================================================
const Clock = {
  day: 1, mins: 360, warned: {},
  reset() { this.day = 1; this.mins = 360; this.warned = {}; },
  hour() { return Math.floor(this.mins / 60) % 24; },
  isNight() { return this.mins >= 1200 || this.mins < 360; },
  phase() {
    if (this.mins >= 360 && this.mins < 1140) return 'day';
    if (this.mins >= 1140 && this.mins < 1200) return 'dusk';
    return 'night';
  },
  text() {
    const m = Math.floor(this.mins) % 1440;
    return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  },
  // real seconds per in-game minute for each phase (day ~5 min, dusk ~25 s, night ~3 min)
  rate() {
    const L = Settings.dayLength || 1;
    const ph = this.phase();
    if (ph === 'day') return (780 / 300) / L;
    if (ph === 'dusk') return (60 / 25) / L;
    return (600 / 180) / L;
  },
  ambient() {
    const m = this.mins;
    let a;
    if (m >= 360 && m < 420) a = lerp(0.72, 0.12, (m - 360) / 60);
    else if (m >= 420 && m < 1050) a = 0.12;
    else if (m >= 1050 && m < 1140) a = lerp(0.12, 0.45, (m - 1050) / 90);
    else if (m >= 1140 && m < 1200) a = lerp(0.45, 0.93, (m - 1140) / 60);
    else if (m >= 300 && m < 360) a = lerp(0.95, 0.75, (m - 300) / 60);
    else a = 0.95;
    if (Events.active === 'bloodmoon' && this.isNight()) a = Math.min(a, 0.9);
    return a;
  },
  update(dt) {
    const before = this.mins;
    this.mins += dt * this.rate();
    const crossed = h => before < h * 60 && this.mins >= h * 60;
    if (crossed(15)) Events.radioWarn();
    if (crossed(17)) Events.choose();
    if (crossed(18.5)) Sound.warning();
    if (crossed(19)) { UI.banner('Dusk', '', 2.5); Sound.howl(); }
    if (crossed(20)) Game.nightfall();
    if (this.mins >= 1440) {
      this.mins -= 1440;
      // midnight: still the same night number
    }
    if (this.mins >= 360 && before < 360 && Game.nightActive) Game.dawn();
  },
  rest() {
    if (Zombies.list.some(z => !z.retreat && dist(z.x, z.y, Player.x, Player.y) < 600)) { UI.toast('Not safe to rest', 1.4, 'skull'); return; }
    UI.fade(() => {
      const before = this.mins;
      this.mins = 1140;
      if (before < 1020) Events.choose();
      Player.hp = Math.min(Player.maxHp, Player.hp + 30);
      Player.sta = Player.maxSta;
      UI.banner('Dusk', '', 2.5);
    });
  },
};

// ---------- night events ----------
const Events = {
  tonight: null, active: null, announced: false,
  reset() { this.tonight = null; this.active = null; this.announced = false; },
  choose() {
    const n = Clock.day, d = Game.diff;
    this.tonight = null;
    this.announced = false;
    if (n >= 7 && n % 7 === 0) this.tonight = 'horde';
    else if (n >= 2) {
      const p = clamp(0.25 + n * 0.012, 0, 0.6) * d.eventDanger;
      if (Math.random() < p) {
        const opts = Object.keys(NIGHT_EVENTS).filter(k => {
          const e = NIGHT_EVENTS[k];
          if (e.weight <= 0 || n < Math.ceil(e.min / Math.max(0.6, d.eventDanger))) return false;
          if (e.needsGen && !Base.get('generator')) return false;
          if (e.needsBase && Base.list.length < 6) return false;
          return true;
        });
        if (opts.length) {
          let r = Math.random() * opts.reduce((a, k) => a + NIGHT_EVENTS[k].weight, 0);
          for (const k of opts) { r -= NIGHT_EVENTS[k].weight; if (r <= 0) { this.tonight = k; break; } }
        }
      }
    }
    if (this.tonight && NIGHT_EVENTS[this.tonight].warn) this.warn();
  },
  radioWarn() {
    // a powered radio gives an early forecast of tonight
    const radio = Base.get('radio');
    if (!radio || !radio.powered && !Base.genRunning()) return;
    Sound.radioStatic(1.2);
    const n = Clock.day;
    const msg = n % 7 === 6 ? '"...movement in the forest tomorrow night..."' : n % 7 === 0 ? '"...a horde is moving through the valley..."' : '"...nothing to report... yet..."';
    UI.toast(msg, 4, 's:radio');
  },
  warn() {
    const e = NIGHT_EVENTS[this.tonight];
    this.announced = true;
    UI.banner(e.name, e.desc, 4, 'danger');
    Sound.siren();
  },
  start() {
    this.active = this.tonight;
    if (!this.active) return;
    const e = NIGHT_EVENTS[this.active];
    if (!this.announced) UI.banner(e.name, e.desc, 4, 'danger');
    if (this.active === 'storm') Weather.target = 1;
    if (this.active === 'blackout') this.blackoutAt = rand(1290, 1440 + 120) % 1440;
    if (this.active === 'quiet') Horror.boost = 3;
    if (this.active === 'bloodmoon') Sound.howl();
  },
  update() {
    if (this.active === 'blackout' && this.blackoutAt !== null) {
      const m = Clock.mins;
      const past = this.blackoutAt >= 1200 ? (m >= this.blackoutAt || m < 360) : (m >= this.blackoutAt && m < 360);
      if (past) {
        const g = Base.get('generator');
        if (g) { g.broken = true; UI.banner('Blackout', 'The generator has died.', 3, 'danger'); Sound.powerOff(); }
        this.blackoutAt = null;
      }
    }
  },
  end() { this.active = null; this.tonight = null; Horror.boost = 1; },
};

// ---------- weather ----------
const Weather = {
  i: 0, target: 0, changeT: 120, flash: 0, boltT: 15, drops: [], splashes: [], gust: 0, gustT: 20,
  reset() { this.i = 0; this.target = 0; this.changeT = 200; this.flash = 0; this.drops = []; this.splashes = []; },
  update(dt) {
    this.changeT -= dt;
    if (this.changeT <= 0 && Events.active !== 'storm') {
      this.changeT = rand(120, 260);
      this.target = chance(0.25) ? rand(0.3, 0.75) : 0;
    }
    this.i += (this.target - this.i) * Math.min(1, dt * 0.15);
    this.flash = Math.max(0, this.flash - dt * 2.2);
    // occasional wind gusts move the canopy
    this.gustT -= dt;
    if (this.gustT <= 0) { this.gustT = rand(18, 45); this.gust = 1; Sound.whoosh(160, 90, 2.2, 0.05); }
    this.gust = Math.max(0, this.gust - dt * 0.4);
    if (this.i > 0.6) {
      this.boltT -= dt;
      if (this.boltT <= 0) {
        this.boltT = rand(8, 22) / this.i;
        this.flash = 1;
        Sound.thunder(rand(0.3, 1.6), rand(0.4, 0.8));
      }
    }
    const want = Math.floor(this.i * 260);
    while (this.drops.length < want) this.drops.push({ x: rand(0, W), y: rand(-H, H), l: rand(12, 22), v: rand(900, 1200) });
    if (this.drops.length > want) this.drops.length = want;
    for (const d of this.drops) {
      d.y += d.v * dt; d.x -= d.v * 0.18 * dt;
      if (d.y > H) { if (chance(0.3)) this.splashes.push({ x: d.x, y: rand(0, H), t: 0.3 }); d.y = rand(-60, 0); d.x = rand(0, W + 100); }
    }
    for (const s of this.splashes) s.t -= dt;
    this.splashes = this.splashes.filter(s => s.t > 0);
    Sound.setAmbience(this.i, Clock.isNight() ? 0.05 : 0.025, Events.active === 'storm');
  },
};

// ---------- horror: environmental scares (rare, scaled by night) ----------
const Horror = {
  t: 40, boost: 1, figures: [], eyes: [], cabinLight: null, totems: [],
  reset() { this.t = 60; this.boost = 1; this.figures = []; this.eyes = []; this.cabinLight = null; this.totems = []; },
  update(dt) {
    const night = Clock.isNight(), n = Clock.day;
    for (const f of this.figures) {
      f.t -= dt;
      if (f.vx) { f.x += f.vx * dt; f.y += f.vy * dt; }
      const lit = Player.light.lit && dist(f.x, f.y, Player.x, Player.y) < Stats.S.flashRange * 0.75 && Player.inBeam(f.x, f.y, 0.75);
      if (lit && f.t < f.max - 0.4) { f.t = Math.min(f.t, 0.12); if (!f.seen) { f.seen = true; Sound.whisper(f.x, f.y); } }
    }
    this.figures = this.figures.filter(f => f.t > 0);
    for (const e of this.eyes) e.t -= dt;
    this.eyes = this.eyes.filter(e => e.t > 0);
    if (this.cabinLight) { this.cabinLight.t -= dt; if (this.cabinLight.t <= 0) this.cabinLight = null; }
    if (Game.tutorialSafe()) return;
    this.t -= dt * (night ? 1 : 0.25) * this.boost * (1 + Math.min(1, n * 0.04));
    if (this.t > 0) return;
    this.t = rand(50, 120);
    const P = Player, a = P.aim;
    const choices = night ? ['scream', 'branch', 'footsteps', 'whisper', 'figure', 'eyes', 'cabin', 'radio', 'howl', 'totem', 'glimpse', 'glimpse', 'groan', 'nothing'] : ['branch', 'bird', 'scream', 'nothing'];
    const c = pick(choices);
    if (c === 'scream') Sound.scream(P.x + rand(-1, 1) * 900, P.y + rand(-1, 1) * 900, 0.25);
    else if (c === 'branch') { const b = a + Math.PI + rand(-0.8, 0.8); Sound.branchSnap(P.x + Math.cos(b) * 220, P.y + Math.sin(b) * 220); }
    else if (c === 'footsteps') Sound.footstepsBehind();
    else if (c === 'whisper') { const b = a + Math.PI / 2 * (chance(0.5) ? 1 : -1); Sound.whisper(P.x + Math.cos(b) * 120, P.y + Math.sin(b) * 120); }
    else if (c === 'figure') {
      const d = Stats.S.flashRange * rand(0.85, 1.05), b = a + rand(-0.3, 0.3);
      const x = P.x + Math.cos(b) * d, y = P.y + Math.sin(b) * d;
      if (World.rayHit(P.x, P.y, x, y) === null) this.figures.push({ x, y, t: 2.4, max: 2.4, ang: b + Math.PI, seen: false });
    } else if (c === 'eyes') {
      const b = rand(0, TAU), d = rand(420, 640);
      this.eyes.push({ x: P.x + Math.cos(b) * d, y: P.y + Math.sin(b) * d, t: 4 });
    } else if (c === 'cabin') {
      const bs = World.buildings.filter(b => dist(b.x + b.w / 2, b.y + b.h / 2, P.x, P.y) < 900 && P.building !== b);
      if (bs.length) { this.cabinLight = { b: pick(bs), t: 7 }; Sound.lightOn(); }
    } else if (c === 'radio') { if (Base.get('radio')) Sound.radioStatic(2.4); else Sound.whisper(P.x + 60, P.y); }
    else if (c === 'howl') Sound.howl();
    else if (c === 'totem') {
      const b = a + rand(-0.6, 0.6), d = rand(300, 500);
      this.totems.push({ x: P.x + Math.cos(b) * d, y: P.y + Math.sin(b) * d, rot: rand(0, TAU) });
      if (this.totems.length > 12) this.totems.shift();
    }
    else if (c === 'bird') Sound.bird();
    else if (c === 'groan') { const b = rand(0, TAU); Sound.groan(P.x + Math.cos(b) * 800, P.y + Math.sin(b) * 800, 0.4, 1.3); }
    else if (c === 'glimpse') {
      // a rustle off to one side... and a few seconds later, something crosses the far edge of the light
      const side = chance(0.5) ? 1 : -1, b = a + side * 1.3;
      Sound.rustle();
      Sound.branchSnap(P.x + Math.cos(b) * 260, P.y + Math.sin(b) * 260);
      setTimeout(() => {
        if (Game.state !== 'playing' || !Player.light.lit) return;
        const d = Stats.S.flashRange * 0.92, aa = Player.aim - side * Stats.S.flashCone;
        const x = Player.x + Math.cos(aa) * d, y = Player.y + Math.sin(aa) * d;
        this.figures.push({ x, y, t: 0.9, max: 0.9, ang: Player.aim + side * Math.PI / 2, seen: true, vx: Math.cos(Player.aim + side * Math.PI / 2) * 420, vy: Math.sin(Player.aim + side * Math.PI / 2) * 420 });
      }, rand(2500, 4500));
    }
  },
};

// ---------- objectives & tutorial ----------
const TUTORIAL = [
  { id: 't_wood', text: 'Gather wood', goal: 10, ev: 'gather', arg: 'wood', xp: 20, keys: [['E', 'Hold to gather']] },
  { id: 't_stone', text: 'Mine stone', goal: 5, ev: 'gather', arg: 'stone', xp: 20 },
  { id: 't_bench', text: 'Build a workbench', goal: 1, ev: 'build', arg: 'workbench', xp: 30, keys: [['B', 'Build']] },
  { id: 't_walls', text: 'Build defences', goal: 4, ev: 'buildDef', xp: 30 },
  { id: 't_craft', text: 'Craft a bandage', goal: 1, ev: 'craft', arg: 'bandage', xp: 25 },
  { id: 't_explore', text: 'Find the ranger cabin', goal: 1, ev: 'discover', arg: 'ranger', xp: 30, keys: [['M', 'Map']] },
  { id: 't_return', text: 'Get back to camp before dark', goal: 1, ev: 'home', xp: 25 },
  { id: 't_night', text: 'Survive the night', goal: 1, ev: 'survive', xp: 0 },
];
const DEF_TYPES = ['wall_wood', 'wall_stone', 'wall_metal', 'door', 'gate_wood', 'gate_metal', 'barricade', 'window', 'electric_fence'];
const Objectives = {
  list: [], done: [], tutorialIdx: 0,
  reset() { this.list = []; this.done = []; this.tutorialIdx = 0; this.pushTutorial(); },
  pushTutorial() {
    const t = TUTORIAL[this.tutorialIdx];
    if (!t) return;
    this.list = this.list.filter(o => !o.tut);
    this.list.unshift({ ...t, n: 0, tut: true });
    if (this.tutorialIdx > 0) UI.notice('New objective', t.text, null, 2.6, 1.4);
    if (t.keys && Settings.hints) UI.keyHint(t.keys, 6);
    // already satisfied?
    if (t.ev === 'build' && Base.count(t.arg)) this.progress(this.list[0], t.goal);
    else if (t.ev === 'buildDef') { const n = Base.list.filter(s => DEF_TYPES.includes(s.type)).length; if (n) this.progress(this.list[0], n); }
    if (t.ev === 'discover' && World.locs.find(l => l.id === t.arg && l.discovered)) this.progress(this.list[0], 1);
  },
  add(o) { if (!this.list.some(q => q.id === o.id) && !this.done.includes(o.id)) this.list.push({ n: 0, ...o }); },
  progress(o, k) {
    o.n = Math.min(o.goal, o.n + k);
    if (o.n >= o.goal) this.complete(o);
  },
  complete(o) {
    this.list = this.list.filter(q => q !== o);
    this.done.push(o.id);
    if (o.xp) Prog.addXP(o.xp, 'objective');
    if (o.sp) Prog.sp += o.sp;
    Sound.chime();
    UI.notice('Objective complete', o.text, 'check', 1.6);
    if (o.sp) UI.feed('spark', '+1');
    if (o.tut) { this.tutorialIdx++; this.pushTutorial(); }
    if (!this.list.some(q => !q.tut)) this.generate();
  },
  on(ev, arg, amt = 1) {
    for (const o of [...this.list]) {
      if (o.ev !== ev) {
        if (!(o.ev === 'buildDef' && ev === 'build' && DEF_TYPES.includes(arg))) continue;
        this.progress(o, 1);
        continue;
      }
      if (o.arg !== undefined && o.arg !== arg) continue;
      this.progress(o, ev === 'gather' ? amt : 1);
    }
  },
  generate() {
    // simple rolling goals once the tutorial is done
    if (this.tutorialIdx < TUTORIAL.length) return;
    const undiscovered = World.locs.filter(l => !l.discovered);
    const pool = [];
    if (undiscovered.length) { const l = undiscovered.sort((a, b) => dist(a.cx, a.cy, BASE_C.x, BASE_C.y) - dist(b.cx, b.cy, BASE_C.x, BASE_C.y))[0]; pool.push({ id: 'disc_' + l.id, text: `Find the ${l.name.toLowerCase()}`, goal: 1, ev: 'discover', arg: l.id, xp: 40 }); }
    if (!Base.count('generator')) pool.push({ id: 'gen', text: 'Build a generator', goal: 1, ev: 'build', arg: 'generator', xp: 60 });
    if (!Base.count('watchtower')) pool.push({ id: 'tower', text: 'Build a watchtower', goal: 1, ev: 'build', arg: 'watchtower', xp: 40 });
    if (Base.wbLevel() === 1) pool.push({ id: 'wb2', text: 'Upgrade the workbench', goal: 1, ev: 'wbUpgrade', arg: 2, xp: 60, sp: 1 });
    if (Base.wbLevel() === 2) pool.push({ id: 'wb3', text: 'Upgrade the workbench again', goal: 1, ev: 'wbUpgrade', arg: 3, xp: 120, sp: 1 });
    if (!Base.count('medical')) pool.push({ id: 'med', text: 'Build a medical station', goal: 1, ev: 'build', arg: 'medical', xp: 50 });
    pool.push({ id: 'kills_' + Clock.day, text: 'Kill 15 zombies', goal: 15, ev: 'kill', xp: 50 });
    if (Inv.notes.length < NOTES.length) pool.push({ id: 'notes_' + Inv.notes.length, text: 'Find out what happened here', goal: 1, ev: 'note', xp: 30 });
    if (!Endgame.stage && World.locs.find(l => l.id === 'tower' && l.discovered)) pool.push({ id: 'endgame', text: 'Repair the radio tower', goal: 1, ev: 'towerStage', xp: 100 });
    for (const o of pool.slice(0, 3)) this.add(o);
  },
  serialize() { return { list: this.list, done: this.done, tutorialIdx: this.tutorialIdx }; },
  restore(o) { this.list = o.list; this.done = o.done; this.tutorialIdx = o.tutorialIdx; },
};

// ---------- crafting ----------
const Craft = {
  near() { return Base.nearType('workbench', 150); },
  available(r) {
    if (r.once && Inv.crafted.includes(r.id)) return { ok: false, why: 'done' };
    if (r.wb > Base.wbLevel()) return { ok: false, why: 'wb' };
    if (r.needs && !Base.get(r.needs)) return { ok: false, why: 'needs' };
    if (r.give.weapon && Player.weapons[r.give.weapon]) return { ok: false, why: 'done' };
    if (r.give.flash && Inv.flashTier >= r.give.flash) return { ok: false, why: 'done' };
    if (r.give.backpack && Inv.backpack >= r.give.backpack) return { ok: false, why: 'done' };
    if (!this.near()) return { ok: false, why: 'far' };
    const cost = this.cost(r);
    if (!Inv.has(cost)) return { ok: false, why: 'missing' };
    return { ok: true };
  },
  cost(r) {
    const c = { ...r.cost };
    if (Base.get('armoury') && r.give.ammo) for (const k in c) c[k] = Math.max(1, c[k] - 1);
    return c;
  },
  make(r) {
    const a = this.available(r);
    if (!a.ok) { Sound.uiDeny(); return false; }
    Inv.spend(this.cost(r));
    const g = r.give;
    if (g.item) { if (g.n) Inv.items[g.item] = Math.min(ITEMS[g.item].cap, Inv.items[g.item] + g.n); }
    if (g.buff === 'meal') { Player.mealT = 120 * (Prog.rank('forager') ? 2 : 1); Player.sta = Player.maxSta; UI.feed('food', 'hot meal'); }
    if (g.ammo) Inv.ammo[g.ammo] = Math.min(AMMO[g.ammo].cap, Inv.ammo[g.ammo] + g.n);
    if (g.res) Inv.stash[g.res] = Math.min(Inv.stashCap(g.res), Inv.stash[g.res] + g.n);
    if (g.backpack) { Inv.backpack = g.backpack; Stats.compute(); }
    if (g.flash) { Inv.flashTier = g.flash; Stats.compute(); }
    if (g.weapon) Player.giveWeapon(g.weapon);
    if (r.once) Inv.crafted.push(r.id);
    Sound.craft();
    Prog.addXP(4, null);
    Game.stats.crafted++;
    Objectives.on('craft', r.id);
    return true;
  },
  upgradeWB() {
    const wb = Base.get('workbench');
    if (!wb || wb.lvl >= 3) return false;
    const cost = WORKBENCH_UPGRADES[wb.lvl + 1];
    if (!Inv.spend(cost)) { Sound.uiDeny(); return false; }
    wb.lvl++;
    Sound.build();
    UI.notice('Upgraded', `Workbench ${'I'.repeat(wb.lvl)}`, 's:workbench');
    Prog.addXP(40, 'upgrade');
    Objectives.on('wbUpgrade', wb.lvl);
    Game.markDirty();
    return true;
  },
  upgradeGen() {
    const g = Base.get('generator');
    if (!g || g.lvl >= 3) return false;
    const cost = GENERATOR_LEVELS[g.lvl + 1].cost;
    if (!Inv.spend(cost)) { Sound.uiDeny(); return false; }
    g.lvl++;
    Sound.build();
    UI.notice('Upgraded', `Generator Mk ${g.lvl}`, 's:generator');
    Prog.addXP(40, 'upgrade');
    Game.markDirty();
    return true;
  },
  upgradeWeapon(id) {
    const slot = Player.weapons[id];
    if (!slot || slot.lvl >= 3) return false;
    const u = WEAPON_UPGRADES[slot.lvl + 1];
    if (!this.near() || u.wb > Base.wbLevel() || (slot.lvl + 1 === 3 && !Base.get('armoury')) || !Inv.spend(u.cost)) { Sound.uiDeny(); return false; }
    slot.lvl++;
    Sound.craft();
    Prog.addXP(15, 'upgrade');
    return true;
  },
};

// ---------- endgame: repair the radio tower and call for rescue ----------
const ENDGAME_STAGES = [
  { name: 'Re-wire the transmitter panel', cost: { scrap: 20, components: 6 } },
  { name: 'Power the amplifier', cost: { fuel: 6, generatorPart: 1 } },
  { name: 'Install the encryption circuit', cost: { circuit: 1, components: 4 } },
];
const Endgame = {
  stage: 0, transmitted: false, rescueDay: 0, won: false,
  reset() { this.stage = 0; this.transmitted = false; this.rescueDay = 0; this.won = false; },
  label() {
    if (this.transmitted) return null;
    if (this.stage >= 3) return { verb: 'Transmit', time: 2.5 };
    const s = ENDGAME_STAGES[this.stage];
    return { verb: 'Repair', time: 2.5, chips: costChips(s.cost), dim: !Inv.has(s.cost), meter: this.stage / 3 };
  },
  interact() {
    if (this.transmitted) return;
    if (this.stage >= 3) {
      this.transmitted = true;
      this.rescueDay = Clock.day + 3;
      Sound.radioStatic(3);
      UI.banner('"...we hear you."', 'Hold out three more nights.', 5);
      Prog.addXP(200, 'endgame');
      Objectives.add({ id: 'rescue', text: `Survive until rescue · day ${this.rescueDay}`, goal: 1, ev: 'rescue', xp: 0 });
      Game.markDirty();
      return;
    }
    const s = ENDGAME_STAGES[this.stage];
    if (!Inv.spend(s.cost)) return;
    this.stage++;
    Sound.repair();
    Prog.addXP(80, 'endgame');
    UI.notice('Radio tower', `${this.stage} / 3`, 's:radio');
    Objectives.on('towerStage');
    Game.markDirty();
  },
};

// ---------- saving (single slot, localStorage) ----------
const SaveSystem = {
  has() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } },
  peek() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } },
  del() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } },
  write(reason) {
    if (Game.state === 'dead') return false;
    let fog = '';
    for (let i = 0; i < World.fog.length; i += 8) {
      let b = 0;
      for (let k = 0; k < 8; k++) if (World.fog[i + k]) b |= 1 << k;
      fog += String.fromCharCode(b + 48);
    }
    const data = {
      v: 2, seed: Game.seed, diff: Game.diffId, char: Game.char, time: Date.now(), reason,
      clock: { day: Clock.day, mins: Clock.mins },
      prog: { level: Prog.level, xp: Prog.xp, sp: Prog.sp, skills: Prog.skills, perks: Prog.perks, perkPicks: Prog.perkPicks, totalXp: Prog.totalXp },
      inv: { res: Inv.res, stash: Inv.stash, ammo: Inv.ammo, items: Inv.items, keys: Inv.keys, backpack: Inv.backpack, flashTier: Inv.flashTier, crafted: Inv.crafted, notes: Inv.notes },
      player: { x: Player.x, y: Player.y, hp: Player.hp, weapon: Player.weapon, weapons: Player.weapons, battery: Player.light.battery },
      base: Base.serialize(),
      nodes: World.nodes.filter(n => n.chunks !== n.max || n.regrow).map(n => [n.id, n.chunks, n.regrow]),
      containers: World.containers.filter(c => c.looted).map(c => [c.id, c.lootedDay]),
      discovered: World.locs.filter(l => l.discovered).map(l => l.id),
      gates: World.gates.filter(g => g.open).map(g => g.loc),
      fog, stats: Game.stats, objectives: Objectives.serialize(), endgame: { stage: Endgame.stage, transmitted: Endgame.transmitted, rescueDay: Endgame.rescueDay, won: Endgame.won },
      totems: Horror.totems,
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { return false; }
    UI.saved();
    return true;
  },
  apply(d) {
    Clock.day = d.clock.day; Clock.mins = d.clock.mins;
    Object.assign(Prog, d.prog);
    Object.assign(Inv, JSON.parse(JSON.stringify(d.inv)));
    for (const k of RES_KEYS) { if (!(k in Inv.res)) Inv.res[k] = 0; if (!(k in Inv.stash)) Inv.stash[k] = 0; }
    for (const k of Object.keys(ITEMS)) if (!(k in Inv.items)) Inv.items[k] = 0;
    Player.weapons = JSON.parse(JSON.stringify(d.player.weapons));
    Player.weapon = d.player.weapon;
    Player.x = d.player.x; Player.y = d.player.y;
    Player.light.battery = d.player.battery;
    Stats.compute();
    Player.hp = Math.min(d.player.hp, Player.maxHp);
    Base.restore(d.base);
    for (const [id, chunks, regrow] of d.nodes) { const n = World.nodes[id]; if (n) { n.chunks = chunks; n.regrow = regrow; } }
    for (const [id, day] of d.containers) { const c = World.containers[id]; if (c) { c.looted = true; c.lootedDay = day; } }
    for (const l of World.locs) l.discovered = d.discovered.includes(l.id);
    for (const g of World.gates) g.open = d.gates.includes(g.loc);
    for (let i = 0; i < d.fog.length; i++) {
      const b = d.fog.charCodeAt(i) - 48;
      for (let k = 0; k < 8; k++) if (i * 8 + k < World.fog.length) World.fog[i * 8 + k] = (b >> k) & 1;
    }
    Game.stats = Object.assign(Game.freshStats(), d.stats);
    Objectives.restore(d.objectives);
    Object.assign(Endgame, d.endgame);
    Endgame.won = !!d.endgame.won;
    Horror.totems = d.totems || [];
  },
};

const Cam = { x: 0, y: 0 };
function updateCamera(dt) {
  const lead = 0.12;
  const tx = Player.x - W / 2 + (Input.mouse.x - W / 2) * lead, ty = Player.y - H / 2 + (Input.mouse.y - H / 2) * lead;
  const k = Math.min(1, dt * 8);
  Cam.x += (tx - Cam.x) * k; Cam.y += (ty - Cam.y) * k;
}

// ---------- terrain ----------
function roadPath(c, road) {
  c.beginPath();
  c.moveTo(road[0][0], road[0][1]);
  for (let i = 1; i < road.length - 1; i++) {
    const [x1, y1] = road[i], [x2, y2] = road[i + 1];
    c.quadraticCurveTo(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2);
  }
  c.lineTo(road[road.length - 1][0], road[road.length - 1][1]);
}
function drawRoads() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, c] of [[108, 'rgba(40,32,22,0.6)'], [92, '#3a3128'], [62, '#41372c']]) {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    for (const r of ROADS) { roadPath(ctx, r); ctx.stroke(); }
  }
  ctx.setLineDash([22, 26]);
  ctx.strokeStyle = 'rgba(160,150,110,0.16)';
  ctx.lineWidth = 3;
  for (const r of ROADS) { roadPath(ctx, r); ctx.stroke(); }
  ctx.setLineDash([]);
}
function drawLake() {
  if (!onScreen(LAKE.x, LAKE.y, LAKE.r * 1.4)) return;
  const L = Sprites.lake;
  ctx.drawImage(L.canvas, L.x, L.y);
  ctx.lineWidth = 1.2;
  for (const r of World.lakeRipples) {
    r.p = (r.p + 0.004) % 1;
    ctx.strokeStyle = `rgba(150,180,210,${0.14 * (1 - r.p)})`;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, 4 + r.p * 34, 2 + r.p * 14, 0, 0, TAU); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  for (const r of DOCK) ctx.fillRect(r.x + 7, r.y + 9, r.w, r.h);
  for (const r of DOCK) {
    ctx.fillStyle = '#4a3a26';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1.5;
    for (let y = r.y + 10; y < r.y + r.h; y += 10) line(ctx, r.x, y, r.x + r.w, y);
  }
}
function drawDecor() {
  const D = World.decor;
  for (const l of D.leaves) {
    if (!onScreen(l.x, l.y, 5)) continue;
    ctx.fillStyle = l.c;
    ellipse(ctx, l.x, l.y, 3.2, 1.6, l.rot);
  }
  ctx.lineWidth = 1.3;
  for (const t of D.tufts) {

    ctx.strokeStyle = t.c;
    ctx.beginPath();
    for (const [bx, by] of t.blades) { ctx.moveTo(t.x, t.y); ctx.lineTo(t.x + bx, t.y + by); }
    ctx.stroke();
  }
  for (const lg of D.logs) {
    if (!onScreen(lg.x, lg.y, lg.len)) continue;

function drawStump(x, y, r) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  circle(ctx, x + 3, y + 4, r);
  ctx.fillStyle = '#3e2b18';
  circle(ctx, x, y, r);
  ctx.fillStyle = '#8a6a40';
  circle(ctx, x, y, r * 0.8);
  ctx.strokeStyle = 'rgba(70,45,20,0.8)';
  ctx.lineWidth = 1;
  for (let k = 0.25; k < 0.8; k += 0.2) { ctx.beginPath(); ctx.arc(x, y, r * k, 0, TAU); ctx.stroke(); }
}
function drawNodes() {
  for (const n of World.nodes) {
    if (!onScreen(n.x, n.y, (n.canopy || 30) + 20)) continue;
    if (n.type === 'tree') {
      if (n.chunks <= 0) { drawStump(n.x, n.y, n.r * 0.9); continue; }
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ellipse(ctx, n.x + 14, n.y + 16, n.canopy * 0.9, n.canopy * 0.8);
      const g = ctx.createRadialGradient(n.x - 3, n.y - 3, 1, n.x, n.y, n.r);
      g.addColorStop(0, '#5a4028');
      g.addColorStop(1, '#241709');
      ctx.fillStyle = g;
      circle(ctx, n.x, n.y, n.r);
      if (n.chunks < n.max) {
        ctx.fillStyle = '#b08a58';
        ellipse(ctx, n.x + n.r * 0.6, n.y, n.r * 0.35, n.r * 0.5 * (1 - n.chunks / n.max) + 2);
      }
    } else if (n.type === 'rock') {
      if (n.chunks <= 0) { ctx.fillStyle = 'rgba(90,90,85,0.5)'; for (let i = 0; i < 4; i++) circle(ctx, n.x + Math.cos(i * 1.7) * 10, n.y + Math.sin(i * 1.7) * 8, 3); continue; }
      const k = 0.55 + 0.45 * n.chunks / n.max, r = n.r * k;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ellipse(ctx, n.x + 4, n.y + 5, r * 1.1, r * 0.85, n.rot);
      ctx.fillStyle = n.shade;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = n.rot + (i / 8) * TAU, rr = r * (0.8 + 0.25 * Math.sin(i * 2.3 + n.id));
        ctx.lineTo(n.x + Math.cos(a) * rr * 1.1, n.y + Math.sin(a) * rr * 0.9);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ellipse(ctx, n.x - r * 0.25, n.y - r * 0.3, r * 0.5, r * 0.35, n.rot);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
      line(ctx, n.x - r * 0.3, n.y, n.x + r * 0.2, n.y + r * 0.3);
    } else if (n.type === 'scrap') {
      if (n.chunks <= 0) continue;
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.rotate(n.rot);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ellipse(ctx, 3, 4, 20, 14);
      const pieces = [['#6a6e72', -12, -6, 16, 9], ['#7a5a3a', 0, -2, 14, 7], ['#5a6268', -6, 4, 18, 6], ['#8a8a80', 4, -10, 8, 8], ['#3a4248', -14, 2, 7, 10]];
      for (let i = 0; i < Math.min(pieces.length, 2 + n.chunks); i++) { const [c, x, y, w, h] = pieces[i]; ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
      ctx.fillStyle = '#2a2a2a'; circle(ctx, 8, 6, 6); ctx.fillStyle = '#555'; circle(ctx, 8, 6, 2.5);
      ctx.restore();
    } else if (n.type === 'woodpile') {
      if (n.chunks <= 0) continue;
      ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(n.rot);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-16, -10, 36, 26);
      for (let i = 0; i < n.chunks + 1; i++) { ctx.fillStyle = i % 2 ? '#5a4028' : '#4e3620'; rrect(ctx, -18, -12 + i * 6, 34, 6, 3); ctx.fill(); ctx.fillStyle = '#9a7a4a'; circle(ctx, 14, -9 + i * 6, 3); }
      ctx.restore();
    }
  }
}
function drawFirepit(x, y, c = ctx) {

const DIRS = ['E', 'SE', 'S', 'SW', 'W', 'NW', 'N', 'NE'];
function compassTargets() {
  const out = [{ x: BASE_C.x, y: BASE_C.y, label: 'CAMP', color: '#8fd38f' }];
  for (const l of World.locs) if (l.discovered) out.push({ x: l.cx, y: l.cy, label: l.name, color: '#c8b890' });
  const obj = Objectives.list[0];
  if (obj && obj.ev === 'discover') { const l = World.locs.find(q => q.id === obj.arg); if (l) out.push({ x: l.cx, y: l.cy, label: l.discovered ? l.name : '?', color: '#e8d27a', obj: true }); }
  if (Game.mapMarker) out.push({ ...Game.mapMarker, label: 'MARKER', color: '#5ad0ff', obj: true });
  return out;
}
function drawCompass() {
  const cw = Math.min(460, W - 40), cx = W / 2, y = 16, half = Math.PI * 0.6;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rrect(ctx, cx - cw / 2, y, cw, 26, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.rect(cx - cw / 2 - 40, y - 6, cw + 80, 50); ctx.clip();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU, rel = wrapAngle(a - Player.aim);
    if (Math.abs(rel) > half) continue;
    const x = cx + (rel / half) * cw / 2;
    ctx.fillStyle = DIRS[i] === 'N' ? '#ff6a5a' : DIRS[i].length === 1 ? '#ddd' : '#888';
    ctx.font = DIRS[i].length === 1 ? "600 12px 'Segoe UI', Helvetica, Arial, sans-serif" : "11px 'Segoe UI', Helvetica, Arial, sans-serif";
    ctx.fillText(DIRS[i], x, y + 13);
  }
  for (let i = 0; i < 24; i++) {
    const rel = wrapAngle((i / 24) * TAU - Player.aim);
    if (Math.abs(rel) > half || i % 3 === 0) continue;
    const x = cx + (rel / half) * cw / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x - 0.5, y + 19, 1, 5);
  }
  for (const t of compassTargets()) {
    const rel = wrapAngle(Math.atan2(t.y - Player.y, t.x - Player.x) - Player.aim);
    if (Math.abs(rel) > half) continue;
    const x = cx + (rel / half) * cw / 2, d = dist(t.x, t.y, Player.x, Player.y);
    if (d < 120) continue;
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x - 4, y - 4 + 2); ctx.lineTo(x + 4, y - 4 + 2); ctx.fill();
    if (t.obj) {
      ctx.font = "11px 'Segoe UI', Helvetica, Arial, sans-serif";
      ctx.fillText(`${t.label} ${Math.round(d / 10)}m`, x, y + 34);
    }
  }
  ctx.restore();
  ctx.fillStyle = '#e8d27a'; ctx.fillRect(cx - 1, y - 2, 2, 6);
}
function drawCrosshair() {
  const { x, y } = Input.mouse;
  if (Build.active) {
    ctx.strokeStyle = 'rgba(232,210,122,0.8)'; ctx.lineWidth = 1.5;
    line(ctx, x - 8, y, x + 8, y); line(ctx, x, y - 8, x, y + 8);
    return;
  }
  const w = WEAPONS[Player.weapon];
  const spread = w.melee ? 6 : 6 + (Player.wstat().spread + Player.recoil * 0.5) * 120;
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
  line(ctx, x - spread - 8, y, x - spread, y); line(ctx, x + spread, y, x + spread + 8, y);
  line(ctx, x, y - spread - 8, x, y - spread); line(ctx, x, y + spread, x, y + spread + 8);
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; circle(ctx, x, y, 1.5);
  if (Player.reloading) {

    ctx.beginPath(); ctx.arc(x, y, 16, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - Player.reloadT / Player.wstat().reload)); ctx.stroke();

const MapGfx = {

    for (const r of ROADS) { g.beginPath(); r.forEach(([x, y], i) => i ? g.lineTo(x * S, y * S) : g.moveTo(x * S, y * S)); g.stroke(); }

    }

    g.beginPath(); g.moveTo(bx, by - 6); g.lineTo(bx + 6, by); g.lineTo(bx + 4, by); g.lineTo(bx + 4, by + 5); g.lineTo(bx - 4, by + 5); g.lineTo(bx - 4, by); g.lineTo(bx - 6, by); g.fill();

    const px = (Player.x - ox) * S, py = (Player.y - oy) * S;

    g.restore();

      this.set('ammo', `<b>${slot.mag}</b> <small>/ ${Inv.ammo[w.ammo]}</small>`);
      am.classList.toggle('low', slot.mag <= Math.ceil(P.wstat().mag * 0.25));
      am.classList.toggle('reload', P.reloading);
    }
    const healId = Inv.items.bandage ? 'bandage' : Inv.items.medkit ? 'medkit' : null;
    this.set('heal', healId ? `${Icons.img(healId)} ${Inv.items.bandage + Inv.items.medkit}` : '');
    const L = P.light;
    el('flash').className = !L.on ? 'off' : L.state === 'dead' ? 'dead' : L.state === 'flicker' ? 'flicker' : '';
    el('batt').firstElementChild.style.width = `${L.battery}%`;
    el('batt').classList.toggle('low', L.battery < 20);
    const nl = Noise.level(), bars = nl <= 0 ? 0 : nl < 200 ? 1 : nl < 400 ? 2 : nl < 700 ? 3 : 4;
    if (this.cache.noise !== bars) {
      this.cache.noise = bars;
      [...el('noise').children].forEach((b, i) => { b.className = i < bars ? (bars >= 3 ? 'hi' : 'on') : ''; });

  drawPreview(cv, c) {

    g.save();
    g.translate(w * 0.84, h * 0.82);
    g.scale(h / 200, h / 200);
    g.rotate(-Math.PI / 2);
    g.fillStyle = 'rgba(0,0,0,0.35)'; ellipse(g, 4, 5, 18, 15);
    drawSurvivor(g, c, { weapon: 'pistol', walk: 0, moving: false, sprinting: false, recoil: 0, swingK: null, push: 0, lit: true, gather: 0 });

  openPanel(tab) {

  },
  renderPanel() {
    const tabs = [['backpack', 'Backpack', 'tab_backpack'], ['skills', 'Skills', 'tab_skills'], ['map', 'Map', 'tab_map'], ['journal', 'Journal', 'tab_journal']];
    el('tabs').innerHTML = tabs.map(([id, n, ic]) => {
      const dot = id === 'skills' && (Prog.sp || Prog.perkPicks) ? '<span class="dot"></span>' : '';
      return `<button data-tab="${id}" class="${this.tab === id ? 'on' : ''}">${Icons.img(ic)}${n}${dot}</button>`;
    }).join('');

    const body = el('panelBody');

  bagItems() {
    const out = [];
    for (const k of RES_KEYS) if (Inv.res[k] > 0) out.push({ kind: 'res', id: k, icon: k, n: Inv.res[k], cap: Inv.carryCap(k) });
    for (const k of Object.keys(AMMO)) if (Inv.ammo[k] > 0) out.push({ kind: 'ammo', id: k, icon: 'ammo_' + k, n: Inv.ammo[k], cap: AMMO[k].cap });
    for (const k of Object.keys(ITEMS)) if (Inv.items[k] > 0) out.push({ kind: 'item', id: k, icon: k, n: Inv.items[k], cap: ITEMS[k].cap });
    for (const k of Inv.keys) out.push({ kind: 'key', id: k, icon: k, n: 0 });
    return out;
  },
  slotHtml(it, sel, extra = '') {
    if (!it) return '<div class="slot empty"></div>';
    const fill = it.cap && it.kind === 'res' ? `<div class="fill ${it.n >= it.cap ? 'full' : ''}"><div style="width:${Math.min(100, it.n / it.cap * 100)}%"></div></div>` : '';
    const pips = it.pips ? `<div class="pips">${'<i></i>'.repeat(it.pips)}</div>` : '';
    return `<button class="slot ${it.cls || ''} ${sel ? 'sel' : ''}" data-kind="${it.kind}" data-id="${it.id}" ${extra}>${Icons.img(it.icon, '')}${it.n ? `<span class="q">${it.n}</span>` : ''}${fill}${pips}</button>`;
  },
  tab_backpack(body) {
    const P = Player, items = this.bagItems();
    const eq = P.owned().map(id => ({ kind: 'weapon', id, icon: id, n: 0, pips: P.weapons[id].lvl, cls: 'eq' + (id === P.weapon ? ' sel' : '') }));
    const gear = [{ kind: 'gear', id: 'flashlight', icon: 'flashlight', pips: Inv.flashTier - 1, cls: 'eq' }, { kind: 'gear', id: 'backpack', icon: 'backpack', pips: Inv.backpack, cls: 'eq' }];
    const isSel = it => this.sel && this.sel.kind === it.kind && this.sel.id === it.id;
    const total = Math.max(24, Math.ceil(items.length / 6) * 6);
    const cells = [];
    for (let i = 0; i < total; i++) cells.push(this.slotHtml(items[i], items[i] && isSel(items[i])));
    body.innerHTML = `<div class="bpLayout">
      <div class="bpLeft">${eq.map(it => this.slotHtml(it, false)).join('')}<div class="divider"></div>${gear.map(it => this.slotHtml(it, isSel(it))).join('')}</div>
      <div class="bpRight"><div class="grid">${cells.join('')}</div></div></div>
      <div class="detail" id="bpDetail"></div>`;
    this.renderDetail();
    body.onclick = e => {
      const s = e.target.closest('.slot');
      if (s && !s.classList.contains('empty')) {
        const kind = s.dataset.kind, id = s.dataset.id;
        if (kind === 'weapon') { Player.switchTo(id); this.sel = { kind, id }; }
        else this.sel = { kind, id };
        Sound.uiClick();
        this.renderPanel();
        return;
      }
      const b = e.target.closest('button[data-act]');
      if (b) this.useSelected(b.dataset.act);
    };
  },
  renderDetail() {
    const d = el('bpDetail');
    const s = this.sel;
    if (!s) { d.innerHTML = ''; return; }
    let icon = s.id, name = ITEM_NAME(s.id), sub = '', act = '';
    if (s.kind === 'res') { sub = `${Inv.res[s.id]} / ${Inv.carryCap(s.id)}`; if (s.id === 'food' && Inv.res.food) act = 'eat'; }
    else if (s.kind === 'ammo') { icon = 'ammo_' + s.id; name = ITEM_NAME(icon); sub = `${Inv.ammo[s.id]}`; }
    else if (s.kind === 'item') { const it = ITEMS[s.id]; sub = `${Inv.items[s.id]} / ${it.cap}`; if ((it.heal && Player.hp < Player.maxHp) || it.drink || it.boost) act = it.drink ? 'drink' : 'use'; }
    else if (s.kind === 'key') sub = '';
    else if (s.kind === 'weapon') { const w = WEAPONS[s.id], lv = Player.weapons[s.id].lvl; sub = (lv ? `+${lv}` : '') + (w.ammo ? ` ${Icons.img('ammo_' + w.ammo)} ${Inv.ammo[w.ammo]}` : ''); }
    else if (s.id === 'flashlight') { name = FLASH_TIERS[Inv.flashTier].name; sub = `${Math.round(Player.light.battery)}%${Inv.items.battery ? ` &nbsp;${Icons.img('battery')} ${Inv.items.battery}` : ''}`; }
    else if (s.id === 'backpack') { name = ['Old backpack', 'Sturdy backpack', 'Military pack'][Inv.backpack]; }
    if ((s.kind === 'res' && !Inv.res[s.id]) || (s.kind === 'item' && !Inv.items[s.id]) || (s.kind === 'ammo' && !Inv.ammo[s.id])) { this.sel = null; d.innerHTML = ''; return; }
    d.innerHTML = `${Icons.img(icon, '')}<div><div class="nm">${name}</div><div class="sm">${sub}</div></div>${act ? `<button class="btn solid act" data-act="${act}">${{ eat: 'Eat', drink: 'Drink', use: 'Use' }[act]}</button>` : ''}`;
  },
  useSelected(act) {
    const s = this.sel;
    if (act === 'eat') Player.eat();
    if ((act === 'use' || act === 'drink') && s.kind === 'item') Player.useItem(s.id);
    this.renderPanel();
    const slot = document.querySelector(`#panelBody .slot[data-id="${s.id}"]`);
    if (slot) slot.classList.add('flashOk');
  },

  // ----- storage (a crate in the world) -----
  openStorage() {
    if (Build.active) Build.toggle(false);
    this.hideAll();
    this.sheet = 'storage';
    Game.setState('panel');
    el('stIcon').src = Icons.url('crate');
    this.show('storage');
    Sound.lootOpen();
    this.renderStorage();
  },
  renderStorage() {
    const side = (src, capFn, which) => RES_KEYS.map(k => {
      const n = src[k], cap = capFn(k);
      return `<button class="slot" data-side="${which}" data-id="${k}" style="${n ? '' : 'opacity:.35'}">${Icons.img(k, '')}${n ? `<span class="q">${n}</span>` : ''}<div class="fill ${n >= cap ? 'full' : ''}"><div style="width:${Math.min(100, n / cap * 100)}%"></div></div></button>`;
    }).join('');
    el('storageBody').innerHTML = `<div class="stLayout">
      <div class="stSide">${Icons.img('backpack')}<div class="grid">${side(Inv.res, k => Inv.carryCap(k), 'bag')}</div></div>
      <div class="stMid"><button class="arrow" data-all="match" title="Deposit all matching">&rsaquo;</button><button class="arrow" data-all="in" title="Store everything">&raquo;</button><button class="arrow" data-all="out" title="Take everything">&laquo;</button></div>
      <div class="stSide">${Icons.img('crate')}<div class="grid">${side(Inv.stash, k => Inv.stashCap(k), 'crate')}</div></div>
    </div><div class="hintline">${keyCap('Shift')} all</div>`;
    const body = el('storageBody');
    const act = (e, all) => {
      const s = e.target.closest('.slot');
      const b = e.target.closest('[data-all]');
      if (b) {
        if (b.dataset.all === 'in') Inv.deposit();
        else if (b.dataset.all === 'match') { for (const k of RES_KEYS) if (Inv.stash[k] > 0) { const n = Math.min(Inv.res[k], Inv.stashCap(k) - Inv.stash[k]); Inv.res[k] -= n; Inv.stash[k] += n; } }
        else for (const k of RES_KEYS) Inv.withdraw(k, 999);
        Sound.pickup();
      } else if (s) {
        const k = s.dataset.id;
        if (s.dataset.side === 'bag') { const n = Math.min(all ? Inv.res[k] : 1, Inv.res[k], Inv.stashCap(k) - Inv.stash[k]); if (n <= 0) return; Inv.res[k] -= n; Inv.stash[k] += n; }
        else if (!Inv.withdraw(k, all ? 999 : 1)) { Sound.uiDeny(); return; }
        Sound.uiClick();
      } else return;
      this.renderStorage();
      if (s) { const again = document.querySelector(`#storageBody .slot[data-side="${s.dataset.side === 'bag' ? 'crate' : 'bag'}"][data-id="${s.dataset.id}"]`); if (again) again.classList.add('flashOk'); }
    };
    body.onclick = e => act(e, e.shiftKey);
    body.oncontextmenu = e => { e.preventDefault(); act(e, true); };
  },

  // ----- crafting (at the workbench) -----
  openCrafting() {
    if (Build.active) Build.toggle(false);
    this.hideAll();
    this.sheet = 'crafting';
    Game.setState('panel');
    this.show('crafting');
    Sound.uiClick();
    this.renderCrafting();
  },
  craftCards() {
    const wb = Base.wbLevel(), cards = [];
    for (const r of RECIPES) {
      const a = Craft.available(r);
      if (a.why === 'done') continue;
      const locked = a.why === 'wb' || a.why === 'needs';
      cards.push({ key: 'r:' + r.id, cat: r.cat.toLowerCase(), icon: recipeIcon(r), name: recipeName(r), qty: recipeQty(r), cost: Craft.cost(r), ok: a.ok, locked,
        lock: a.why === 'wb' ? ['lock', romanL(r.wb)] : a.why === 'needs' ? ['s:' + r.needs, ''] : null, run: () => Craft.make(r), give: r });
    }
    const wbS = Base.get('workbench');
    if (wbS && wbS.lvl < 3) { const c = WORKBENCH_UPGRADES[wbS.lvl + 1]; cards.push({ key: 'wb', cat: 'upgrades', icon: 's:workbench', name: 'Workbench', lv: romanL(wbS.lvl + 1), cost: c, ok: Inv.has(c), run: () => Craft.upgradeWB() }); }
    const g = Base.get('generator');
    if (g && g.lvl < 3) { const c = GENERATOR_LEVELS[g.lvl + 1].cost; cards.push({ key: 'gen', cat: 'upgrades', icon: 's:generator', name: 'Generator', lv: romanL(g.lvl + 1), cost: c, ok: Inv.has(c), run: () => Craft.upgradeGen() }); }
    for (const id of Player.owned()) {
      const s = Player.weapons[id];
      if (s.lvl >= 3) continue;
      const u = WEAPON_UPGRADES[s.lvl + 1];
      const needArm = s.lvl + 1 === 3 && !Base.get('armoury');
      const locked = u.wb > wb || needArm;
      cards.push({ key: 'w:' + id, cat: 'upgrades', icon: id, name: WEAPONS[id].name, lv: '+' + (s.lvl + 1), cost: u.cost, ok: !locked && Inv.has(u.cost), locked,
        lock: u.wb > wb ? ['lock', romanL(u.wb)] : needArm ? ['s:armoury', ''] : null, run: () => Craft.upgradeWeapon(id) });
    }
    return cards;
  },
  renderCrafting() {
    const wb = Base.get('workbench');
    el('wbIcon').src = Icons.url('s:workbench');
    el('wbTitle').innerHTML = `Workbench <span class="sub">${romanL(wb ? wb.lvl : 1)}</span>`;
    const filters = [['all', 'cat_all'], ['medical', 'medkit'], ['ammo', 'ammo_light'], ['tools', 'repairkit'], ['gear', 'backpack'], ['weapons', 'shotgun'], ['upgrades', 'upgrade']];
    el('craftFilters').innerHTML = filters.map(([f, ic]) => `<button data-f="${f}" class="${this.craftFilter === f ? 'on' : ''}" title="${f}">${Icons.img(ic)}</button>`).join('');
    el('craftFilters').onclick = e => { const b = e.target.closest('button'); if (b) { this.craftFilter = b.dataset.f; Sound.uiClick(); this.renderCrafting(); } };
    const cards = this.craftCards().filter(c => this.craftFilter === 'all' || c.cat === this.craftFilter);
    cards.sort((a, b) => (b.ok - a.ok) || ((a.locked ? 1 : 0) - (b.locked ? 1 : 0)));
    el('craftBody').innerHTML = `<div class="recipes">${cards.map(c => `
      <button class="rc ${c.ok ? 'ok' : ''} ${c.locked ? 'off' : ''}" data-key="${c.key}">
        ${c.lock ? `<span class="lk">${Icons.img(c.lock[0])}${c.lock[1]}</span>` : ''}${c.lv ? `<span class="lv">${c.lv}</span>` : ''}
        ${Icons.img(c.icon, '')}<span class="txt"><span class="nm">${c.name}${c.qty ? ` <span class="muted">×${c.qty}</span>` : ''}</span>
        <span class="cost">${costChips(c.cost).map(chipHtml).join('')}</span></span>
      </button>`).join('')}</div>`;
    this._cards = Object.fromEntries(this.craftCards().map(c => [c.key, c]));
    el('craftBody').onclick = e => {
      const b = e.target.closest('.rc');
      if (!b) return;
      const c = this._cards[b.dataset.key];
      if (!c || c.locked || !c.ok) { Sound.uiDeny(); b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 180 }); return; }
      const img = b.querySelector(':scope > img');
      const r0 = img.getBoundingClientRect();
      if (c.run()) {
        this.flyIcon(c.icon, r0);
        if (c.give) this.feed(c.icon, c.qty || 1);
        this.renderCrafting();
        const again = document.querySelector(`#craftBody .rc[data-key="${c.key}"]`);
        if (again) again.classList.add('made');
      }
    };
  },
  flyIcon(icon, r0) {
    const f = document.createElement('img');
    f.src = Icons.url(icon);
    f.className = 'flyer';
    f.style.left = r0.left + 'px'; f.style.top = r0.top + 'px';
    document.body.appendChild(f);
    requestAnimationFrame(() => {
      f.style.transform = `translate(${40 - r0.left}px, ${window.innerHeight - 140 - r0.top}px) scale(.6)`;
      f.style.opacity = 0;
    });
    setTimeout(() => f.remove(), 800);
  },

  tab_skills(body) {
    const colW = 222, nodeX = c => 14 + c * 68, nodeY = t => 58 + t * 102;
    let nodes = '', lines = '';
    BRANCHES.forEach((b, bi) => {
      const spent = SKILLS.filter(k => k.b === b.id).reduce((a, k) => a + Prog.rank(k.id), 0);
      nodes += `<div class="branch" style="left:${bi * colW}px"><h4 style="color:${b.color}">${b.name.charAt(0) + b.name.slice(1).toLowerCase()}</h4><div class="pts">${spent || ''}</div></div>`;
      for (const s of SKILLS.filter(k => k.b === b.id)) {
        const x = bi * colW + nodeX(s.col) + (s.tier === 3 ? -4 : 0), y = nodeY(s.tier);
        const r = Prog.rank(s.id), can = Prog.canBuy(s.id).ok;
        const cls = ['node', r ? 'owned' : '', can ? 'avail' : '', this.selSkill === s.id ? 'sel' : '', s.tier === 3 ? 'cap' : ''].join(' ');
        const style = r ? `color:${b.color};box-shadow:inset 0 0 0 1px ${b.color}88;background:${b.color}1c` : '';
        const pips = Array.from({ length: s.max }, (_, i) => `<i class="${i < r ? 'f' : ''}"></i>`).join('');
        nodes += `<div class="${cls}" data-s="${s.id}" style="left:${x}px;top:${y}px;${this.selSkill === s.id ? '' : style}"><span style="color:${r ? '#e6dfd0' : ''}">${s.name}</span><span class="r">${pips}</span></div>`;
        for (const q of s.req || []) {
          const p = SKILL_BY_ID[q];
          const x1 = bi * colW + nodeX(p.col) + 31, y1 = nodeY(p.tier) + 62, x2 = x + (s.tier === 3 ? 35 : 31), y2 = y;
          const on = Prog.rank(q) > 0;
          lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? b.color : 'rgba(255,255,255,.08)'}" stroke-width="${on ? 2.5 : 1.5}"/>`;
        }
      }
    });
    const sel = this.selSkill && SKILL_BY_ID[this.selSkill];
    let info = '<div class="muted"></div>';
    if (sel) {
      const c = Prog.canBuy(sel.id);
      info = `<div><div class="nm">${sel.name}</div><div class="sm">${sel.desc}</div>${c.ok || Prog.rank(sel.id) >= sel.max ? '' : `<div class="sm" style="color:var(--danger)">${c.why}</div>`}</div>
        <button class="btn solid" data-buy="${sel.id}" ${c.ok ? '' : 'disabled'}>Learn${sel.cost ? ` ×${sel.cost}` : ''}</button>`;
    }
    let perkHtml = '';
    if (Prog.perkPicks > 0) perkHtml = `<div class="perkPick">${Prog.perkChoices().map(p => `<button data-perk="${p.id}"><b>${p.name}</b>${p.desc}</button>`).join('')}</div>`;
    const owned = Prog.perks.length ? `<div class="perks">${Prog.perks.map(id => `<span>${PERKS.find(p => p.id === id).name}</span>`).join('')}</div>` : '';
    body.innerHTML = `<div class="spHead">${Icons.img('spark')}<b>${Prog.sp}</b><span class="muted">&nbsp;· level ${Prog.level}</span></div>${perkHtml}${owned}
      <div id="skillWrap"><div id="skillTree"><svg>${lines}</svg>${nodes}</div></div><div id="skillInfo">${info}</div>`;
    body.onclick = e => {
      const n = e.target.closest('.node');
      if (n) { this.selSkill = n.dataset.s; Sound.uiClick(); this.renderPanel(); return; }
      const b = e.target.closest('button');
      if (b && b.dataset.buy) { Prog.buy(b.dataset.buy); this.renderPanel(); }
      if (b && b.dataset.perk) { Prog.takePerk(b.dataset.perk); this.renderPanel(); }
    };
    body.ondblclick = e => { const n = e.target.closest('.node'); if (n) { Prog.buy(n.dataset.s); this.renderPanel(); } };
  },
  tab_map(body) {
    const N = Math.max(240, Math.min(600, window.innerHeight - 190, body.clientWidth - 40));
    body.innerHTML = `<canvas id="mapCanvas" width="${N}" height="${N}"></canvas>`;
    const cv = el('mapCanvas');
    MapGfx.updateFog();
    MapGfx.drawFull(cv);
    cv.onclick = e => {
      const r = cv.getBoundingClientRect(), k = WORLD / N;

      Game.mapMarker = Game.mapMarker && dist(Game.mapMarker.x, Game.mapMarker.y, x, y) < 150 ? null : { x, y };
      Sound.uiClick();

  },
  tab_journal(body) {
    const notes = Inv.notes.map(i => `<div class="note"><h5>${NOTES[i].title}</h5><div>${NOTES[i].text}</div></div>`).join('');
    const objs = Objectives.list.map(o => `<div style="padding:3px 0">${o.text}${o.goal > 1 ? ` <span class="gold">${o.n} / ${o.goal}</span>` : ''}</div>`).join('');
    body.innerHTML = `<div style="margin-bottom:14px">${objs}</div>${notes || '<div class="muted" style="font-family:var(--serif);font-style:italic">Nothing written down yet.</div>'}`;
  },

  // ----- end-of-night and death -----
  statsHtml(list) { return list.map(([ic, v, lbl]) => `<div class="stat">${Icons.img(ic)}<b>${v}</b><span>${lbl}</span></div>`).join(''); },
  dawnSummary(list, extra, best) {
    this.hideAll();

    el('dawnStats').innerHTML = this.statsHtml(list);
    el('dawnExtra').textContent = (best ? 'New best' : '') + (extra ? (best ? ' · ' : '') + extra : '');
  },
  deathScreen(cause, list, record, canLoad) {

    el('deathStats').innerHTML = this.statsHtml(list);

    el('btnLoad').classList.toggle('hidden', !canLoad);

};
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function drawPortrait(g, c, cx, top, s) {
  g.save();
  g.translate(cx, top);
  g.scale(s, s);
  // legs
  g.fillStyle = c.pants;
  g.fillRect(-26, 150, 22, 80); g.fillRect(4, 150, 22, 80);
  g.fillStyle = '#1a1612'; g.fillRect(-28, 226, 26, 10); g.fillRect(2, 226, 26, 10);
  // torso
  const tc = c.topColor;
  g.fillStyle = tc;
  rrect(g, -40, 70, 80, c.top === 'coat' ? 110 : 88, 14); g.fill();
  g.fillStyle = c.top === 'vest' ? '#6a6a6a' : tc;
  rrect(g, -56, 74, 18, 70, 8); g.fill(); rrect(g, 38, 74, 18, 70, 8); g.fill();
  g.fillStyle = c.skin; circle(g, -47, 150, 9); circle(g, 47, 150, 9);
  if (c.top === 'flannel') { g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 2; for (let i = 0; i < 6; i++) { line(g, -40, 80 + i * 14, 40, 80 + i * 14); } for (let i = -30; i <= 30; i += 15) line(g, i, 72, i, 156); }
  if (c.top === 'vest') { g.fillStyle = shade(tc, -0.3); g.fillRect(-6, 70, 12, 88); g.fillStyle = '#aaa'; for (let i = 0; i < 4; i++) circle(g, 0, 84 + i * 18, 2); }
  if (c.top === 'hoodie') { g.fillStyle = shade(tc, -0.2); rrect(g, -28, 62, 56, 22, 10); g.fill(); g.strokeStyle = '#ddd'; g.lineWidth = 2; line(g, -8, 84, -10, 110); line(g, 8, 84, 10, 110); }
  if (c.top === 'jacket') { g.strokeStyle = shade(tc, 0.3); g.lineWidth = 2.5; line(g, 0, 72, 0, 156); g.fillStyle = shade(tc, -0.25); g.beginPath(); g.moveTo(-20, 70); g.lineTo(0, 92); g.lineTo(20, 70); g.fill(); }
  if (c.top === 'coat') { g.strokeStyle = shade(tc, -0.4); g.lineWidth = 3; line(g, 0, 72, 0, 178); g.fillStyle = shade(tc, -0.2); g.beginPath(); g.moveTo(-24, 70); g.lineTo(0, 100); g.lineTo(24, 70); g.fill(); }
  // neck & head
  g.fillStyle = c.skin; g.fillRect(-9, 52, 18, 20);
  ellipse(g, 0, 32, 28, 33);
  g.fillStyle = '#1a1410'; circle(g, -10, 32, 3.2); circle(g, 10, 32, 3.2);
  g.strokeStyle = 'rgba(60,30,20,0.6)'; g.lineWidth = 2; line(g, -6, 50, 6, 50);
  const hc = c.hairColor;
  g.fillStyle = hc;
  switch (c.hair) {
    case 'short': g.beginPath(); g.ellipse(0, 18, 30, 22, 0, Math.PI, TAU); g.fill(); g.fillRect(-30, 14, 7, 18); g.fillRect(23, 14, 7, 18); break;
    case 'long': g.beginPath(); g.ellipse(0, 18, 31, 23, 0, Math.PI, TAU); g.fill(); g.fillRect(-32, 14, 11, 66); g.fillRect(21, 14, 11, 66); break;
    case 'ponytail': g.beginPath(); g.ellipse(0, 18, 30, 22, 0, Math.PI, TAU); g.fill(); ellipse(g, 30, 30, 8, 26, 0.3); break;
    case 'buzz': g.globalAlpha = 0.6; g.beginPath(); g.ellipse(0, 22, 28, 20, 0, Math.PI, TAU); g.fill(); g.globalAlpha = 1; break;
    case 'curly': for (let i = 0; i < 11; i++) { const a = Math.PI + (i / 10) * Math.PI; circle(g, Math.cos(a) * 26, 24 + Math.sin(a) * 24, 9); } break;
    case 'beanie': g.fillStyle = hc === '#d0d0d0' ? '#8a2a2a' : shade(hc, 0.25); g.beginPath(); g.ellipse(0, 20, 31, 28, 0, Math.PI, TAU); g.fill(); g.fillRect(-31, 14, 62, 10); break;
    case 'cap': g.fillStyle = '#2a3a5a'; g.beginPath(); g.ellipse(0, 18, 30, 20, 0, Math.PI, TAU); g.fill(); g.fillStyle = '#1e2a44'; ellipse(g, 0, 18, 34, 6); break;
    case 'bald': break;
  }
  g.restore();
}

// OPENING: a short wordless scene before Day 1

const Cutscene = {
  t: 0, torch: null, fig: null, cam0: null, cam1: null, home: null, playerA: 0, cues: null, morning: false, done: false,
  start() {
    UI.hideAll();
    UI.clearMessages();
    Game.setState('cutscene');
    Sound.init();
    this.t = 0; this.done = false; this.morning = false; this.playerA = 0;
    this.home = { x: Player.x, y: Player.y };
    // a car on the road nearest the camp, with something terrible next to it
    const car = World.cars.filter(c => dist(c.x, c.y, BASE_C.x, BASE_C.y) > 380).sort((a, b) => dist(a.x, a.y, BASE_C.x, BASE_C.y) - dist(b.x, b.y, BASE_C.x, BASE_C.y))[0];
    const A = car ? { x: car.x, y: car.y } : { x: BASE_C.x + 600, y: BASE_C.y - 300 };
    this.torch = { x: A.x - 120, y: A.y + 80, a: -2.6, on: true, flick: 0 };
    for (let i = 0; i < 7; i++) FX.decal(lerp(A.x - 40, this.torch.x - 40, i / 6) + rand(-10, 10), lerp(A.y + 20, this.torch.y + 30, i / 6) + rand(-8, 8), rand(6, 13), 'rgba(80,0,0,0.65)');
    FX.decal(this.torch.x + 18, this.torch.y + 6, 22, 'rgba(70,0,0,0.7)');
    const bx = this.torch.x + Math.cos(this.torch.a) * 220, by = this.torch.y + Math.sin(this.torch.a) * 220;
    this.fig = { x: bx - Math.sin(this.torch.a) * -160, y: by + Math.cos(this.torch.a) * -160, vx: Math.sin(this.torch.a) * -230, vy: -Math.cos(this.torch.a) * -230, on: false };
    this.cam0 = { x: A.x - 470, y: A.y - 300 };
    this.cam1 = { x: A.x - 120, y: A.y - 60 };
    Clock.mins = 23 * 60 + 47;
    Player.light.lit = false; Player.light.on = false;
    Stats.S.nightVision = 0;
    Player.x = this.cam0.x; Player.y = this.cam0.y;
    Sound.setAmbience(0, 0.08, false);
    this.cues = [
      [4.6, () => Sound.owl()],
      [5.6, () => Sound.tvScream(0.07, 640, 1.3, -0.7)],
      [6.9, () => Sound.branchSnap(Player.x + 160, Player.y - 60)],
      [7.4, () => { this.fig.on = true; }],
      [9.0, () => { this.torch.flick = 1; }],
      [9.7, () => { this.torch.on = false; Sound.flicker(); }],
      [12.6, () => this.toMorning()],
      [13.8, () => Sound.dawnBirds()],
      [15.4, () => Sound.bird()],
    ];
  },
  toMorning() {
    this.morning = true;
    Clock.mins = 362;
    Player.x = this.home.x; Player.y = this.home.y;
    Player.aim = -Math.PI / 2;
    Stats.compute();
    Sound.setAmbience(0, 0.025, false);
    this.cam0 = { x: this.home.x + 200, y: this.home.y + 230 };
    this.cam1 = { x: this.home.x, y: this.home.y };
    this.mT0 = this.t;
  },
  skip() {
    if (this.done) return;
    if (!this.morning) this.toMorning();
    this.finish();
  },
  finish() {
    this.done = true;
    this.fig.on = false;
    this.torch.on = false;
    Player.light.on = true;
    Stats.compute();
    Sound.setAmbience(0, 0.025, false);
    Game.beginPlay(true);
    Cam.x = Player.x - W / 2; Cam.y = Player.y - H / 2;
  },
  update(dt) {
    this.t += dt;
    T += dt;
    while (this.cues.length && this.cues[0][0] <= this.t) this.cues.shift()[1]();
    let k;
    if (!this.morning) k = clamp((this.t - 3.2) / 8.5, 0, 1);
    else k = clamp((this.t - this.mT0) / 5.5, 0, 1);
    const e = k * k * (3 - 2 * k);
    const cx = lerp(this.cam0.x, this.cam1.x, e), cy = lerp(this.cam0.y, this.cam1.y, e);
    Cam.x = cx - W / 2; Cam.y = cy - H / 2;
    if (!this.morning) { Player.x = cx; Player.y = cy; }
    if (this.torch.flick) this.torch.lit = Math.random() < 0.5; else this.torch.lit = this.torch.on;
    if (!this.torch.on) this.torch.lit = false;
    if (this.fig.on) {
      this.fig.x += this.fig.vx * dt; this.fig.y += this.fig.vy * dt;
      if (this.t > 8.9) this.fig.on = false;
    }
    this.playerA = this.morning ? clamp((this.t - this.mT0 - 1.4) / 1.6, 0, 1) : 0;
    FX.update(dt);
    if (this.morning && this.t - this.mT0 > 6.2) this.finish();
  },
  // world-space extras drawn after the darkness pass
  worldOverlay() {
    const tc = this.torch;
    if (!this.morning && onScreen(tc.x, tc.y, 60)) {
      ctx.save(); ctx.translate(tc.x, tc.y); ctx.rotate(tc.a);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-12, -3.5, 18, 7);
      ctx.fillStyle = '#444'; ctx.fillRect(6, -5, 6, 10);
      ctx.fillStyle = tc.lit ? '#fff4c0' : '#333'; ctx.fillRect(12, -4, 2, 8);
      ctx.restore();
    }
    if (this.fig.on) {
      const f = this.fig;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(Math.atan2(f.vy, f.vx));
      ctx.fillStyle = 'rgba(6,6,6,0.92)';
      ellipse(ctx, 0, 0, 9, 17); circle(ctx, 4, 0, 7.5);
      ctx.strokeStyle = 'rgba(6,6,6,0.92)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      const s = Math.sin(this.t * 16) * 9;
      line(ctx, 0, -12, 14 + s, -16); line(ctx, 0, 12, 14 - s, 16);
      ctx.restore();
    }
  },
  screenOverlay() {
    const t = this.t;
    let black = 0;
    if (!this.morning) black = t < 3.2 ? 1 : t < 5 ? 1 - (t - 3.2) / 1.8 : t > 9.8 ? clamp((t - 9.8) / 0.6, 0, 1) : 0;
    else { const m = t - this.mT0; black = m < 0.4 ? 1 : clamp(1 - (m - 0.4) / 1.8, 0, 1); }
    if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
    // letterbox
    const lb = Math.round(H * 0.075 * (this.morning ? clamp(1 - (t - this.mT0 - 4.2) / 1.5, 0, 1) : 1));
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, lb); ctx.fillRect(0, H - lb, W, lb);
    const card = (txt, t0, t1, size, y = H / 2) => {
      if (t < t0 || t > t1) return;
      const a = Math.min(1, (t - t0) / 0.9, (t1 - t) / 0.9);
      ctx.globalAlpha = clamp(a, 0, 1) * 0.85;
      ctx.fillStyle = '#d8d2c4';
      ctx.font = `${size}px Georgia, 'Times New Roman', serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, W / 2, y);
      ctx.globalAlpha = 1;
    };
    card('11:47 PM', 0.7, 3.9, 22);
    card('6:04 AM', 10.7, 13.3, 22);
    if (this.morning) card('Day 1', this.mT0 + 2.4, this.mT0 + 5.6, 30, H * 0.26);
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#aaa'; ctx.font = "12px 'Segoe UI', Helvetica, Arial, sans-serif"; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText('space to skip', W - 18, H - lb - 10);
    ctx.globalAlpha = 1;
  },
};

// GAME: state machine, run lifecycle, main loop, input
// =====================================================================
const INGAME_STATES = new Set(['playing', 'panel', 'paused', 'note', 'dawn', 'dead', 'victory']);
const Game = {
  state: 'menu', diffId: 'regular', diff: DIFFICULTY.regular, char: defaultChar(), seed: 1,
  stats: null, night: null, nightActive: false, mapMarker: null, dirty: false, saveT: 0, depositT: 0, ambT: 8, recordedKills: 0,
  hudT: 0, miniT: 0, fogT: 0, lastDeposit: 0,
  freshStats() { return { kills: 0, dmgTaken: 0, res: 0, xp: 0, searched: 0, built: 0, crafted: 0, locations: 0 }; },
  freshNight() { return { kills: 0, dmgTaken: 0, res: 0, xp: 0, baseDmg: 0, destroyed: 0 }; },
  setState(s) {
    this.state = s;
    document.body.classList.toggle('ingame', INGAME_STATES.has(s));
    document.body.classList.toggle('menuMode', s !== 'playing' && s !== 'intro' && s !== 'cutscene');
    if (Sound.ctx) {
      if (s === 'paused' || s === 'panel' || s === 'note') Sound.ctx.suspend();
      else if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
    }
    if (s !== 'playing') { Input.mouse.down = false; for (const k in Input.keys) Input.keys[k] = false; }
    if (s !== 'playing') UI.prompt(null);
  },
  tutorialSafe() { return Clock.day === 1 && Clock.mins < 12 * 60; },
  markDirty() { this.dirty = true; },
  resetSystems() {
    Clock.reset(); Prog.reset(); Inv.reset(); Base.reset(); Zombies.reset(); Projectiles.reset(); Flares.reset(); Pickups.reset();
    FX.reset(); Events.reset(); Weather.reset(); Horror.reset(); Spawner.reset(); Endgame.reset(); Noise.recent = [];
    Build.active = false; Build.ghost = null; UI.buildBar();
    this.stats = this.freshStats(); this.night = this.freshNight(); this.nightActive = false; this.mapMarker = null; this.dirty = false; this.recordedKills = 0;
  },
  newRun(diffId, char, intro) {
    Sound.init();
    this.diffId = diffId; this.diff = DIFFICULTY[diffId]; this.char = { ...char };
    this.seed = (Math.random() * 1e9) | 0;
    World.generate(this.seed);
    MapGfx.init();
    this.resetSystems();
    Base.starterCamp();
    Player.reset();
    Objectives.reset();
    Records.runStarted(diffId);
    SaveSystem.write('start');
    UI.hideAll();
    if (intro) { this.setState('intro'); startIntro(); }
    else Cutscene.start();
  },
  afterIntro() { Cutscene.start(); },
  continueRun() {
    const d = SaveSystem.peek();
    if (!d) { UI.menu(); return; }
    Sound.init();
    this.diffId = d.diff; this.diff = DIFFICULTY[d.diff]; this.char = d.char; this.seed = d.seed;
    World.generate(this.seed);
    MapGfx.init();
    this.resetSystems();
    Player.reset();
    SaveSystem.apply(d);
    this.recordedKills = this.stats.kills;
    if (Objectives.tutorialIdx < TUTORIAL.length && !Objectives.list.some(o => o.tut)) Objectives.pushTutorial();
    if (!Objectives.list.length) Objectives.generate();
    UI.hideAll();
    this.beginPlay(false);
  },
  beginPlay(fresh) {
    UI.hideAll();
    this.setState('playing');
    Cam.x = Player.x - W / 2; Cam.y = Player.y - H / 2;
    MapGfx.updateFog();
    UI.cache = {};
    if (fresh) {
      if (Settings.hints) setTimeout(() => { if (this.state === 'playing') UI.keyHint([['WASD', 'Move'], ['E', 'Interact'], ['TAB', 'Backpack']], 7, 'start'); }, 1500);
    } else { UI.banner(`Day ${Clock.day}`, '', 2.5); Sound.dawnBirds(); }
  },
  nightfall() {
    this.nightActive = true;
    this.night = this.freshNight();
    Player.secondWind = true;
    Events.start();
    Spawner.startNight();
    if (!Events.active) UI.banner(`Night ${Clock.day}`, '', 3, 'danger');
    Sound.howl();
    if (Settings.hints && Clock.day === 1) UI.keyHint([['F', 'Flashlight'], ['C', 'Crouch'], ['G', 'Flare']], 6, 'night');
  },
  dawn() {
    this.nightActive = false;
    const n = Clock.day;
    const xp = 40 + n * 12;
    Prog.addXP(xp, null);
    Prog.sp += 1;
    Zombies.retreatAll();
    const evName = Events.active ? NIGHT_EVENTS[Events.active].name : null;
    Events.end();
    Weather.target = 0;
    const best = Records.nightSurvived(this.diffId, n, Prog.level);
    this.flushKills();
    const produce = Base.dawn();
    Clock.day++;
    World.dailyRegrow(Clock.day);
    Player.light.battery = Math.min(100, Player.light.battery + (Inv.atBase() ? 100 : 40));
    Player.light.state = 'ok'; Player.light.failT = Player.nextFail();
    Objectives.on('survive');
    if (!Objectives.list.some(o => !o.tut)) Objectives.generate();
    Sound.dawnBirds();
    const N = this.night;
    const rows = [
      ['skull', N.kills, 'killed'], ['heart', Math.round(N.dmgTaken), 'damage'], ['wood', N.res, 'gathered'], ['wall', Math.round(N.baseDmg), 'base damage'],
      ['star', N.xp, 'xp'], ['spark', '+1', 'skill point'],
    ];
    this.pendingProduce = produce;
    const extra = evName || '';
    if (Endgame.transmitted && !Endgame.won && Clock.day >= Endgame.rescueDay) {
      SaveSystem.write('dawn');
      this.victory();
      return;
    }
    this.setState('dawn');
    UI.dawnSummary(rows, extra, best);
    SaveSystem.write('dawn');
    this.dirty = false;
  },
  startDay() {
    UI.hideAll();
    this.setState('playing');
    UI.banner(`Day ${Clock.day}`, '', 2.5);
    for (const [k, n] of this.pendingProduce || []) setTimeout(() => UI.feed(k, n), 1200);
    this.pendingProduce = null;
    if (Prog.sp && Settings.hints) UI.keyHint([['K', 'Skills']], 6, 'skills' + Clock.day);
    if (Clock.day === 2) Objectives.add({ id: 'spend', text: 'Spend your skill point', goal: 1, ev: 'skill', xp: 20 });
  },
  flushKills() {
    const k = this.stats.kills - this.recordedKills;
    if (k > 0) Records.addKills(this.diffId, k);
    this.recordedKills = this.stats.kills;
  },
  die(cause) {
    if (this.state !== 'playing') return;
    this.flushKills();
    this.setState('dead');
    Build.active = false; UI.buildBar();
    Sound.hurt();
    FX.blood(Player.x, Player.y, 40);
    FX.decal(Player.x, Player.y, 26, 'rgba(90,0,0,0.75)');
    const r = Records.get(this.diffId);
    const nights = Clock.day - 1;
    if (this.diffId === 'hardcore') SaveSystem.del();
    const rows = [['moon', nights, 'nights'], ['skull', this.stats.kills, 'killed'], ['star', Prog.level, 'level'], ['spark', r.bestNight, 'best']];
    setTimeout(() => UI.deathScreen(cause, rows, this.diffId === 'hardcore' ? 'The run is over.' : '', this.diffId !== 'hardcore' && SaveSystem.has()), 900);
  },
  victory() {
    this.setState('victory');
    const r = Records.get(this.diffId);
    r.escaped++; Records.save();
    UI.hideAll();
    UI.clearMessages();
    UI.show('victory');
    el('victoryStats').innerHTML = UI.statsHtml([['moon', Clock.day - 1, 'nights'], ['skull', this.stats.kills, 'killed'], ['star', Prog.level, 'level']]);
    Endgame.won = true;
  },
  pause() {
    if (this.state !== 'playing') return;
    this.setState('paused');
    UI.show('pause');
  },
  resume() {
    UI.hideAll();
    this.setState('playing');
  },
  toMenu() {
    UI.hideAll();
    this.setState('menu');
    Build.active = false; UI.buildBar();
    Zombies.reset();
    Clock.mins = 1165;
    Player.light.on = false;
    UI.menu();
  },
  quitToMenu() {
    if (this.diffId !== 'hardcore' && !Clock.isNight() && this.state !== 'dead') SaveSystem.write('quit');
    this.flushKills();
    this.toMenu();
  },

  // ----- per-frame update -----
  update(dt) {
    T += dt;
    Clock.update(dt);
    if (this.state !== 'playing') return;
    Stats.compute();
    Player.update(dt);
    if (this.state !== 'playing') return;
    Build.update();
    Zombies.update(dt);
    Spawner.update(dt);
    Projectiles.update(dt);
    Flares.update(dt);
    Pickups.update(dt);
    Base.update(dt);
    Noise.update(dt);
    FX.update(dt);
    Weather.update(dt);
    Horror.update(dt);
    Events.update(dt);
    this.depositT -= dt;
    if (this.depositT <= 0) {
      this.depositT = 0.8;
      if (Clock.phase() !== 'day' && Inv.atBase()) Objectives.on('home');
    }
    if (this.dirty && !Clock.isNight() && this.diffId !== 'hardcore') {
      this.saveT -= dt;
      if (this.saveT <= 0) { this.saveT = 6; this.dirty = false; SaveSystem.write('build'); }
    }
    // ambience
    this.ambT -= dt;
    if (this.ambT <= 0) {
      this.ambT = rand(5, 12);
      if (Clock.isNight()) { if (chance(0.6)) Sound.cricket(); else if (chance(0.4)) Sound.owl(); }
      else if (chance(0.5)) Sound.bird();
    }
    updateCamera(dt);
  },
  frame(dt) {
    if (this.state === 'intro') { updateIntro(dt); renderIntro(); return; }
    if (this.state === 'menu') { this.menuBackdrop(dt); return; }
    if (this.state === 'cutscene') { Cutscene.update(dt); if (this.state === 'cutscene') { renderWorld(); return; } }
    if (this.state === 'playing') this.update(dt);
    else if (this.state === 'dead') { FX.update(dt); updateCamera(dt); }
    if (this.state === 'intro') return;
    renderWorld();
    this.hudT -= dt;
    if (INGAME_STATES.has(this.state)) {
      UI.hud();
      this.miniT -= dt;
      if (this.miniT <= 0) { this.miniT = 0.15; MapGfx.drawMini(el('minimap')); }
      this.fogT -= dt;
      if (this.fogT <= 0) { this.fogT = 1; MapGfx.updateFog(); }
    }
  },
  menuBackdrop(dt) {
    if (!World.nodes.length) {
      World.generate(1337);
      MapGfx.init();
      this.resetSystems();
      Player.reset();
      Player.light.on = false;
      Clock.mins = 1165;
      Cam.x = BASE_C.x - W / 2; Cam.y = BASE_C.y - H / 2;
    }
    T += dt;
    Cam.x += dt * 14; Cam.y += dt * 5;
    Player.x = Cam.x + W / 2; Player.y = Cam.y + H / 2 + 400;
    Player.light.lit = false;
    viewX = Cam.x; viewY = Cam.y;
    renderWorld();
  },
};

// ---------- input ----------
function onKeyDown(e) {
  const c = e.code;
  if (['Tab', 'Space', 'ArrowUp', 'ArrowDown'].includes(c) && Game.state !== 'menu') e.preventDefault();
  if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const st = Game.state;
  if (st === 'intro') {
    if (c === 'ArrowUp' || c === 'ArrowDown') introSkipChannel();
    else if (c === 'Space' || c === 'Enter' || c === 'Escape') finishIntro();
    return;
  }
  if (st === 'cutscene') { if (c === 'Space' || c === 'Enter' || c === 'Escape') Cutscene.skip(); return; }
  if (st === 'note') { UI.hide('noteModal'); Game.setState('playing'); return; }
  if (st === 'dawn') { if (c === 'Enter' || c === 'Space') Game.startDay(); return; }
  if (st === 'paused') { if (c === 'Escape' || c === 'KeyP') Game.resume(); return; }
  if (st === 'panel') {
    const map = { KeyK: 'skills', KeyM: 'map', KeyJ: 'journal', Tab: 'backpack' };
    if (UI.sheet !== 'panel') { if (c === 'Escape' || c === 'Tab' || c === 'KeyE') UI.closePanel(); return; }
    if (c === 'Escape' || (map[c] && UI.tab === map[c])) UI.closePanel();
    else if (map[c]) { UI.tab = map[c]; Sound.uiClick(); UI.renderPanel(); }
    return;
  }
  if (st !== 'playing') return;
  if (c === 'ControlLeft' || (e.ctrlKey && ['KeyS', 'KeyD', 'KeyA'].includes(c))) e.preventDefault();
  Input.keys[c] = true;
  if (e.repeat) return;
  if (c === 'Escape' || c === 'KeyP') { if (Build.active) Build.toggle(false); else Game.pause(); return; }
  if (c.startsWith('Digit')) {
    const n = +c.slice(5);
    if (Build.active) { if (n >= 1 && n <= STRUCT_CATS.length) Build.setCat(n - 1); }
    else { const o = Player.owned(); if (o[n - 1]) Player.switchTo(o[n - 1]); }
    return;
  }
  switch (c) {
    case 'KeyR': if (Build.active) { Build.rot ^= 1; Sound.uiClick(); } else Player.startReload(); break;
    case 'KeyX': if (Build.active) Build.demolish(); break;
    case 'KeyB': Build.toggle(); break;
    case 'KeyF': Player.toggleLight(); break;
    case 'KeyC': Player.shakeLight(); break;
    case 'KeyQ': Player.heal(); break;
    case 'KeyG': Player.throwFlare(); break;
    case 'KeyV': Player.shove(); break;
    case 'Tab': UI.openPanel('inventory'); break;
    case 'KeyK': UI.openPanel(Prog.perkPicks && !Prog.sp ? 'perks' : 'skills'); break;
    case 'KeyM': UI.openPanel('map'); break;
    case 'KeyJ': UI.openPanel('journal'); break;
  }
}
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', e => { Input.keys[e.code] = false; });
canvas.addEventListener('mousemove', e => { Input.mouse.x = e.clientX; Input.mouse.y = e.clientY; });
window.addEventListener('mousemove', e => { Input.mouse.x = e.clientX; Input.mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => {
  Sound.init();
  if (Game.state === 'intro') { finishIntro(); return; }
  if (Game.state === 'cutscene') { Cutscene.skip(); return; }
  if (Game.state !== 'playing') return;
  if (e.button === 0) {
    if (Build.active) Build.click();
    else { Input.mouse.down = true; Input.mouse.clickT = T; }
  } else if (e.button === 2) { if (Build.active) Build.toggle(false); }
  else if (e.button === 1) { e.preventDefault(); Player.shove(); }
});
window.addEventListener('mouseup', e => { if (e.button === 0) Input.mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (Game.state !== 'playing') return;
  e.preventDefault();
  const d = Math.sign(e.deltaY);
  if (Build.active) Build.cycle(d); else Player.cycle(d);
}, { passive: false });
window.addEventListener('blur', () => { if (Game.state === 'playing') Game.pause(); });
el('noteModal').addEventListener('click', () => { if (Game.state === 'note') { UI.hide('noteModal'); Game.setState('playing'); } });

// ---------- menu wiring ----------
const click = (id, fn) => el(id).addEventListener('click', () => { Sound.init(); Sound.uiClick(); fn(); });
click('btnContinue', () => Game.continueRun());
click('btnNew', () => UI.newGame());
click('btnHow', () => UI.howto(() => UI.menu()));
click('btnSettings', () => UI.settings(() => UI.menu()));
let deleteArmed = false;
click('btnDelete', () => {
  if (!deleteArmed) { deleteArmed = true; el('btnDelete').textContent = 'CLICK AGAIN TO DELETE'; setTimeout(() => { deleteArmed = false; el('btnDelete').textContent = 'DELETE SAVE'; }, 3000); return; }
  deleteArmed = false;
  el('btnDelete').textContent = 'DELETE SAVE';
  SaveSystem.del();
  UI.menu();
});
click('btnNewBack', () => UI.menu());
click('btnCreateBack', () => UI.newGame());
click('btnRandom', () => { UI.draftChar = randomChar(); UI.renderCharOpts(); });
click('btnCreateOk', () => UI.confirm());
click('btnConfirmBack', () => UI.create());
click('btnBegin', () => Game.newRun(UI.pendingDiff, UI.draftChar, el('chkIntro').checked));
click('btnResume', () => Game.resume());
const backToPause = () => { UI.hideAll(); UI.show('pause'); };
click('btnPauseSettings', () => UI.settings(backToPause));
click('btnPauseBag', () => { Game.setState('playing'); UI.openPanel('backpack'); });
click('btnPauseMap', () => { Game.setState('playing'); UI.openPanel('map'); });
click('btnStClose', () => UI.closePanel());
click('btnCrClose', () => UI.closePanel());
click('btnQuit', () => Game.quitToMenu());
click('btnDawn', () => Game.startDay());
click('btnLoad', () => Game.continueRun());
click('btnRestart', () => Game.newRun(Game.diffId, Game.char, false));
click('btnDeathMenu', () => Game.toMenu());
click('btnEndless', () => { UI.hideAll(); Game.setState('playing'); UI.banner('The forest is not finished with you', '', 3); });
click('btnVictoryMenu', () => Game.toMenu());

// ---------- boot ----------
Settings.load();
Records.load();
Sprites.init();
UI.hudInit();
UI.menu();
let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  try { Game.frame(dt); } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
