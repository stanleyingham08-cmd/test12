// ---------- progression ----------
const Prog = {
  level: 1, xp: 0, sp: 0, skills: {}, perks: [], perkPicks: 0, totalXp: 0,
  reset() { this.level = 1; this.xp = 0; this.sp = 0; this.skills = {}; this.perks = []; this.perkPicks = 0; this.totalXp = 0; },
  need(L = this.level) { return Math.round(70 * Math.pow(L, 1.32) + 30); },
  rank(id) { return this.skills[id] || 0; },
  hasPerk(id) { return this.perks.includes(id); },
  addXP(n, reason) {
    n = Math.round(n);
    if (n <= 0 || Game.state === 'menu') return;
    this.xp += n;
    this.totalXp += n;
    Game.stats.xp += n;
    Game.night.xp += n;
    if (reason && reason !== 'kill') FX.floater(Player.x + 30, Player.y - 20, `+${n} XP`, '#9fb8d8');
    while (this.xp >= this.need()) {
      this.xp -= this.need();
      this.level++;
      let extra = '';
      if (this.level % 4 === 0) { this.sp++; extra = '+1 skill point'; }
      if (PERK_LEVELS.includes(this.level)) { this.perkPicks++; extra += (extra ? ' · ' : '') + 'new perk'; }
      Player.hp = Math.min(Player.maxHp, Player.hp + 20);
      Sound.levelUp();
      UI.banner(`Level ${this.level}`, extra, 2.4, 'level');
      Objectives.on('level', this.level);
    }
  },
  canBuy(id) {
    const s = SKILL_BY_ID[id];
    const cost = s.cost || 1;
    if (this.rank(id) >= s.max) return { ok: false, why: 'MAXED' };
    if (s.req && !s.req.every(q => this.rank(q) > 0)) return { ok: false, why: 'Requires ' + s.req.map(q => SKILL_BY_ID[q].name).join(' + ') };
    const branchSpent = SKILLS.filter(k => k.b === s.b).reduce((a, k) => a + this.rank(k.id), 0);
    const tierNeed = [0, 1, 3, 6][s.tier];
    if (branchSpent < tierNeed) return { ok: false, why: `Spend ${tierNeed} points in ${BRANCHES.find(b => b.id === s.b).name}` };
    if (this.sp < cost) return { ok: false, why: `Needs ${cost} skill point${cost > 1 ? 's' : ''}` };
    return { ok: true };
  },
  buy(id) {
    const c = this.canBuy(id);
    if (!c.ok) { Sound.uiDeny(); return false; }
    this.sp -= SKILL_BY_ID[id].cost || 1;
    this.skills[id] = this.rank(id) + 1;
    Stats.compute();
    Sound.skillBuy();
    Objectives.on('skill', id);
    return true;
  },
  takePerk(id) {
    if (this.perkPicks <= 0 || this.hasPerk(id)) return false;
    this.perks.push(id);
    this.perkPicks--;
    Stats.compute();
    Sound.skillBuy();
    return true;
  },
  perkChoices() {
    // deterministic per pick so reopening the panel doesn't reroll
    const free = PERKS.filter(p => !this.hasPerk(p.id));
    const rng = new RNG(Game.seed + this.perks.length * 977);
    const out = [];
    while (out.length < Math.min(3, free.length)) {
      const p = rng.pick(free);
      if (!out.includes(p)) out.push(p);
    }
    return out;
  },
};

// ---------- inventory ----------
const Inv = {
  res: {}, stash: {}, ammo: {}, items: {}, keys: [], backpack: 0, flashTier: 1, crafted: [], notes: [],
  reset() {
    this.res = Object.fromEntries(RES_KEYS.map(k => [k, 0]));
    this.stash = Object.fromEntries(RES_KEYS.map(k => [k, 0]));
    this.ammo = { light: 24, shells: 0, rifle: 0 };
    this.items = Object.fromEntries(Object.keys(ITEMS).map(k => [k, 0]));
    this.items.bandage = 1;
    this.items.flare = 1;
    this.res.medical = 1;
    this.keys = []; this.backpack = 0; this.flashTier = 1; this.crafted = []; this.notes = [];
  },
  carryCap(k) { return Math.floor(RES[k].carry * (Stats.S.carryMul || 1)); },
  stashCap(k) { return Math.floor(RES[k].stash * (1 + 0.6 * Base.count('storage'))); },
  atBase() { return dist(Player.x, Player.y, BASE_C.x, BASE_C.y) < BUILD_RADIUS + 60; },
  total(k) {
    if (k in this.res) return this.res[k] + (this.atBase() ? this.stash[k] : 0);
    if (k in this.items) return this.items[k];
    return 0;
  },
  has(cost, mul = 1) {
    for (const k in cost) if (this.total(k) < Math.ceil(cost[k] * mul)) return false;
    return true;
  },
  spend(cost, mul = 1) {
    if (!this.has(cost, mul)) return false;
    for (const k in cost) {
      let n = Math.ceil(cost[k] * mul);
      if (k in this.res) {
        const fromStash = this.atBase() ? Math.min(this.stash[k], n) : 0;
        this.stash[k] -= fromStash;
        n -= fromStash;
        this.res[k] -= n;
      } else this.items[k] -= n;
    }
    return true;
  },
  missing(cost, mul = 1) {
    return Object.keys(cost).filter(k => this.total(k) < Math.ceil(cost[k] * mul)).map(k => `${Math.ceil(cost[k] * mul) - this.total(k)} ${(RES[k] || ITEMS[k]).name}`);
  },
  addRes(k, n) {
    const room = this.carryCap(k) - this.res[k];
    const add = clamp(n, 0, room);
    this.res[k] += add;
    if (add < n) {
      // overflow goes straight to the stash if standing at base
      if (this.atBase()) {
        const s = Math.min(n - add, this.stashCap(k) - this.stash[k]);
        this.stash[k] += s;
        if (s < n - add) UI.toast(`${RES[k].name} full`, 1.4, k);
        if (add + s > 0) { UI.feed(k, add + s); Game.stats.res += add + s; Game.night.res += add + s; Objectives.on('gather', k, add + s); }
        return add + s;
      }
      UI.toast(`${RES[k].name} full`, 1.4, k);
    }
    if (add > 0) { UI.feed(k, add); Game.stats.res += add; Game.night.res += add; Objectives.on('gather', k, add); }
    return add;
  },
  give(d) {
    // d: { t: 'res'|'ammo'|'item'|'key'|'weapon', id, n }
    if (d.t === 'res') { const a = this.addRes(d.id, d.n); return a > 0 ? `+${a} ${RES[d.id].name}` : null; }
    if (d.t === 'ammo') { const a = Math.min(d.n, AMMO[d.id].cap - this.ammo[d.id]); this.ammo[d.id] += a; if (a) UI.feed('ammo_' + d.id, a); return a > 0 ? `+${a} ${AMMO[d.id].name} ammo` : `${AMMO[d.id].name} ammo full`; }
    if (d.t === 'item') {
      if (d.id === 'skillBook') { Prog.sp++; UI.banner('Survival manual', '+1 skill point', 2.5, 'level'); return '+1 Skill Point'; }
      const a = Math.min(d.n, ITEMS[d.id].cap - this.items[d.id]); this.items[d.id] += a; if (a) UI.feed(d.id, a); return a > 0 ? `+${a} ${ITEMS[d.id].name}` : `${ITEMS[d.id].name} full`;
    }
    if (d.t === 'key') { if (!this.keys.includes(d.id)) this.keys.push(d.id); UI.notice('Found', KEY_ITEMS[d.id], d.id); Objectives.on('key', d.id); return KEY_ITEMS[d.id]; }
    if (d.t === 'weapon') return Player.giveWeapon(d.id);
    return null;
  },
  deposit() {
    let moved = 0;
    for (const k of RES_KEYS) {
      const n = Math.min(this.res[k], this.stashCap(k) - this.stash[k]);
      if (n > 0) { this.stash[k] += n; this.res[k] -= n; moved += n; }
    }
    return moved;
  },
  withdraw(k, n) {
    const m = Math.min(n, this.stash[k], this.carryCap(k) - this.res[k]);
    if (m > 0) { this.stash[k] -= m; this.res[k] += m; }
    return m;
  },
};

// ---------- loot ----------
const Loot = {
  roll(kind, rolls) {
    const table = LOOT[kind] || LOOT.household;
    const S = Stats.S, out = [];
    const tr = Prog.rank('treasure');
    const weight = { C: RARITY.C.w, U: RARITY.U.w, R: RARITY.R.w * (1 + tr * 0.8), VR: RARITY.VR.w * (1 + tr * 1.2) };
    for (let i = 0; i < rolls; i++) {
      const tot = table.reduce((a, e) => a + weight[e[0]], 0);
      let r = Math.random() * tot, e = table[0];
      for (const x of table) { r -= weight[x[0]]; if (r <= 0) { e = x; break; } }
      const [rar, t, id, a, b] = e;
      let n = randInt(a, b);
      if (t === 'res') n = Math.max(1, Math.round(n * S.lootMul * (id === 'fuel' && Prog.rank('siphon') ? 1.5 : 1)));
      if (t === 'ammo') n = Math.max(1, Math.round(n * S.ammoFind));
      out.push({ t, id, n, rar });
    }
    if (Prog.hasPerk('scavenger') && chance(0.25)) out.push({ t: 'res', id: pick(['scrap', 'wood', 'components']), n: 1, rar: 'U' });
    return out;
  },
};

// ---------- player ----------
const Player = {
  x: BASE_C.x, y: BASE_C.y + 60, r: 14, aim: 0, hp: 100, maxHp: 100, sta: 100, maxSta: 100,
  walk: 0, moving: false, sprinting: false, staDelay: 0, exhausted: false,
  weapon: 'pistol', weapons: {}, reloading: false, reloadT: 0, fireCD: 0, swingT: 0, swingDur: 0.3, recoil: 0, held: false,
  invuln: 0, shoveCD: 0, shoveT: 0, combatT: 99, healCD: 0, stepT: 0, noiseT: 0,
  building: null, onTower: null, secondWind: true, mealT: 0, adrenalT: 0, drinkT: 0, crouch: false,
  interact: null, interactT: 0, interactNeed: 0, prevInteract: null, gatherAnim: 0,
  light: { on: true, state: 'ok', failT: 40, flickT: 0, battery: 100, shakes: 0, lit: true },
  reset() {
    Object.assign(this, { x: BASE_C.x, y: BASE_C.y + 70, aim: -Math.PI / 2, walk: 0, moving: false, sprinting: false, staDelay: 0, exhausted: false,
      weapon: 'pistol', reloading: false, reloadT: 0, fireCD: 0, swingT: 0, recoil: 0, held: false, invuln: 0, shoveCD: 0, shoveT: 0,
      combatT: 99, healCD: 0, building: null, onTower: null, secondWind: true, mealT: 0, adrenalT: 0, interact: null, interactT: 0 });
    this.weapons = { hatchet: { mag: 0, lvl: 0 }, pistol: { mag: 12, lvl: 0 } };
    this.light = { on: true, state: 'ok', failT: 50, flickT: 0, battery: 100, shakes: 0, lit: true };
    Stats.compute();
    this.hp = this.maxHp;
    this.sta = this.maxSta;
  },
  owned() { return WEAPON_ORDER.filter(id => this.weapons[id]); },
  wstat(id = this.weapon) {
    const w = WEAPONS[id], lvl = (this.weapons[id] && this.weapons[id].lvl) || 0, S = Stats.S;
    const adrenal = Prog.rank('adrenal') && this.hp < this.maxHp * 0.3 ? 1.2 : 1;
    if (w.melee) return { dmg: w.dmg * (1 + lvl * 0.15) * S.dmgMelee * adrenal, rate: w.rate, range: w.range + lvl * 4, arc: w.arc, kb: w.kb };
    return {
      dmg: w.dmg * (1 + lvl * 0.12) * S.dmgFire * adrenal,
      rate: w.rate * S.rateMul,
      mag: Math.round(w.mag * (1 + lvl * 0.15) * S.magMul),
      reload: w.reload * (1 - lvl * 0.08) * S.reloadMul,
      spread: w.spread * S.spreadMul * (1 - lvl * 0.08),
    };
  },
  giveWeapon(id) {
    if (this.weapons[id]) {
      const w = WEAPONS[id];
      if (w.ammo) { const n = Math.round(w.mag * 1.5); Inv.ammo[w.ammo] = Math.min(AMMO[w.ammo].cap, Inv.ammo[w.ammo] + n); UI.feed('ammo_' + w.ammo, n); return `+${n} ${AMMO[w.ammo].name} ammo`; }
      Inv.res.scrap = Math.min(Inv.carryCap('scrap'), Inv.res.scrap + 4);
      return '+4 Scrap (duplicate)';
    }
    this.weapons[id] = { mag: WEAPONS[id].melee ? 0 : this.wstat(id).mag, lvl: 0 };
    this.switchTo(id);
    UI.notice('New weapon', WEAPONS[id].name, id);
    Sound.rareFind();
    Objectives.on('weapon', id);
    return WEAPONS[id].name;
  },
  switchTo(id) {
    if (!this.weapons[id] || this.weapon === id) return;
    this.weapon = id;
    this.reloading = false;
    this.fireCD = Math.max(this.fireCD, 0.18);
    Sound.switchWeapon();
    UI.weaponSwitched();
  },
  cycle(dir) {
    const o = this.owned(), i = o.indexOf(this.weapon);
    this.switchTo(o[(i + dir + o.length) % o.length]);
  },
  noiseR(kind) {
    const silent = Prog.rank('silent');
    if (kind === 'walk') return silent ? 0 : 70;
    if (kind === 'sprint') return NOISE.sprint * (silent ? 0.5 : 1);
    return NOISE[kind] || 200;
  },
  tip() {
    const w = WEAPONS[this.weapon];
    const l = w.melee ? 20 : ({ shotgun: 56, rifle: 60, ar: 54, smg: 44, revolver: 42 }[this.weapon] || 40);
    return { x: this.x + Math.cos(this.aim) * l + Math.cos(this.aim + Math.PI / 2) * 3, y: this.y + Math.sin(this.aim) * l + Math.sin(this.aim + Math.PI / 2) * 3 };
  },
  // flashlight rays clipped against walls (world walls, cabins, player-built walls)
  lightRays() {
    if (this._rayT === T && this._rays) return this._rays;
    const o = this.lightOrigin(), S = Stats.S;
    // never let the beam start on the far side of a wall the player is pressed against
    let ox = o.x, oy = o.y;
    const tw = World.rayHit(this.x, this.y, ox, oy, true), tb = Base.lightRayT(this.x, this.y, ox, oy);
    const t0 = Math.min(tw === null ? 1 : tw, tb === null ? 1 : tb);
    if (t0 < 1) { ox = lerp(this.x, ox, Math.max(0, t0 - 0.05)); oy = lerp(this.y, oy, Math.max(0, t0 - 0.05)); }
    this._rays = castLightRays(ox, oy, o.a, S.flashCone * 1.25, S.flashRange, 56);
    this._rayT = T;
    return this._rays;
  },
  inBeam(x, y, slack = 1.1) {
    const S = Stats.S, o = this.lightOrigin();
    const d = dist(o.x, o.y, x, y);
    if (d > S.flashRange * slack || angDiff(Math.atan2(y - o.y, x - o.x), o.a) > S.flashCone * slack) return false;
    return World.rayHit(o.x, o.y, x, y, true) === null && Base.lightRayT(o.x, o.y, x, y) === null;
  },
  lightOrigin() {
    const t = this.tip();
    const sway = this.moving ? Math.sin(this.walk * 0.5) * (this.sprinting ? 0.045 : 0.02) : Math.sin(T * 1.3) * 0.006;
    return { x: t.x, y: t.y, a: this.aim + sway };
  },

  update(dt) {
    const S = Stats.S;
    // aim follows the mouse cursor directly (instant, no smoothing)
    const sx = this.x - viewX, sy = this.y - viewY;
    this.aim = Math.atan2(Input.mouse.y - sy, Input.mouse.x - sx);

    let mx = 0, my = 0;
    if (Input.keys.KeyW || Input.keys.ArrowUp) my -= 1;
    if (Input.keys.KeyS || Input.keys.ArrowDown) my += 1;
    if (Input.keys.KeyA || Input.keys.ArrowLeft) mx -= 1;
    if (Input.keys.KeyD || Input.keys.ArrowRight) mx += 1;
    const len = Math.hypot(mx, my);
    this.moving = len > 0;
    // crouch: hold C or Left Ctrl — slower, silent footsteps
    this.crouch = !!(Input.keys.KeyC || Input.keys.ControlLeft) && !Build.active;
    const wantSprint = (Input.keys.ShiftLeft || Input.keys.ShiftRight) && this.moving && !this.exhausted && !this.crouch;
    this.sprinting = wantSprint && this.sta > 0;
    this.drinkT -= dt; this.adrenalT -= dt;
    if (this.mealT > 0 && !this.sprinting) this.sta = Math.min(this.maxSta, this.sta + 5 * dt);
    if (this.sprinting) {
      this.sta -= S.sprintCost * dt * (this.drinkT > 0 ? 0.6 : 1);
      this.staDelay = 0.9;
      if (this.sta <= 0) { this.sta = 0; this.exhausted = true; Sound.breath(); }
    } else {
      this.staDelay -= dt;
      if (this.staDelay <= 0 || this.drinkT > 0) this.sta = Math.min(this.maxSta, this.sta + S.staRegen * dt * (this.moving ? 0.7 : 1) * (this.mealT > 0 ? 1.6 : 1) * (this.drinkT > 0 ? 2.2 : 1));
      if (this.exhausted && this.sta > this.maxSta * 0.3) this.exhausted = false;
    }
    let spd = S.speed * (this.sprinting ? 1.55 : 1) * (this.exhausted ? 0.85 : 1) * (this.crouch ? 0.6 : 1) * (this.adrenalT > 0 ? 1.15 : 1);
    if (World.inGrass(this.x, this.y)) spd *= 0.86;
    if (inWater(this.x, this.y)) spd *= 0.5;
    if (Prog.rank('adrenal') && this.hp < this.maxHp * 0.3) spd *= 1.2;
    if (this.interact && this.interactT > 0) spd *= 0.25;
    if (this.moving) {
      this.x += (mx / len) * spd * dt;
      this.y += (my / len) * spd * dt;
      this.walk += dt * (this.sprinting ? 15 : this.crouch ? 7 : 10);
      this.stepT -= dt;
      if (this.stepT <= 0 && !this.crouch) {
        this.stepT = this.sprinting ? 0.28 : 0.42;
        Sound.footstep(this.sprinting);
        const nr = this.noiseR(this.sprinting ? 'sprint' : 'walk');
        if (nr > 0) Noise.emit(this.x, this.y, nr, 'step');
      }
    }
    World.collide(this, 'player');
    Base.collide(this, 'player');
    this.x = clamp(this.x, this.r, WORLD - this.r);
    this.y = clamp(this.y, this.r, WORLD - this.r);
    this.building = World.buildingAt(this.x, this.y);
    const st = Base.structAt(this.x, this.y);
    this.onTower = st && st.type === 'watchtower' && !st.destroyed ? st : null;

    // timers
    this.fireCD -= dt; this.swingT -= dt; this.invuln -= dt; this.shoveCD -= dt; this.shoveT -= dt; this.healCD -= dt;
    this.recoil = Math.max(0, this.recoil - dt * 6);
    this.combatT += dt; this.mealT -= dt;
    if (this.reloading) {
      this.reloadT -= dt;
      if (this.reloadT <= 0) this.finishReload();
    }
    // regeneration
    if (S.regen > 0 && this.combatT > 8 && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + S.regen * dt);
    const med = Base.nearType('medical', 140);
    if (med && this.combatT > 4 && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + 2.5 * dt);

    // shooting
    const w = WEAPONS[this.weapon];
    // semi-automatic weapons fire once per click; a quick click during cooldown is buffered
    const queued = T - Input.mouse.clickT < 0.4;
    if ((Input.mouse.down || queued) && !UI.blocking() && !Build.active) {
      if (w.melee) { if (this.fireCD <= 0) { this.melee(); Input.mouse.clickT = -9; } }
      else if (w.rate < 0.15 && Input.mouse.down) this.fire();
      else if ((!this.held || queued) && this.fireCD <= 0 && !this.reloading) { this.fire(); this.held = true; Input.mouse.clickT = -9; }
    }
    if (!Input.mouse.down) this.held = false;

    this.updateLight(dt);
    this.updateInteract(dt);
    World.reveal(this.x, this.y, (Clock.isNight() ? 260 : 520) * (this.onTower ? 2.2 : 1));
    if (Math.floor(T * 2) !== Math.floor((T - dt) * 2)) World.checkDiscovery();
  },

  fire() {
    if (this.reloading || this.fireCD > 0) return;
    const w = WEAPONS[this.weapon], st = this.wstat(), slot = this.weapons[this.weapon];
    if (slot.mag <= 0) {
      this.fireCD = 0.25;
      Sound.empty();
      if (Inv.ammo[w.ammo] > 0) this.startReload();
      else UI.toast('No ammo', 1.2, 'ammo_' + w.ammo);
      return;
    }
    slot.mag--;
    this.fireCD = st.rate;
    const t = this.tip();
    const n = w.pellets || 1;
    for (let i = 0; i < n; i++) {
      const a = this.aim + rand(-st.spread, st.spread) * (n > 1 ? 1 : 1) + rand(-this.recoil, this.recoil) * 0.5;
      const crit = chance(Stats.S.crit);
      Projectiles.add({ x: t.x, y: t.y, vx: Math.cos(a) * w.speed * rand(0.92, 1.05), vy: Math.sin(a) * w.speed * rand(0.92, 1.05), life: w.life,
        dmg: st.dmg * (crit ? Stats.S.critMul : 1), crit, kb: w.kb, pierce: (w.pierce || 0) + Stats.S.pierce, armorPierce: Stats.S.pierce > 0, owner: 'player', hit: new Set() });
    }
    this.recoil = Math.min(0.35, this.recoil + w.recoil * Stats.S.spreadMul);
    FX.muzzleT = 0.06;
    FX.muzzleBig = n > 1 || this.weapon === 'rifle';
    FX.shake(n > 1 || this.weapon === 'rifle' ? 0.14 : 0.06);
    FX.burst(this.weapon === 'shotgun' ? 'shell' : 'casing', this.x, this.y, 1, ['#c8a040'], [60, 120], [0.6, 1.0], [1, 1], this.aim + Math.PI / 2, 0.5);
    FX.burst('spark', t.x, t.y, 3, ['#ffd27a', '#fff2c0'], [100, 300], [0.05, 0.15], [1, 2], this.aim, 0.35);
    Sound.gunshot(this.weapon);
    Noise.emit(this.x, this.y, w.noise, 'gunshot');
    this.combatT = 0;
    if (slot.mag === 0 && Inv.ammo[w.ammo] > 0) this.startReload();
  },
  startReload() {
    const w = WEAPONS[this.weapon];
    if (w.melee || this.reloading) return;
    const slot = this.weapons[this.weapon];
    if (slot.mag >= this.wstat().mag || Inv.ammo[w.ammo] <= 0) return;
    this.reloading = true;
    this.reloadT = this.wstat().reload;
    Sound.reloadStart();
  },
  finishReload() {
    const w = WEAPONS[this.weapon], slot = this.weapons[this.weapon];
    const need = this.wstat().mag - slot.mag, n = Math.min(need, Inv.ammo[w.ammo]);
    slot.mag += n;
    Inv.ammo[w.ammo] -= n;
    this.reloading = false;
    Sound.reloadEnd();
  },
  melee() {
    const w = WEAPONS[this.weapon], st = this.wstat();
    const tired = this.sta < w.stamina;
    this.sta = Math.max(0, this.sta - w.stamina);
    this.staDelay = 0.7;
    this.fireCD = st.rate * (tired ? 1.6 : 1);
    this.swingT = this.swingDur = Math.min(0.32, st.rate * 0.8);
    Sound.swing();
    Noise.emit(this.x, this.y, w.noise, 'melee');
    let hits = 0;
    for (const z of Zombies.list) {
      const d = dist(this.x, this.y, z.x, z.y);
      if (d > st.range + z.r || angDiff(Math.atan2(z.y - this.y, z.x - this.x), this.aim) > st.arc) continue;
      const crit = chance(Stats.S.meleeCrit);
      let dmg = st.dmg * (tired ? 0.5 : 1) * (crit ? 2 : 1);
      Zombies.damage(z, dmg, Math.atan2(z.y - this.y, z.x - this.x), st.kb, z.x, z.y, Prog.rank('cleaver') ? 0.5 : 0.15, crit, 'melee');
      hits++;
    }
    if (hits) { Sound.hit(); this.combatT = 0; FX.shake(0.05); }
    // melee also damages a targeted harvestable or breaks a locked fence gate? keep it to zombies.
  },
  shove() {
    if (this.shoveCD > 0 || this.sta < 15) return;
    this.shoveCD = 1.1;
    this.shoveT = 0.25;
    this.sta -= 15;
    this.staDelay = 0.7;
    Sound.swing();
    for (const z of Zombies.list) {
      const d = dist(this.x, this.y, z.x, z.y);
      if (d < 72 + z.r && angDiff(Math.atan2(z.y - this.y, z.x - this.x), this.aim) < 1.1) {
        const a = Math.atan2(z.y - this.y, z.x - this.x);
        const k = z.type === 'brute' || z.type === 'tank' ? 0.3 : 1;
        z.kx += Math.cos(a) * 420 * k; z.ky += Math.sin(a) * 420 * k;
        z.stun = Math.max(z.stun, 0.9 * k);
        Sound.hit();
      }
    }
  },
  heal() {
    if (this.healCD > 0 || this.hp >= this.maxHp) return;
    const missing = this.maxHp - this.hp;
    let id = null;
    if (missing > 60 && Inv.items.medkit > 0) id = 'medkit';
    else if (Inv.items.bandage > 0) id = 'bandage';
    else if (Inv.items.medkit > 0) id = 'medkit';
    if (!id) { UI.toast('Nothing to heal with', 1.4, 'bandage'); Sound.uiDeny(); return; }
    this.useItem(id);
  },
  // food and drink only ever restore stamina; healing comes from bandages and medkits
  useItem(id) {
    if (Inv.items[id] <= 0) return false;
    const it = ITEMS[id], dur = Prog.rank('forager') ? 2 : 1;
    if (it.heal) {
      if (this.hp >= this.maxHp) return false;
      Inv.items[id]--;
      const amt = Math.min(this.maxHp - this.hp, it.heal * Stats.S.healMul);
      this.hp += amt;
      this.healCD = 1.2;
      Sound.heal();
      FX.floater(this.x, this.y - 26, `+${Math.round(amt)} HP`, '#9fd09a');
      return true;
    }
    if (it.drink) { Inv.items[id]--; this.sta = this.maxSta; this.drinkT = 20 * dur; this.exhausted = false; Sound.pickup(); return true; }
    if (it.boost) { Inv.items[id]--; this.sta = this.maxSta; this.adrenalT = 12 * dur; this.drinkT = 12 * dur; this.exhausted = false; Sound.heal(); return true; }
    return false;
  },
  eat() {
    if (Inv.total('food') <= 0) return false;
    Inv.spend({ food: 1 });
    this.mealT = 30 * (Prog.rank('forager') ? 2 : 1);
    this.sta = Math.min(this.maxSta, this.sta + 15);
    Sound.pickup();
    return true;
  },
  throwFlare() {
    if (Inv.items.flare <= 0) { UI.toast('No flares', 1.2, 'flare'); return; }
    Inv.items.flare--;
    const d = clamp(dist(this.x - viewX, this.y - viewY, Input.mouse.x, Input.mouse.y), 80, 380);
    Flares.add(this.x, this.y, this.x + Math.cos(this.aim) * d, this.y + Math.sin(this.aim) * d);
    Sound.flareThrow();
  },
  damage(dmg, src) {
    if (this.invuln > 0 || Game.state !== 'playing') return;
    const d = Game.diff;
    dmg *= d.zDmgMul * Stats.S.dmgTaken * (this.onTower ? 0.7 : 1);
    if (Prog.rank('unbreakable')) dmg = Math.min(dmg, this.maxHp * 0.3);
    this.hp -= dmg;
    this.invuln = 0.35;
    this.combatT = 0;
    Game.stats.dmgTaken += dmg;
    Game.night.dmgTaken += dmg;
    FX.hurtT = 0.4;
    if (this.hp < this.maxHp * 0.5 && Inv.items.bandage + Inv.items.medkit > 0) UI.keyHint([['Q', 'Heal']], 4, 'heal');
    FX.shake(0.18);
    if (dmg > 14 || chance(0.35)) FX.screenSplat();
    FX.blood(this.x, this.y, 10);
    Sound.hurt();
    if (src && src.x !== undefined) {
      const a = Math.atan2(this.y - src.y, this.x - src.x);
      this.x += Math.cos(a) * 10; this.y += Math.sin(a) * 10;
    }
    if (this.hp <= 0) {
      if (Prog.hasPerk('secondwind') && this.secondWind) {
        this.secondWind = false;
        this.hp = 1;
        this.invuln = 1.5;
        UI.banner('Not yet', '', 1.8, 'danger');
        return;
      }
      this.hp = 0;
      Game.die(src && src.type ? 'a ' + ZTYPES[src.type].name : 'the forest');
    }
  },

  // ----- flashlight -----
  updateLight(dt) {
    const L = this.light, night = Clock.isNight() || Clock.phase() === 'dusk';
    if (L.on && night) L.battery = Math.max(0, L.battery - dt * 0.16);
    if (L.state === 'ok') {
      if (L.on && night) {
        L.failT -= dt * (L.battery < 20 ? 2.2 : 1) * (Events.active === 'storm' ? 1.4 : 1);
        if (L.failT <= 0) { L.state = 'flicker'; L.flickT = rand(0.7, 1.3); }
      }
      L.lit = L.on && L.battery > 0;
    } else if (L.state === 'flicker') {
      L.flickT -= dt;
      L.lit = L.on && Math.random() < 0.45;
      if (Math.random() < 0.1) Sound.flicker();
      if (L.flickT <= 0) {
        if (chance(0.55)) { L.state = 'dead'; L.lit = false; L.shakes = 0; Sound.flicker(); UI.keyHint([['C', 'Shake']], 4, 'shake'); }
        else { L.state = 'ok'; L.failT = this.nextFail(); }
      }
    } else if (L.state === 'dead') {
      L.lit = false;
    }
    if (L.battery <= 0 && L.on && L.state === 'ok') L.lit = false;
  },
  nextFail() { return rand(28, 70) / Math.max(0.2, Stats.S.flashFail); },
  shakeLight() {
    const L = this.light;
    if (L.battery < 25 && Inv.items.battery > 0) {
      Inv.items.battery--;
      L.battery = 100; L.state = 'ok'; L.failT = this.nextFail();
      Sound.lightOn();
      UI.feed('battery', -1);
      return;
    }
    if (L.state !== 'dead' && L.state !== 'flicker') return;
    Sound.shake();
    L.shakes++;
    Noise.emit(this.x, this.y, 120, 'shake');
    if (chance(Game.diff.shakeChance + L.shakes * 0.12)) {
      L.state = 'ok'; L.failT = this.nextFail(); L.lit = L.on; Sound.lightOn();
    }
  },
  toggleLight() {
    this.light.on = !this.light.on;
    Sound.click();
  },

  // ----- interaction (hold E) -----
  // one check shared by the prompt and the E key: in range, clear line of sight, same room
  canReach(tx, ty, pad = 0, except = null, scoped = true) {
    const d = dist(this.x, this.y, tx, ty) || 1;
    const ex = tx + ((this.x - tx) / d) * pad, ey = ty + ((this.y - ty) / d) * pad;
    if (World.rayHit(this.x, this.y, ex, ey) !== null) return false;
    if (Base.rayBlocked(this.x, this.y, ex, ey, except)) return false;
    if (scoped && Base.anyHouseAt(tx, ty) !== Base.anyHouseAt(this.x, this.y)) return false;
    return true;
  },
  findInteract() {
    const px = this.x + Math.cos(this.aim) * 18, py = this.y + Math.sin(this.aim) * 18;
    const cands = [];
    const consider = (o, d, max, test) => { if (d < max) cands.push({ o, d, test }); };
    for (const c of World.containers) {
      if (c.looted || Math.abs(c.x - px) > 120 || Math.abs(c.y - py) > 120) continue;
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      consider({ kind: 'container', c }, rectDist(px, py, c), 52, () => this.canReach(cx, cy, 0));
    }
    for (const n of World.queryNodes(px, py, 90)) {
      if (n.chunks <= 0) continue;
      consider({ kind: 'node', n }, dist(px, py, n.x, n.y) - (n.r || 16), 46, () => this.canReach(n.x, n.y, (n.r || 16) + 3, null, false));
    }
    for (const g of World.gates) if (!g.open) consider({ kind: 'gate', g }, rectDist(px, py, g), 60, () => this.canReach(clamp(this.x, g.x, g.x + g.w), clamp(this.y, g.y, g.y + g.h), 2, null, false));
    const tl = World.locs.find(l => l.towerPos);
    if (tl && dist(px, py, tl.towerPos.x, tl.towerPos.y) < 110) consider({ kind: 'tower' }, dist(px, py, tl.towerPos.x, tl.towerPos.y) - 60, 60, () => this.canReach(tl.towerPos.x, tl.towerPos.y, 38, null, false));
    for (const s of Base.near(px, py, 90, true)) {
      const o = Base.interactFor(s);
      if (!o) continue;
      const wallish = WALLISH.has(s.type) || STRUCTS[s.type].roof;
      const r = s.rect;
      consider(o, rectDist(px, py, r) - 4, 50, () => this.canReach(clamp(this.x, r.x, r.x + r.w), clamp(this.y, r.y, r.y + r.h), 1, s, !wallish));
    }
    for (const p of Pickups.list) consider({ kind: 'pickup', p }, dist(px, py, p.x, p.y) - 20, 30, () => this.canReach(p.x, p.y, 0));
    cands.sort((a, b) => a.d - b.d);
    for (const c of cands) if (c.test()) return c.o;
    return null;
  },
  interactLabel(o) {
    // short verb + icons; no sentences
    if (!o) return null;
    if (o.kind === 'container') {
      const c = o.c;
      if (c.looted) return null;
      const name = containerName(c);
      if (c.lock && !Inv.keys.includes(c.lock)) return { name, verb: 'Locked', dim: true, chips: [['lock', null, false], [c.lock, null, false]] };
      return { name, verb: c.kind === 'note' ? 'Read' : 'Search', time: c.kind === 'note' ? 0.3 : (Prog.rank('scavking') ? 0.6 : 1.2) };
    }
    if (o.kind === 'node') {
      const n = o.n, [verb, k, name] = { tree: ['Chop', 'wood', 'Tree'], rock: ['Mine', 'stone', 'Rock'], scrap: ['Salvage', 'scrap', 'Scrap Pile'], woodpile: ['Take', 'wood', 'Firewood'] }[n.type];
      if (Inv.res[k] >= Inv.carryCap(k) && !Inv.atBase()) return { name, verb: 'Full', dim: true, chips: [[k, null, false]] };
      return { name, verb, time: this.gatherTime(n), chips: [[k, null, true]] };
    }
    if (o.kind === 'gate') {
      if (Inv.keys.includes(o.g.lock)) return { name: 'Gate', verb: 'Unlock', time: 1.2, chips: [[o.g.lock, null, true]] };
      return { name: 'Gate', verb: 'Locked', dim: true, chips: [['lock', null, false], [o.g.lock, null, false]] };
    }
    if (o.kind === 'tower') { const l = Endgame.label(); if (l) l.name = 'Radio Tower'; return l; }
    if (o.kind === 'pickup') return { name: pickupName(o.p.d), verb: 'Take', time: 0 };
    const l = Base.interactLabel(o);
    if (l) l.name = STRUCTS[o.s.type].name;
    return l;
  },
  gatherTime(n) {
    const S = Stats.S, axe = this.weapons.lumberaxe ? 1.7 : 1;
    if (n.type === 'tree') return 1.5 / (S.harvest * axe);
    if (n.type === 'woodpile') return 0.8 / S.harvest;
    if (n.type === 'rock') return 1.9 / S.mine;
    return 1.4 / S.mine;
  },
  updateInteract(dt) {
    const o = this.findInteract();
    const key = o ? (o.c || o.n || o.g || o.s || o.p || o.kind) : null;
    if (key !== this.prevInteract) { this.interactT = 0; this.prevInteract = key; }
    this.interact = o;
    const lab = this.interactLabel(o);
    const holding = Input.keys.KeyE && !UI.blocking() && !Build.active;
    if (lab && !lab.dim && lab.time !== undefined && holding) {
      this.interactT += dt;
      this.gatherAnim += dt;
      if (o.kind === 'node' && Math.floor(this.gatherAnim / 0.45) !== Math.floor((this.gatherAnim - dt) / 0.45)) {
        if (o.n.type === 'tree' || o.n.type === 'woodpile') Sound.chop(); else if (o.n.type === 'rock') Sound.mine(); else Sound.scrapSound();
        Noise.emit(this.x, this.y, o.n.type === 'tree' ? NOISE.chop : NOISE.mine, 'gather');
        FX.burst('splinter', o.n.x, o.n.y, 3, o.n.type === 'tree' ? ['#8a6a40', '#5a4028'] : o.n.type === 'rock' ? ['#888', '#666'] : ['#9aa', '#776'], [40, 120], [0.3, 0.6], [2, 4]);
      }
      if (o.kind === 'container' && Math.random() < dt * 3) Sound.rustle();
      if (this.interactT >= lab.time) {
        this.interactT = 0;
        this.doInteract(o);
      }
    } else if (!holding) this.interactT = 0;
    UI.prompt(lab, lab && lab.time ? this.interactT / lab.time : 0);
  },
  doInteract(o) {
    if (o.kind === 'container') return this.search(o.c);
    if (o.kind === 'node') return this.gather(o.n);
    if (o.kind === 'gate') { o.g.open = true; Sound.lootOpen(); UI.toast('Gate open', 1.4, o.g.lock); Prog.addXP(20, 'gate'); return; }
    if (o.kind === 'tower') return Endgame.interact();
    if (o.kind === 'pickup') return Pickups.collect(o.p);
    return Base.doInteract(o);
  },
  search(c) {
    if (c.looted) return;
    if (c.lock && !Inv.keys.includes(c.lock)) return;
    c.looted = true;
    c.lootedDay = Clock.day;
    if (!Prog.rank('scavking')) Noise.emit(this.x, this.y, NOISE.search, 'search');
    if (c.kind === 'note') {
      if (!Inv.notes.includes(c.note)) Inv.notes.push(c.note);
      UI.showNote(c.note);
      Prog.addXP(15, 'note');
      Objectives.on('note', c.note);
      return;
    }
    const lines = [];
    let rare = false;
    if (c.kind === 'fixed') {
      const f = c.fixed;
      if (f.chance !== undefined && Math.random() > f.chance) {
        if (f.alt.ammo) lines.push(Inv.give({ t: 'ammo', id: f.alt.ammo, n: f.alt.n }));
        if (f.alt.item) lines.push(Inv.give({ t: 'item', id: f.alt.item, n: f.alt.n }));
      } else {
        if (f.weapon) lines.push(Inv.give({ t: 'weapon', id: f.weapon }));
        if (f.ammo) lines.push(Inv.give({ t: 'ammo', id: f.ammo, n: f.n }));
        if (f.key) lines.push(Inv.give({ t: 'key', id: f.key }));
        if (f.item) lines.push(Inv.give({ t: 'item', id: f.item, n: f.n }));
        if (f.item2) lines.push(Inv.give({ t: 'item', id: f.item2, n: f.n2 }));
        rare = true;
      }
      Prog.addXP(25, 'find');
    } else {
      const rolls = c.rummaged ? 1 : randInt(1, 3);
      const drops = Loot.roll(c.kind, rolls);
      for (const d of drops) {
        const txt = Inv.give(d);
        if (txt) lines.push(d.rar === 'R' || d.rar === 'VR' ? `${txt} (${RARITY[d.rar].name})` : txt);
        if (d.rar === 'R' || d.rar === 'VR') { rare = true; Prog.addXP(d.rar === 'VR' ? 40 : 15, 'rare'); }
      }
      Prog.addXP(4, null);
    }
    Game.stats.searched++;
    Objectives.on('search', c.loc || c.kind);
    if (rare) Sound.rareFind(); else if (lines.length) Sound.lootOpen(); else Sound.lootEmpty();
    if (!lines.filter(Boolean).length) UI.feed('crate', 'empty');
  },
  gather(n) {
    const S = Stats.S, rm = Game.diff.resourceMul;
    let k, amt;
    if (n.type === 'tree') { k = 'wood'; amt = (3 + Prog.rank('lumberjack')) * rm; }
    else if (n.type === 'woodpile') { k = 'wood'; amt = 4 * rm; }
    else if (n.type === 'rock') { k = 'stone'; amt = (3 + Prog.rank('prospector')) * rm; }
    else { k = 'scrap'; amt = (2 + Prog.rank('prospector')) * rm; }
    amt = Math.max(1, Math.round(amt + (Prog.hasPerk('scavenger') && chance(0.25) ? 2 : 0)));
    if (Inv.res[k] >= Inv.carryCap(k) && !Inv.atBase()) { UI.toast(`${RES[k].name} full`, 1.4, k); Sound.uiDeny(); return; }
    n.chunks--;
    const got = Inv.addRes(k, amt);
    if (n.type === 'scrap' && (Prog.rank('tinkerer') ? chance(0.35) : chance(0.08))) { Inv.addRes('components', 1); }
    if (n.type === 'rock' && chance(0.06)) { Inv.addRes('scrap', 1); }
    Prog.addXP(2, null);
    if (n.chunks <= 0) {
      n.regrow = Clock.day + (n.type === 'tree' ? 4 : n.type === 'woodpile' ? 2 : 6);
      if (n.type === 'tree') { Sound.treeFall(); FX.burst('splinter', n.x, n.y, 18, ['#3d5a28', '#44602c', '#5a4028'], [60, 200], [0.4, 0.9], [2, 5]); FX.shake(0.08); }
      else Sound.mine();
      Prog.addXP(5, null);
    }
  },
};

// ---------- projectiles (player bullets, turret bullets, zombie spit) ----------
const Projectiles = {
  list: [], spit: [],
  reset() { this.list = []; this.spit = []; },
  add(b) { this.list.push(b); },
  addSpit(x, y, a, dmg) { this.spit.push({ x, y, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, life: 1.4, dmg }); },
  update(dt) {
    for (const b of this.list) {
      const nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
      const t = World.rayHit(b.x, b.y, nx, ny);
      let endT = t === null ? 1 : t;
      // zombies along the segment
      let hitZ = null, hz = endT;
      for (const z of Zombies.list) {
        if (b.hit.has(z) || z.dead) continue;
        const zt = segCircle(b.x, b.y, nx, ny, z.x, z.y, z.r + 2);
        if (zt !== null && zt <= hz) { hz = zt; hitZ = z; }
      }
      if (hitZ) {
        const hx = b.x + (nx - b.x) * hz, hy = b.y + (ny - b.y) * hz;
        b.hit.add(hitZ);
        Zombies.damage(hitZ, b.dmg, Math.atan2(b.vy, b.vx), b.kb, hx, hy, 0, b.crit, b.owner, b.armorPierce);
        if (b.pierce > 0) { b.pierce--; b.dmg *= 0.7; }
        else { b.life = 0; continue; }
      }
      if (t !== null) {
        const hx = b.x + (nx - b.x) * t, hy = b.y + (ny - b.y) * t;
        FX.burst('spark', hx, hy, 3, ['#ffd27a', '#aaa'], [50, 160], [0.05, 0.15], [1, 2]);
        b.life = 0;
        continue;
      }
      b.x = nx; b.y = ny;
      b.life -= dt;
    }
    this.list = this.list.filter(b => b.life > 0);
    for (const s of this.spit) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (Math.random() < 0.5) FX.burst('blood', s.x, s.y, 1, ['#8aa030', '#6a8020'], [10, 30], [0.2, 0.4], [1.5, 2.5]);
      const st = Base.structAt(s.x, s.y);
      if (st && !st.destroyed && STRUCTS[st.type].block === 'all') { Base.damage(st, s.dmg * 0.5, null); s.life = 0; }
      else if (World.rayHit(s.x - s.vx * dt, s.y - s.vy * dt, s.x, s.y) !== null) s.life = 0;
      else if (dist(s.x, s.y, Player.x, Player.y) < Player.r + 6) {
        Player.damage(s.dmg, { x: s.x - s.vx, y: s.y - s.vy, type: 'spitter' });
        s.life = 0;
      }
      if (s.life <= 0) { FX.decal(s.x, s.y, 8, 'rgba(110,140,30,0.45)'); Sound.hiss(s.x, s.y); }
    }
    this.spit = this.spit.filter(s => s.life > 0);
  },
};

// ---------- flares ----------
const Flares = {
  list: [],
  reset() { this.list = []; },
  add(x, y, tx, ty) { this.list.push({ x, y, sx: x, sy: y, tx, ty, fly: 0, flyDur: 0.55, landed: false, t: 30, rot: rand(0, TAU) }); },
  update(dt) {
    for (const f of this.list) {
      if (!f.landed) {
        f.fly += dt;
        const k = Math.min(1, f.fly / f.flyDur);
        f.x = lerp(f.sx, f.tx, k); f.y = lerp(f.sy, f.ty, k); f.rot += dt * 12;
        if (k >= 1) { f.landed = true; Sound.flareBurn(f.t); }
      } else {
        f.t -= dt;
        if (Math.random() < dt * 2) Noise.emit(f.x, f.y, 900, 'flare');
        if (Math.random() < 0.4) FX.burst('smoke', f.x, f.y, 1, ['#a05050', '#804040'], [5, 20], [1, 2], [3, 6]);
      }
    }
    this.list = this.list.filter(f => f.t > 0);
  },
};

// ---------- names for things in the world ----------
const CONTAINER_NAMES = { drawer: 'Drawer', cabinet: 'Medicine Cabinet', locker: 'Locker', mil: 'Military Crate', can: 'Fuel Cans', toolbox: 'Toolbox', crate: 'Crate', shelf: 'Shelf', chest: 'Chest', pack: 'Backpack', trunk: 'Car Trunk', note: 'Note', special: '', lockbox: '' };
function containerName(c) {
  if (c.label && !['Container', 'Shelf', 'Cabinet'].includes(c.label)) return c.label;
  return CONTAINER_NAMES[c.look] || c.label || 'Container';
}
function pickupName(d) {
  const id = d.t === 'ammo' ? 'ammo_' + d.id : d.id;
  return `${ITEM_NAME(id)}${d.n > 1 ? ` ×${d.n}` : ''}`;
}

// ---------- ground pickups (zombie drops) ----------
const Pickups = {
  list: [],
  reset() { this.list = []; },
  drop(x, y, d) { this.list.push({ x: x + rand(-10, 10), y: y + rand(-10, 10), d, t: 0, life: 90 }); },
  collect(p) {
    Inv.give(p.d);
    Sound.pickup();
    p.life = 0;
  },
  update(dt) {
    for (const p of this.list) {
      p.t += dt; p.life -= dt;
      const d = dist(p.x, p.y, Player.x, Player.y);
      if (d < 40 + Player.r && Player.canReach(p.x, p.y, 0)) {
        const k = Math.min(1, dt * 4.5);
        p.x += (Player.x - p.x) * k; p.y += (Player.y - p.y) * k;
        if (d < 16) this.collect(p);
      }
    }
    this.list = this.list.filter(p => p.life > 0);
  },
};

// =====================================================================
// BASE: grid structures, collision, damage, repair, power, traps, turrets
// =====================================================================
const Base = {
  // three layers share the tile grid: ground floors, structures, roofs
  list: [], grid: new Map(), floorGrid: new Map(), roofGrid: new Map(), nextId: 1, humNode: null, genNoiseT: 0,
  version: 0, houseCache: null, houseVer: -1, indoorK: 0, house: null, roofFade: new Map(),
  reset() {
    this.list = []; this.grid = new Map(); this.floorGrid = new Map(); this.roofGrid = new Map(); this.nextId = 1;
    this.version++; this.house = null; this.indoorK = 0; this.roofFade = new Map();
  },
  layerOf(type) { const d = STRUCTS[type]; return d.floor ? this.floorGrid : d.roof ? this.roofGrid : this.grid; },
  floorAt(x, y) { return this.floorGrid.get(this.key(Math.floor(x / TILE), Math.floor(y / TILE))) || null; },
  roofAt(x, y) { return this.roofGrid.get(this.key(Math.floor(x / TILE), Math.floor(y / TILE))) || null; },
  key(gx, gy) { return gx * 10000 + gy; },
  tilesOf(gx, gy, w, h) { const out = []; for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) out.push([gx + i, gy + j]); return out; },
  dims(type, rot) { const d = STRUCTS[type]; return rot ? [d.h, d.w] : [d.w, d.h]; },
  maxHpFor(type) {
    const d = STRUCTS[type];
    return Math.round(d.hp * (Stats.S.structHp || 1) * (d.gate && Prog.rank('reinforce') ? 1.6 : 1));
  },
  refreshHp() {
    for (const s of this.list) {
      const m = this.maxHpFor(s.type);
      if (m !== s.maxHp) { s.hp = s.destroyed ? 0 : Math.round(s.hp * m / s.maxHp); s.maxHp = m; }
    }
  },
  count(type) { return this.list.filter(s => s.type === type).length; },
  get(type) { return this.list.find(s => s.type === type && !s.destroyed) || null; },
  wbLevel() { const w = this.get('workbench'); return w ? w.lvl : 0; },
  structAt(x, y) {
    const s = this.grid.get(this.key(Math.floor(x / TILE), Math.floor(y / TILE)));
    return s || null;
  },
  near(x, y, r, layers = false) {
    const out = new Set();
    const g0x = Math.floor((x - r) / TILE), g1x = Math.floor((x + r) / TILE), g0y = Math.floor((y - r) / TILE), g1y = Math.floor((y + r) / TILE);
    for (let gx = g0x; gx <= g1x; gx++) for (let gy = g0y; gy <= g1y; gy++) {
      const k = this.key(gx, gy);
      const s = this.grid.get(k);
      if (s) out.add(s);
      if (layers) { const f = this.floorGrid.get(k), rf = this.roofGrid.get(k); if (f) out.add(f); if (rf) out.add(rf); }
    }
    return [...out];
  },
  nearType(type, r, x = Player.x, y = Player.y) {
    for (const s of this.list) if (s.type === type && !s.destroyed && rectDist(x, y, s.rect) < r) return s;
    return null;
  },
  canPlace(type, gx, gy, rot) {
    const d = STRUCTS[type], [w, h] = this.dims(type, rot);
    const rect = { x: gx * TILE, y: gy * TILE, w: w * TILE, h: h * TILE };
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    if (dist(cx, cy, BASE_C.x, BASE_C.y) > BUILD_RADIUS) return { ok: false, why: 'Too far' };
    // floors are ground: only same-layer tiles block (a wall can stand on a floor, a floor can go under furniture)
    const layer = this.layerOf(type);
    for (const [tx, ty] of this.tilesOf(gx, gy, w, h)) if (layer.has(this.key(tx, ty))) return { ok: false, why: 'Blocked' };
    if (d.roof && !this.roofSupported(gx, gy)) return { ok: false, why: 'Needs floor or walls' };
    if (d.unique && this.count(type)) return { ok: false, why: 'Already built' };
    if ((d.wb || 0) > this.wbLevel() && !(type === 'turret' && Prog.rank('sentry') && this.wbLevel() >= 2)) return { ok: false, why: `Workbench ${'I'.repeat(d.wb || 1)}` };
    if (inLake(cx, cy, 10)) return { ok: false, why: 'Water' };
    let blocked = false;
    World.cellsNear(cx, cy, Math.max(rect.w, rect.h), cell => {
      for (const c of cell.circles) if (rectDist(c.x, c.y, rect) < c.r) blocked = true;
      for (const r of cell.rects) if (r.x < rect.x + rect.w && r.x + r.w > rect.x && r.y < rect.y + rect.h && r.y + r.h > rect.y) blocked = true;
      for (const n of cell.nodes) { const sr = World.nodeSolid(n); if (sr > 0 && rectDist(n.x, n.y, rect) < sr) blocked = true; }
    });
    if (blocked && !d.roof) return { ok: false, why: 'Blocked' };
    if (d.block !== 'none' && d.block !== 'zombie' && rectDist(Player.x, Player.y, rect) < Player.r) return { ok: false, why: 'Blocked' };
    if (d.block !== 'none' && Zombies.list.some(z => rectDist(z.x, z.y, rect) < z.r)) return { ok: false, why: 'Blocked' };
    if (!Inv.has(d.cost, Stats.S.structCost)) return { ok: false, why: 'Missing materials', cost: true };
    return { ok: true };
  },
  place(type, gx, gy, rot = 0, free = false) {
    const d = STRUCTS[type], [w, h] = this.dims(type, rot);
    const maxHp = this.maxHpFor(type);
    const s = { id: this.nextId++, type, gx, gy, w, h, rot, rect: { x: gx * TILE, y: gy * TILE, w: w * TILE, h: h * TILE }, hp: maxHp, maxHp, destroyed: false, on: true,
      fuel: d.generator ? 4 : 0, lvl: 1, armed: true, ammo: d.turret ? 60 : 0, cd: 0, ang: rand(0, TAU), powered: false, hitT: 0, rearmT: 0 };
    s.cx = s.rect.x + s.rect.w / 2; s.cy = s.rect.y + s.rect.h / 2;
    const layer = this.layerOf(type);
    for (const [tx, ty] of this.tilesOf(gx, gy, w, h)) layer.set(this.key(tx, ty), s);
    this.list.push(s);
    this.version++;
    if (!free) {
      Inv.spend(d.cost, Stats.S.structCost);
      Sound.build();
      Noise.emit(s.cx, s.cy, NOISE.build, 'build');
      FX.burst('splinter', s.cx, s.cy, 8, ['#8a6a40', '#5a4028', '#999'], [40, 120], [0.3, 0.6], [2, 4]);
      Prog.addXP(3, null);
      Game.stats.built++;
      Objectives.on('build', type);
      Game.markDirty();
    }
    return s;
  },
  remove(s, refund) {
    const layer = this.layerOf(s.type);
    for (const [tx, ty] of this.tilesOf(s.gx, s.gy, s.w, s.h)) if (layer.get(this.key(tx, ty)) === s) layer.delete(this.key(tx, ty));
    this.list = this.list.filter(q => q !== s);
    this.version++;
    if (refund) {
      const k = (Prog.rank('tinkerer') ? 1 : 0.5) * (s.destroyed ? 0.3 : s.hp / s.maxHp);
      const cost = STRUCTS[s.type].cost;
      for (const r in cost) if (r in Inv.res) { const n = Math.floor(cost[r] * k); if (n) Inv.addRes(r, n); }
      Sound.demolish();
      Game.markDirty();
    }
  },
  blocks(s, who) {
    if (s.destroyed) return false;
    const b = STRUCTS[s.type].block;
    if (b === 'all') return true;
    if (b === 'zombie') return who !== 'player' && who !== 'bullet';
    return false;
  },
  collide(o, who, ignoreClimbable = false) {
    let hit = null;
    for (const s of this.near(o.x, o.y, o.r + 2)) {
      if (!this.blocks(s, who)) continue;
      if (ignoreClimbable && STRUCTS[s.type].wall && !STRUCTS[s.type].noClimb) continue;
      if (pushOutRect(o, s.rect)) hit = s;
    }
    return hit;
  },
  damage(s, dmg, z) {
    if (s.destroyed) return;
    s.hp -= dmg;
    s.hitT = 0.15;
    Game.night.baseDmg += dmg;
    if (Math.random() < 0.5) FX.burst('splinter', s.cx + rand(-10, 10), s.cy + rand(-10, 10), 2, ['#8a6a40', '#5a4028', '#888'], [40, 120], [0.3, 0.6], [2, 4]);
    const d = STRUCTS[s.type];
    if (z) {
      if (d.thorns || (d.gate && Prog.rank('reinforce'))) Zombies.damage(z, (d.thorns || 6) * Stats.S.trapMul, Math.atan2(z.y - s.cy, z.x - s.cx), 40, z.x, z.y, 0, false, 'trap');
      if (d.shock && s.powered) {
        Zombies.damage(z, 22 * Stats.S.trapMul, Math.atan2(z.y - s.cy, z.x - s.cx), 160, z.x, z.y, Prog.rank('automation') ? 0.9 : 0.3, false, 'trap');
        FX.burst('spark', z.x, z.y, 6, ['#9fdfff', '#fff'], [80, 220], [0.08, 0.2], [1, 2]);
        Sound.zap(s.cx, s.cy);
      }
    }
    if (s.hp <= 0) {
      s.hp = 0;
      s.destroyed = true;
      this.version++;
      Sound.structBreak(s.cx, s.cy);
      FX.burst('splinter', s.cx, s.cy, 16, ['#8a6a40', '#5a4028', '#777'], [60, 200], [0.4, 0.9], [2, 5]);
      FX.burst('smoke', s.cx, s.cy, 6, ['#555', '#444'], [10, 40], [1, 2], [6, 12]);
      Game.night.destroyed++;
      if (dist(s.cx, s.cy, Player.x, Player.y) < 900) UI.toast(`${STRUCTS[s.type].name} destroyed`, 1.8, 'wall');
    } else if (Math.random() < 0.25) Sound.structHit(s.cx, s.cy);
  },
  hammerable(s) { return !s.destroyed && Inv.items.hammer > 0 && (WALLISH.has(s.type) || s.type === 'barricade'); },
  repairCost(s) {
    const frac = s.destroyed ? 1 : 1 - s.hp / s.maxHp;
    if (this.hammerable(s)) return { wood: Math.max(1, Math.ceil(8 * frac * Stats.S.repairCost)) };
    const out = {};
    const cost = STRUCTS[s.type].cost;
    for (const k in cost) if (k in RES) out[k] = Math.max(1, Math.ceil(cost[k] * frac * 0.6 * Stats.S.repairCost));
    return out;
  },
  // ----- interaction -----
  interactFor(s) {
    const d = STRUCTS[s.type];
    if (s.destroyed) return { kind: 'struct', s, act: 'repair' };
    if (s.hp < s.maxHp * 0.98 && (s.hp < s.maxHp * 0.7 || !this.typeAction(s))) return { kind: 'struct', s, act: 'repair' };
    const a = this.typeAction(s);
    return a ? { kind: 'struct', s, act: a } : null;
  },
  typeAction(s) {
    const d = STRUCTS[s.type];
    if (d.generator) return s.fuel < this.fuelCap(s) - 0.5 && Inv.total('fuel') > 0 ? 'fuel' : 'toggle';
    if (s.type === 'campfire') return 'rest';
    if (s.type === 'storage') return 'open';
    if (d.workbench) return 'craft';
    if (d.turret) return 'refill';
    if (s.type === 'bear_trap' && !s.armed) return 'rearm';
    if (d.power) return 'toggle';
    if (s.type === 'garden' || s.type === 'water') return null;
    return null;
  },
  interactLabel(o) {
    const s = o.s;
    const hm = 1 - Prog.rank('handyman') * 0.25;
    if (o.act === 'repair') {
      if (s.destroyed && Clock.isNight()) return { verb: 'Destroyed', dim: true, chips: [['sun', null, false]] };
      if (Inv.items.repairkit > 0) return { verb: 'Repair', time: 0.6 * hm, chips: [['repairkit', 1, true]] };
      const c = this.repairCost(s), ham = this.hammerable(s);
      return { verb: s.destroyed ? 'Rebuild' : 'Repair', time: (s.destroyed ? 2.2 : ham ? 0.65 : 1.3) * hm, chips: (ham ? [['hammer', null, true]] : []).concat(costChips(c)), dim: !Inv.has(c), meter: s.hp / s.maxHp };
    }
    if (o.act === 'fuel') return { verb: 'Refuel', time: 0.5, chips: [['fuel', Inv.total('fuel'), true]], meter: s.fuel / this.fuelCap(s) };
    if (o.act === 'toggle') return { verb: s.broken ? 'Restart' : s.on ? 'Switch off' : 'Switch on', time: s.broken ? 2.5 : 0.25, meter: STRUCTS[s.type].generator ? s.fuel / this.fuelCap(s) : undefined };
    if (o.act === 'rest') {
      if (Clock.isNight() || Clock.phase() === 'dusk' || Clock.hour() >= 18) return null;
      return { verb: 'Rest', time: 1.2, chips: [['moon', null, true]] };
    }
    if (o.act === 'open') return { verb: 'Open', time: 0 };
    if (o.act === 'craft') return { verb: 'Craft', time: 0 };
    if (o.act === 'refill') return s.ammo >= 200 ? null : { verb: 'Load', time: 0.5, chips: [['scrap', 1, Inv.total('scrap') > 0]], meter: s.ammo / 200 };
    if (o.act === 'rearm') return { verb: 'Rearm', time: 0.8, chips: [['scrap', 1, Inv.total('scrap') > 0]] };
    return null;
  },
  doInteract(o) {
    const s = o.s, d = STRUCTS[s.type];
    if (o.act === 'repair') {
      if (s.destroyed && Clock.isNight()) return;
      if (Inv.items.repairkit > 0) Inv.items.repairkit--;
      else if (!Inv.spend(this.repairCost(s))) return;
      s.destroyed = false;
      s.hp = s.maxHp;
      this.version++;
      if (d.turret && s.ammo <= 0) s.ammo = 20;
      Sound.repair();
      Prog.addXP(3, null);
      Objectives.on('repair', s.type);
      Game.markDirty();
      return;
    }
    if (o.act === 'fuel') {
      Inv.spend({ fuel: 1 });
      s.fuel = Math.min(this.fuelCap(s), s.fuel + 1);
      Sound.pickup();
      Objectives.on('fuel');
      return;
    }
    if (o.act === 'toggle') {
      if (s.broken) { s.broken = false; Sound.lightOn(); UI.feed('s:generator', 'on'); return; }
      s.on = !s.on; Sound.click(); this.allocatePower(); return;
    }
    if (o.act === 'rest') return Clock.rest();
    if (o.act === 'open') return UI.openStorage();
    if (o.act === 'craft') return UI.openCrafting();
    if (o.act === 'refill') {
      if (!Inv.spend({ scrap: 1 })) { UI.toast('Need scrap', 1.2, 'scrap'); return; }
      s.ammo = Math.min(200, s.ammo + 10); Sound.reloadEnd(); return;
    }
    if (o.act === 'rearm') { if (Inv.spend({ scrap: 1 })) { s.armed = true; Sound.trapSnap(s.cx, s.cy); } return; }
  },
  // ----- power -----
  fuelCap(g) { return 10 + g.lvl * 5; },
  capacity() {
    const g = this.get('generator');
    if (!g) return 0;
    return GENERATOR_LEVELS[g.lvl].cap + (Stats.S.genBonus || 0);
  },
  consumers() { return this.list.filter(s => STRUCTS[s.type].power).sort((a, b) => a.id - b.id); },
  draw(s) {
    const d = STRUCTS[s.type];
    if (!d.power || !s.on || s.destroyed) return 0;
    if ((d.light || d.searchlight) && !(Clock.isNight() || Clock.phase() === 'dusk')) return 0;
    return d.power * Stats.S.powerMul;
  },
  genRunning() {
    const g = this.get('generator');
    return !!g && g.on && g.fuel > 0 && !g.broken;
  },
  allocatePower() {
    const cap = this.genRunning() ? this.capacity() : 0;
    let used = 0;
    for (const s of this.consumers()) {
      const p = this.draw(s);
      s.powered = false;
      if (p <= 0) continue;
      if (used + p <= cap) { used += p; s.powered = true; }
    }
    this.used = used;
    return used;
  },
  usage() { return this.consumers().reduce((a, s) => a + this.draw(s), 0); },
  lights() {
    const out = [];
    const night = Clock.isNight() || Clock.phase() === 'dusk';
    for (const s of this.list) {
      if (s.destroyed) continue;
      if (s.type === 'campfire') out.push({ x: s.cx, y: s.cy, r: 260, rgb: '255,120,40', fire: true });
      else if (s.type === 'torch') out.push({ x: s.cx, y: s.cy - 6, r: 230, rgb: '255,150,60', fire: true });
      else if (s.type === 'lamp' && s.powered && night) out.push({ x: s.cx, y: s.cy, r: 250, rgb: '255,220,160' });
      else if (s.type === 'searchlight' && s.powered && night) out.push({ x: s.cx, y: s.cy, r: 80, rgb: '220,230,255', cone: { a: s.ang, len: 760, half: 0.2 } });
    }
    return out;
  },
  update(dt) {
    this.updateIndoor(dt);
    this.allocatePower();
    const g = this.get('generator');
    const running = this.genRunning();
    if (running) {
      const load = this.capacity() ? this.used / this.capacity() : 0;
      g.fuel = Math.max(0, g.fuel - dt * (0.004 + 0.014 * load) * (Stats.S.fuelMul || 1));
      this.genNoiseT -= dt;
      if (this.genNoiseT <= 0) { this.genNoiseT = 3; Noise.emit(g.cx, g.cy, 650, 'generator'); }
      if (g.fuel <= 0) UI.toast('Generator out of fuel', 2, 'fuel');
    }
    // generator hum (positional)
    if (Sound.ok()) {
      if (!this.humNode) this.humNode = Sound.generatorHum();
      if (this.humNode) {
        const d = g ? dist(g.cx, g.cy, Player.x, Player.y) : 9999;
        const v = running && Game.state === 'playing' ? clamp(1 - d / 900, 0, 1) * 0.07 : 0;
        this.humNode.g.gain.setTargetAtTime(v, Sound.t(), 0.2);
        if (this.humNode.p && g) this.humNode.p.pan.value = clamp(Math.sin(wrapAngle(Math.atan2(g.cy - Player.y, g.cx - Player.x) - Player.aim)), -1, 1) * 0.8;
      }
    }
    const S = Stats.S;
    for (const s of this.list) {
      s.hitT = Math.max(0, s.hitT - dt);
      if (s.destroyed) continue;
      const d = STRUCTS[s.type];
      if (d.trap) this.updateTrap(s, dt);
      if (d.turret && s.powered) this.updateTurret(s, dt);
      if (d.searchlight && s.powered) {
        let target = null, bd = 760;
        for (const z of Zombies.list) { const dd = dist(z.x, z.y, s.cx, s.cy); if (dd < bd) { bd = dd; target = z; } }
        if (target) s.ang += clamp(wrapAngle(Math.atan2(target.y - s.cy, target.x - s.cx) - s.ang), -dt * 1.5, dt * 1.5);
        else s.ang += dt * 0.4;
      }
      if (Prog.rank('automation') && !Clock.isNight() && s.hp < s.maxHp) s.hp = Math.min(s.maxHp, s.hp + s.maxHp * 0.01 * dt);
    }
  },
  updateTrap(s, dt) {
    const d = STRUCTS[s.type], S = Stats.S;
    if (s.type === 'bear_trap' && !s.armed) {
      if (Prog.rank('trapper') >= 2) { s.rearmT += dt; if (s.rearmT > 20) { s.armed = true; s.rearmT = 0; } }
      return;
    }
    for (const z of Zombies.list) {
      if (z.dead || rectDist(z.x, z.y, s.rect) > z.r * 0.5) continue;
      if (d.trap === 'wire') {
        Zombies.damage(z, 6 * S.trapMul * dt, 0, 0, z.x, z.y, 0, false, 'trap', false, true);
        z.slowT = 0.35; z.slowK = 0.4;
        s.hp -= 1.5 * dt;
        if (Math.random() < dt * 2) FX.blood(z.x, z.y, 1);
      } else if (d.trap === 'spike') {
        Zombies.damage(z, 22 * S.trapMul * dt, 0, 0, z.x, z.y, 0, false, 'trap', false, true);
        z.slowT = 0.4; z.slowK = 0.45;
        s.hp -= 4 * dt;
        if (Math.random() < dt * 4) FX.blood(z.x, z.y, 2);
      } else if (d.trap === 'bear' && s.armed) {
        s.armed = false;
        z.pinT = 4;
        Zombies.damage(z, 70 * S.trapMul, 0, 0, z.x, z.y, 0, false, 'trap');
        Sound.trapSnap(s.cx, s.cy);
        FX.blood(z.x, z.y, 14);
        break;
      }
    }
    if (s.hp <= 0) { s.hp = 0; s.destroyed = true; }
  },
  updateTurret(s, dt) {
    s.cd -= dt;
    if (s.ammo <= 0) return;
    let target = null, bd = 540;
    for (const z of Zombies.list) {
      if (z.dead) continue;
      const d = dist(z.x, z.y, s.cx, s.cy);
      if (d < bd && World.rayHit(s.cx, s.cy, z.x, z.y) === null) { bd = d; target = z; }
    }
    if (!target) return;
    const want = Math.atan2(target.y - s.cy, target.x - s.cx);
    s.ang += clamp(wrapAngle(want - s.ang), -dt * 6, dt * 6);
    if (s.cd <= 0 && angDiff(want, s.ang) < 0.15) {
      s.cd = 0.3;
      s.ammo--;
      const a = s.ang + rand(-0.03, 0.03);
      Projectiles.add({ x: s.cx + Math.cos(a) * 22, y: s.cy + Math.sin(a) * 22, vx: Math.cos(a) * 1300, vy: Math.sin(a) * 1300, life: 0.5,
        dmg: 20 * (Prog.rank('sentry') ? 1.4 : 1), crit: false, kb: 80, pierce: 0, owner: 'turret', hit: new Set() });
      Sound.turretShot(s.cx, s.cy);
      FX.flashes.push({ x: s.cx + Math.cos(a) * 22, y: s.cy + Math.sin(a) * 22, t: 0.05 });
      Noise.emit(s.cx, s.cy, 500, 'turret');
    }
  },
  dawn() {
    const out = [];
    for (const s of this.list) {
      if (s.destroyed) continue;
      const d = STRUCTS[s.type];
      if (d.produce) {
        const n = s.type === 'garden' ? 3 : 2;
        const add = Math.min(n, Inv.stashCap(d.produce) - Inv.stash[d.produce]);
        Inv.stash[d.produce] += add;
        if (add) out.push([d.produce, add]);
      }
      if (s.type === 'bear_trap' && Prog.rank('trapper') >= 2) s.armed = true;
    }
    return out;
  },
  serialize() {
    return this.list.map(s => ({ type: s.type, gx: s.gx, gy: s.gy, rot: s.rot, hp: Math.round(s.hp), destroyed: s.destroyed, on: s.on, fuel: s.fuel, lvl: s.lvl, armed: s.armed, ammo: s.ammo }));
  },
  restore(arr) {
    this.reset();
    for (const o of arr) {
      const s = this.place(o.type, o.gx, o.gy, o.rot, true);
      Object.assign(s, { hp: o.hp, destroyed: o.destroyed, on: o.on, fuel: o.fuel, lvl: o.lvl, armed: o.armed, ammo: o.ammo });
    }
    this.refreshHp();
  },
  starterCamp() {
    const g = Math.floor(BASE_C.x / TILE), h = Math.floor(BASE_C.y / TILE);
    this.place('campfire', g, h, 0, true);
    this.place('storage', g + 3, h - 1, 0, true);
  },
};

// ---------- build mode ----------
const Build = {
  active: false, cat: 0, idx: 0, rot: 0, ghost: null,
  items(cat = this.cat) { return Object.keys(STRUCTS).filter(k => STRUCTS[k].cat === STRUCT_CATS[cat]); },
  current() { return this.items()[this.idx] || this.items()[0]; },
  toggle(force) {
    const want = force !== undefined ? force : !this.active;
    if (want && !Inv.atBase()) { UI.toast('Too far from camp', 1.4, 'wall'); Sound.uiDeny(); return; }
    this.active = want;
    Sound.uiClick();
    UI.buildBar();
  },
  setCat(c) { this.cat = clamp(c, 0, STRUCT_CATS.length - 1); this.idx = 0; Sound.uiClick(); UI.buildBar(); },
  cycle(dir) {
    const n = this.items().length;
    this.idx = (this.idx + dir + n) % n;
    Sound.uiClick();
    UI.buildBar();
  },
  select(type) { this.cat = STRUCT_CATS.indexOf(STRUCTS[type].cat); this.idx = this.items().indexOf(type); UI.buildBar(); },
  update() {
    if (!this.active) { this.ghost = null; return; }
    if (!Inv.atBase()) { this.toggle(false); return; }
    const type = this.current(), [w, h] = Base.dims(type, this.rot);
    const wx = Input.mouse.x + viewX, wy = Input.mouse.y + viewY;
    const gx = Math.round(wx / TILE - w / 2), gy = Math.round(wy / TILE - h / 2);
    const chk = Base.canPlace(type, gx, gy, this.rot);
    const hover = Base.structAt(wx, wy) || Base.roofAt(wx, wy) || Base.floorAt(wx, wy);
    this.ghost = { type, gx, gy, w, h, ok: chk.ok, why: chk.why, hover };
  },
  click() {
    if (!this.ghost) return;
    if (!this.ghost.ok) { Sound.uiDeny(); return; }
    Base.place(this.ghost.type, this.ghost.gx, this.ghost.gy, this.rot);
    UI.buildBar();
  },
  demolish() {
    const s = this.ghost && this.ghost.hover;
    if (!s) return;
    if (s.type === 'campfire' && Base.count('campfire') <= 1) { UI.toast('Keep one campfire', 1.4, 's:campfire'); return; }
    Base.remove(s, true);
    UI.buildBar();
  },
};

// ---------- houses: floors enclosed by walls and covered by roofs ----------
const LIGHT_BLOCK = new Set(['wall_wood', 'wall_stone', 'wall_metal', 'door', 'gate_wood', 'gate_metal']);
const WALLISH = new Set(['wall_wood', 'wall_stone', 'wall_metal', 'window', 'door', 'gate_wood', 'gate_metal', 'electric_fence']);
Object.assign(Base, {
  isWall(k) { const s = this.grid.get(k); return !!s && !s.destroyed && WALLISH.has(s.type); },
  hasFloor(k) { const s = this.floorGrid.get(k); return !!s && !s.destroyed; },
  hasRoof(k) { const s = this.roofGrid.get(k); return !!s && !s.destroyed; },
  // a roof needs something to rest on: a floor or wall under it, next to a wall or another roof
  roofSupported(gx, gy) {
    const k = this.key(gx, gy);
    if (!this.floorGrid.has(k) && !this.isWall(k)) return false;
    if (this.isWall(k)) return true;
    for (const n of [k + 1, k - 1, k + 10000, k - 10000]) if (this.isWall(n) || this.roofGrid.has(n)) return true;
    return false;
  },
  // flood fill from every floor tile: walls (and doors) form the perimeter; reaching a tile
  // without a floor means the space is open. Every enclosed tile must also be roofed.
  checkEnclosedSpace() {
    if (this.houseVer === this.version && this.houseCache) return this.houseCache;
    const houses = [], byKey = new Map(), seen = new Set();
    for (const [k0] of this.floorGrid) {
      if (seen.has(k0) || this.isWall(k0) || !this.hasFloor(k0)) continue;
      const tiles = [], q = [k0], windows = [], perim = new Set();
      let open = false, roofed = true;
      seen.add(k0);
      while (q.length) {
        const k = q.pop();
        tiles.push(k);
        if (!this.hasFloor(k)) { open = true; break; }
        if (!this.hasRoof(k)) roofed = false;
        if (tiles.length > 900) { open = true; break; }
        for (const n of [k + 1, k - 1, k + 10000, k - 10000]) {
          if (this.isWall(n)) { if (!perim.has(n)) { perim.add(n); if (this.grid.get(n).type === 'window') windows.push(this.grid.get(n)); } continue; }
          if (!seen.has(n)) { seen.add(n); q.push(n); }
        }
      }
      if (open || !roofed) continue;
      const h = { id: houses.length + 1, tiles: new Set(tiles), windows, perim, rects: tiles.map(k => ({ x: Math.floor(k / 10000) * TILE, y: (k % 10000) * TILE, w: TILE, h: TILE })) };
      let sx = 0, sy = 0;
      for (const k of tiles) { sx += Math.floor(k / 10000); sy += k % 10000; byKey.set(k, h); }
      h.cx = (sx / tiles.length + 0.5) * TILE; h.cy = (sy / tiles.length + 0.5) * TILE;
      houses.push(h);
    }
    this.houseCache = { houses, byKey };
    this.houseVer = this.version;
    return this.houseCache;
  },
  houseAt(x, y) { return this.checkEnclosedSpace().byKey.get(this.key(Math.floor(x / TILE), Math.floor(y / TILE))) || null; },
  locHouse(b) {
    if (!b._house) {
      const t = b.t;
      b._house = { id: 'L' + World.buildings.indexOf(b), loc: true, b, rects: [{ x: b.x + t, y: b.y + t, w: b.w - 2 * t, h: b.h - 2 * t }],
        windows: b.openings.map(o => ({ cx: o.cx, cy: o.cy })), lanterns: b.lanterns };
    }
    return b._house;
  },
  anyHouseAt(x, y) {
    const h = this.houseAt(x, y);
    if (h) return h;
    const b = World.buildingAt(x, y);
    return b ? this.locHouse(b) : null;
  },
  // first wall-like base structure along a segment that blocks light (t in 0..1) or null
  lightRayT(x1, y1, x2, y2) {
    const d = dist(x1, y1, x2, y2), n = Math.max(1, Math.ceil(d / 7));
    let lastK = null;
    for (let i = 1; i <= n; i++) {
      const x = lerp(x1, x2, i / n), y = lerp(y1, y2, i / n);
      const k = this.key(Math.floor(x / TILE), Math.floor(y / TILE));
      if (k === lastK) continue;
      lastK = k;
      const s = this.grid.get(k);
      if (s && !s.destroyed && LIGHT_BLOCK.has(s.type)) return (i - 1) / n;
    }
    return null;
  },
  // does any solid base structure (walls, windows, closed doors) cut the segment?
  rayBlocked(x1, y1, x2, y2, except = null) {
    const d = dist(x1, y1, x2, y2), n = Math.ceil(d / 8);
    for (let i = 1; i < n; i++) {
      const x = lerp(x1, x2, i / n), y = lerp(y1, y2, i / n);
      const s = this.grid.get(this.key(Math.floor(x / TILE), Math.floor(y / TILE)));
      if (s && s !== except && !s.destroyed && STRUCTS[s.type].block !== 'none') return true;
    }
    return false;
  },
  updateIndoor(dt) {
    const h = this.anyHouseAt(Player.x, Player.y);
    if (h) this.house = h;
    this.indoorK += ((h ? 1 : 0) - this.indoorK) * Math.min(1, dt * 3);
    if (!h && this.indoorK < 0.01) this.house = null;

});

// ZOMBIES: entities, AI (perception, states, siege), spawner

  list: [],
  reset() { this.list = []; },
  spawn(type, x, y, opts = {}) {

    const tears = [], stains = [];
    for (let i = 0; i < 3; i++) tears.push([rand(-6, 6), rand(-12, 12), rand(1.5, 4), rand(1, 2.5), rand(0, TAU)]);
    for (let i = 0; i < 4; i++) stains.push([rand(-7, 5), rand(-12, 12), rand(1.5, 4)]);
    const z = {
      type, x, y, r: d.r * (opts.elite ? 1.15 : 1), hp: d.hp * hpMul, maxHp: d.hp * hpMul,
      speed: rand(d.speed[0], d.speed[1]) * diff.speedMul * (1 + Math.min(0.12, n * 0.004)),
      dmg: d.dmg * (opts.elite ? 1.3 : 1), armor: d.armor,
      state: opts.state || 'wander', tx: x, ty: y, angle: rand(0, TAU), walk: rand(0, 6), atkCD: 0, stun: 0, hitT: 0, vis: 0,
      kx: 0, ky: 0, percT: rand(0, 0.3), lostT: 0, searchT: 0, groanT: rand(2, 9), pinT: 0, slowT: 0, climbT: 0, spitCD: rand(1, 3), screamCD: 0,
      chargeT: 0, chargeCD: 2, lungeT: 0, stuckT: 0, lastX: x, lastY: y, sideT: 0, sideDir: 1, siege: !!opts.siege, elite: !!opts.elite, retreat: false,
      wanderT: 0, linger: 0, fearT: 0, lastSeenX: x, lastSeenY: y, structT: null, dead: false, sees: false,

  },
  hear(x, y, radius, kind) {

      if (d > radius) continue;
      if (z.state === 'chase' && z.sees) continue;

  },
  damage(z, dmg, ang, kb, hx, hy, stun = 0, crit = false, src = 'player', armorPierce = false, silent = false) {

  kill(z, src) {

  },
  retreatAll() { for (const z of this.list) { z.retreat = true; z.state = 'flee'; } },

  canSee(z) {

  update(dt) {
    const P = Player, night = Clock.isNight();
    const S = Stats.S;
    for (const z of this.list) {
      if (z.dead) continue;
      const def = ZTYPES[z.type];
      z.hitT = Math.max(0, z.hitT - dt);

          }

  },
  siegeTarget(z) {

    for (const s of Base.list) {
      if (s.destroyed || STRUCTS[s.type].block === 'none') continue;

    }
    z.structT = best;

  },
  updateVisibility(dt) {
    const amb = Clock.ambient(), P = Player, S = Stats.S;
    const L = P.light, o = P.lightOrigin();
    const lights = Base.lights();
    for (const z of this.list) {
      let v = 0;
      const d = dist(z.x, z.y, P.x, P.y);
      if (amb < 0.55) v = 1;
      else {
        const prox = S.nightVision * (P.onTower ? 1.5 : 1);
        if (d < prox) v = 1;
        else if (L.lit && P.inBeam(z.x, z.y, 1.08)) v = 1;
        else if (FX.muzzleT > 0 && d < 330) v = 0.8;
        else if (Weather.flash > 0.3) v = 0.7;
        else {
          for (const l of lights) {
            if (l.cone) { const dd = dist(z.x, z.y, l.x, l.y); if (dd < l.cone.len && angDiff(Math.atan2(z.y - l.y, z.x - l.x), l.cone.a) < l.cone.half * 1.3) { v = 1; break; } }
            else if (dist(z.x, z.y, l.x, l.y) < l.r * 0.85) { v = 1; break; }
          }
          if (!v) for (const f of Flares.list) if (f.landed && dist(z.x, z.y, f.x, f.y) < 320) { v = 1; break; }
        }
        if (z.type === 'crawler' && World.inGrass(z.x, z.y) && d > 90) v *= 0.25;
      }
      z.vis += (v - z.vis) * Math.min(1, dt * (v > z.vis ? 12 : 4));
    }
  },
};

// ---------- spawner ----------
const Spawner = {
  dayT: 30, packT: 4, spawned: 0, budget: 0, hordeAng: 0, waveDone: {},
  reset() { this.dayT = 40; this.packT = 3; this.spawned = 0; this.budget = 0; this.waveDone = {}; },
  startNight() {
    const n = Clock.day, d = Game.diff;
    let b = (7 + n * 1.75) * d.spawnMul;
    const ev = Events.active;
    if (ev === 'bloodmoon') b *= 1.8;
    if (ev === 'horde') b *= 2.1;
    if (ev === 'siege') b *= 1.4;
    if (ev === 'quiet') b *= 0.35;
    if (ev === 'storm') b *= 1.1;
    this.budget = Math.round(b);
    this.spawned = 0;
    this.packT = 2;
    this.hordeAng = rand(0, TAU);
    this.waveDone = {};
  },
  maxAlive() { return Math.min(75, Math.round((12 + Clock.day * 1.3) * (Events.active === 'horde' || Events.active === 'bloodmoon' ? 1.4 : 1))); },
  pickType(n) {
    const delay = Game.diff.typeDelay;
    const opts = Object.keys(ZTYPES).filter(k => ZTYPES[k].unlock === 1 || Math.ceil(ZTYPES[k].unlock * delay) <= n);
    const ws = opts.map(k => ZTYPES[k].weight * (k === 'walker' ? 1 : 1 + Math.min(1.5, (n - ZTYPES[k].unlock * delay) * 0.06)));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0);
    for (let i = 0; i < opts.length; i++) { r -= ws[i]; if (r <= 0) return opts[i]; }
    return 'walker';
  },
  spawnPos(cx, cy, minD, maxD, ang = null, spreadA = Math.PI) {
    for (let i = 0; i < 16; i++) {
      const a = ang === null ? rand(0, TAU) : ang + rand(-spreadA, spreadA), d = rand(minD, maxD);
      const x = clamp(cx + Math.cos(a) * d, 40, WORLD - 40), y = clamp(cy + Math.sin(a) * d, 40, WORLD - 40);
      if (inLake(x, y, 30) || World.buildingAt(x, y)) continue;
      if (onScreen(x, y, 80) && i < 12) continue;
      if (dist(x, y, Player.x, Player.y) < 650) continue;
      return { x, y };
    }
    return null;
  },
  pack(n, opts = {}) {
    const P = Player;
    const atBase = opts.siege;
    const c = atBase ? BASE_C : P;
    const pos = this.spawnPos(c.x, c.y, atBase ? BUILD_RADIUS + 380 : 950, atBase ? BUILD_RADIUS + 650 : 1350, opts.ang !== undefined ? opts.ang : null, opts.ang !== undefined ? 0.5 : Math.PI);
    if (!pos) return 0;
    let made = 0;
    for (let i = 0; i < n; i++) {
      const type = opts.type || this.pickType(Clock.day);
      const z = Zombies.spawn(type, pos.x + rand(-60, 60), pos.y + rand(-60, 60), {
        siege: atBase, state: atBase ? 'siege' : 'investigate', elite: opts.elite,
        target: { x: P.x + rand(-350, 350), y: P.y + rand(-350, 350) },
      });
      if (opts.elite) z.state = 'chase';
      made++;
    }
    return made;
  },
  update(dt) {
    const n = Clock.day, ph = Clock.phase(), d = Game.diff;
    if (Game.tutorialSafe()) return;
    if (ph === 'day' || ph === 'dusk') {
      this.dayT -= dt * d.spawnMul;
      const cap = Math.min(10, 2 + Math.floor(n / 3));
      if (this.dayT <= 0) {
        this.dayT = rand(24, 40);
        const dayCount = Zombies.list.filter(z => !z.retreat).length;
        if (dayCount < cap) {
          const type = n >= 6 && chance(0.25) ? (chance(0.5) ? 'crawler' : 'runner') : 'walker';
          const pos = this.spawnPos(Player.x, Player.y, 900, 1300);
          if (pos && (Clock.day >= 2 || type === 'walker') && dist(pos.x, pos.y, BASE_C.x, BASE_C.y) > BUILD_RADIUS + 100) Zombies.spawn(ZTYPES[type].unlock * d.typeDelay <= n ? type : 'walker', pos.x, pos.y, { state: 'wander' });
        }
      }
      return;
    }
    // night
    if (!Clock.isNight()) return;
    const alive = Zombies.list.filter(z => !z.retreat).length;
    const ev = Events.active;
    // scripted waves
    const h = Clock.hour();
    if (ev === 'hunter' && !this.waveDone.hunter && (h >= 22 || h < 6)) {
      this.waveDone.hunter = true;
      this.pack(1, { type: 'hunter', elite: true });
      UI.banner('The Hunter', 'It has your scent.', 3, 'danger');
      Sound.howl();
    }
    if (ev === 'siege' && !this.waveDone.siege1 && h >= 23) { this.waveDone.siege1 = true; this.siegeWave(); }
    if (ev === 'siege' && !this.waveDone.siege2 && h >= 2 && h < 6) { this.waveDone.siege2 = true; this.siegeWave(); }
    if (ev === 'horde' && !this.waveDone.horde && h >= 0 && h < 6) {
      this.waveDone.horde = true;
      UI.banner('They are here', '', 2.5, 'danger');
      Sound.howl();
      for (let i = 0; i < 4; i++) this.spawned += this.pack(4 + Math.floor(n / 6), { ang: this.hordeAng, siege: Base.list.length > 6 && chance(0.5) });
    }
    if (this.spawned >= this.budget || alive >= this.maxAlive()) return;
    this.packT -= dt;
    if (this.packT <= 0) {
      this.packT = clamp(15 - n * 0.22, 6, 15) * rand(0.7, 1.3) / (ev === 'bloodmoon' || ev === 'horde' ? 1.5 : 1);
      const size = Math.min(this.budget - this.spawned, randInt(2, 3) + Math.floor(n / 6));
      const siege = (ev === 'siege' && chance(0.6)) || (Base.list.length > 8 && n >= 5 && chance(0.18));
      this.spawned += this.pack(size, { siege, ang: ev === 'horde' ? this.hordeAng : undefined });
    }
  },
  siegeWave() {
    const n = Clock.day;
    UI.banner('Siege', 'They are at the walls.', 3, 'danger');
    Sound.siren();
    const ang = rand(0, TAU);
    for (let i = 0; i < 3; i++) this.spawned += this.pack(3 + Math.floor(n / 5), { siege: true, ang: ang + i * 0.5 });
  },
};

function person(g, x, y, s, o = {}) {
  g.save();
  g.translate(x, y);
  g.scale(s * (o.flip ? -1 : 1), s);
  if (o.fall) g.rotate(o.fall * 1.45);
  const run = o.run !== undefined ? o.run : null;
  g.lineCap = 'round';
  g.strokeStyle = o.pants || '#223';
  g.lineWidth = 3;
  const la = run !== null ? Math.sin(run) * 0.7 : o.zombie ? Math.sin(o.walk || 0) * 0.3 : 0;
  line(g, 0, -10, Math.sin(la) * 9, -10 + Math.cos(la) * 10);
  line(g, 0, -10, -Math.sin(la) * 9, -10 + Math.cos(la) * 10);
  g.fillStyle = o.shirt || '#555';
  rrect(g, -4, -23, 8, 14, 2); g.fill();
  if (o.coat) { g.fillStyle = o.coat; rrect(g, -4.6, -23, 9.2, 17, 2); g.fill(); }
  if (o.tie) { g.fillStyle = o.tie; g.fillRect(-0.7, -22, 1.4, 8); }
  g.strokeStyle = o.sleeve || o.coat || o.shirt || '#555';
  g.lineWidth = 2.6;
  if (o.zombie) {
    const w = o.walk || 0;
    line(g, 0, -20, 10, -19 + Math.sin(w * 1.3));
    line(g, 0, -19, 9, -17 + Math.cos(w * 1.3));
  } else if (o.armsUp) {
    line(g, 0, -21, -5, -31);
    line(g, 0, -21, 5, -31);
  } else if (run !== null) {
    const aa = Math.sin(run + Math.PI) * 0.9;
    line(g, 0, -21, Math.sin(aa) * 8, -21 + Math.cos(aa) * 8);
    line(g, 0, -21, -Math.sin(aa) * 8, -21 + Math.cos(aa) * 8);
  } else if (o.mic) {
    line(g, 0, -21, 6, -24);
    g.fillStyle = '#222'; g.fillRect(5, -27, 2, 4);
  } else {
    line(g, 0, -21, 2, -12);
  }
  if (o.rifle) { g.strokeStyle = '#111'; g.lineWidth = 1.8; line(g, -2, -19, 14, -21); }
  g.fillStyle = o.skin || '#e0b090';
  circle(g, o.zombie ? 2 : 0.5, -27, 4.2);
  if (o.hair) { g.fillStyle = o.hair; g.beginPath(); g.arc(0.5, -28, 4.4, Math.PI * 1.05, Math.PI * 1.95); g.fill(); }
  if (o.zombie) {
    g.fillStyle = '#ff2020'; circle(g, 4.5, -27.5, 0.9);
    g.fillStyle = 'rgba(120,0,0,0.9)'; g.fillRect(-3, -21, 4, 5);
  } else if (o.face !== false) {
    g.fillStyle = '#222'; circle(g, 2.6, -27.6, 0.6);
  }
  if (o.helmet) { g.fillStyle = o.helmet; g.beginPath(); g.arc(0.5, -28, 5, Math.PI, TAU); g.fill(); }
  g.restore();
}

function drawShow(g, t) {
  const D = intro.data;
  if (t >= 11.2) { drawOffline(g, t - 11.2); return; }
  g.save();
  let shake = 0;
  if (t > 4 && t < 4.4) shake = 4;
  if (t > 5.6 && t < 7.2) shake = 3;
  if (t > 9.6) shake = 6;
  if (shake) g.translate(rand(-shake, shake), rand(-shake, shake));
  if (t > 9.8) {

    else {
      const k = t - 6.1;

  const attacked = t >= 5.7, fall = clamp((t - 5.7) / 0.5, 0, 1);

    shirt: '#e8e8f0', coat: '#1a1a2a', tie: '#a01818', skin: '#e8c0a0', hair: '#b8b0a0',
    mic: t < 4.4, armsUp: t >= 4.4 && !attacked, flip: t >= 4.4, fall: fall * 1.05,

  const zx = t < 4.1 ? 330 : t < 5.7 ? lerp(306, 176, (t - 4.1) / 1.6) : 174;
  if (t >= 4.05) {
    person(g, zx, 172, 1.05, {
      zombie: true, shirt: '#3a4a3a', pants: '#2a2420', skin: '#7a8a62', walk: t * 8, flip: true,
      fall: attacked ? -0.35 + Math.sin(t * 18) * 0.06 : 0,

function startIntro() {
    Sound.init();
  Sound.startIntroBus();
  initIntroData();
  Object.assign(intro, { phase: 'poweron', t: 0, idx: -1 });
  Game.state = 'intro';
  Sound.powerOn();
}
function introNextChannel() {
  intro.idx++;
  Sound.resetIntroBus();
  Sound.tvClick();
  if (intro.idx >= CHANNELS.length) {
    intro.phase = 'nosignal';
    intro.t = 0;
    return;
  }
  Object.assign(intro, { chT: 0, cueI: 0, staticT: intro.idx === 0 ? 0.25 : 0.55, osdT: 2.6 });
}
function updateIntro(dt) {
  if (Game.state !== 'intro') return;
  intro.t += dt;
  intro.osdT = Math.max(0, intro.osdT - dt);
  if (intro.phase === 'poweron') {
    if (intro.t > 0.9) { intro.phase = 'channels'; introNextChannel(); }
  } else if (intro.phase === 'channels') {
    if (intro.staticT > 0) intro.staticT -= dt;
    else {
      intro.chT += dt;
      const ch = CHANNELS[intro.idx];
      while (intro.cueI < ch.cues.length && ch.cues[intro.cueI][0] <= intro.chT) {
        ch.cues[intro.cueI][1]();
        intro.cueI++;
      }
      if (intro.chT >= ch.dur) introNextChannel();
    }
  } else if (intro.phase === 'nosignal') {
    if (intro.t > 1.4) { intro.phase = 'poweroff'; intro.t = 0; Sound.powerOff(); }
  } else if (intro.phase === 'poweroff') {
    if (intro.t > 1.0) { intro.phase = 'black'; intro.t = 0; }
  } else if (intro.phase === 'black') {
    if (intro.t > 2.4) finishIntro();
  }
  const staticOn = intro.phase === 'poweron' || intro.phase === 'nosignal' || (intro.phase === 'channels' && intro.staticT > 0);
  Sound.setStatic(staticOn ? 0.2 : intro.phase === 'channels' ? 0.02 : 0);
}
function finishIntro() {
  if (Game.state !== 'intro') return;
  intro.phase = 'done';
  Sound.endIntro();
  Game.afterIntro();
}
function introSkipChannel() {
  if (Game.state === 'intro' && intro.phase === 'channels') introNextChannel();
}
