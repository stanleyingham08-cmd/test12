<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Forest</title>
<style>
  :root {
    --ui: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --serif: Georgia, 'Times New Roman', serif;
    --text: #d8d2c4; --dim: #8d877b; --faint: #57534b; --accent: #c9a961; --danger: #c8503e; --good: #8fb37a;
    --panel: rgba(13,12,10,.93); --line: rgba(216,210,196,.1); --slot: rgba(255,250,235,.035);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: var(--ui); user-select: none; color: var(--text); font-size: 14px; }
  canvas#game { display: block; cursor: none; }
  body.menuMode canvas#game { cursor: default; }
  button { font-family: inherit; color: inherit; }
  .hidden { display: none !important; }
  .ic { width: 22px; height: 22px; vertical-align: middle; image-rendering: auto; }
  .key { display: inline-block; min-width: 22px; padding: 1px 6px; border: 1px solid rgba(216,210,196,.45); border-bottom-width: 2px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 17px; text-align: center; color: var(--text); background: rgba(0,0,0,.35); }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.9); opacity: 1; transition: opacity 1.4s; }
  body:not(.ingame) #hud { opacity: 0; visibility: hidden; transition: none; }
  #vitals { position: absolute; top: 20px; left: 20px; width: 190px; }
  .vrow { display: flex; align-items: center; gap: 8px; }
  #heartIc { width: 18px; height: 18px; }
  #heartIc.low { animation: beat .8s infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
  .bar { position: relative; flex: 1; height: 6px; background: rgba(0,0,0,.55); border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
  .bar > div { height: 100%; width: 100%; border-radius: 3px; transition: width .2s; }
  #hpGhost, #hpFill { position: absolute; left: 0; top: 0; height: 100%; }
  #hpGhost { background: rgba(255,220,200,.35); transition: width .9s .25s; }
  #hpFill { background: linear-gradient(90deg, #7a1814, #b8352a); }
  #staRow { margin: 5px 0 0 26px; height: 3px; opacity: 0; transition: opacity .6s; }
  #staRow.on { opacity: 1; }
  #staBar { height: 3px; } #staBar > div { background: #c8c4b0; } #staBar.tired > div { background: var(--danger); } #staBar.boost > div { background: #d8c070; box-shadow: 0 0 6px #d8c070; }
  #noise.crouch i { background: rgba(120,160,200,.35); }
  #lvlRow { margin-top: 9px; display: flex; align-items: center; gap: 8px; }
  #lvl { width: 18px; text-align: center; font-size: 11px; font-weight: 600; color: var(--dim); }
  #xpBar { height: 2px; max-width: 120px; } #xpBar > div { background: #7f9cc8; }
  #spIc { width: 16px; height: 16px; animation: glow 1.6s infinite; }
  @keyframes glow { 50% { opacity: .35; } }

  #timebox { position: absolute; top: 18px; right: 20px; text-align: right; }
  #timeLine { display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
  #tIcon { width: 18px; height: 18px; }
  #clock { font-size: 22px; font-weight: 300; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  #dayTxt { font-size: 12px; color: var(--dim); margin-top: 1px; }
  #evTxt { font-size: 12px; color: var(--danger); margin-top: 2px; min-height: 0; }
  #minimap { display: block; margin: 10px 0 0 auto; width: 140px; height: 140px; border-radius: 50%; opacity: .85; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 18px rgba(0,0,0,.8); }

  #objective { position: absolute; left: 20px; bottom: 22px; max-width: 320px; transition: opacity .6s; }
  #objective .lbl { font-size: 11px; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
  #objText { font-size: 15px; margin-top: 2px; }
  #objCount { font-size: 13px; color: var(--accent); margin-top: 1px; font-variant-numeric: tabular-nums; }
  #feed { position: absolute; left: 20px; bottom: 96px; display: flex; flex-direction: column-reverse; gap: 4px; }
  .fd { display: flex; align-items: center; gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; animation: fdIn .25s ease-out; transition: opacity .6s, transform .6s; }
  .fd .ic { width: 26px; height: 26px; }
  .fd.out { opacity: 0; transform: translateX(-10px); }
  @keyframes fdIn { from { opacity: 0; transform: translateX(-12px); } }

  #weaponBox { position: absolute; right: 20px; bottom: 20px; text-align: right; }
  #wMain { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  #wIcon { width: 52px; height: 52px; opacity: .9; }
  #ammo { font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
  #ammo small { font-size: 15px; color: var(--dim); }
  #ammo.low b { color: var(--danger); } #ammo b { font-weight: 400; }
  #ammo.reload { opacity: .45; }
  #aux { display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 8px; font-size: 13px; color: var(--dim); }
  #aux .ic { width: 20px; height: 20px; }
  #flash { position: relative; display: flex; align-items: center; gap: 5px; }
  #flash.off .ic { opacity: .3; } #flash.flicker .ic { animation: glow .18s infinite; }
  #flash.dead .ic { opacity: .5; filter: sepia(1) saturate(6) hue-rotate(-30deg); animation: glow .6s infinite; }
  #batt { width: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; } #batt div { height: 100%; background: #c8c4b0; }
  #batt.low div { background: var(--danger); }
  #noise { display: flex; align-items: flex-end; gap: 2px; height: 14px; } #noise i { width: 3px; background: rgba(255,255,255,.15); border-radius: 1px; }
  #noise i.on { background: #d8c890; } #noise i.hi { background: var(--danger); }
  #wslots { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 10px; opacity: 0; transition: opacity .5s; }
  #wslots.show { opacity: 1; transition: opacity .12s; }
  .ws { position: relative; width: 46px; height: 46px; border-radius: 6px; background: rgba(0,0,0,.45); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; }
  .ws .ic { width: 36px; height: 36px; opacity: .55; }
  .ws.on { box-shadow: inset 0 0 0 1px var(--accent); } .ws.on .ic { opacity: 1; }
  .ws span { position: absolute; top: 2px; left: 5px; font-size: 10px; color: var(--dim); }

  #prompt { position: absolute; left: 50%; top: 61%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 1; transition: opacity .15s; }
  #prompt.hide { opacity: 0; }
  #pRow { display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  .pName { text-transform: none; letter-spacing: 0; font-size: 15px; color: #efe6cf; margin-right: 2px; }
  .pVerb { font-size: 12px; color: var(--dim); }
  #prompt.dim #pRow { color: var(--dim); } #prompt.dim .key { opacity: .35; }
  .chip { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .chip .ic { width: 20px; height: 20px; }
  .chip.no { color: var(--danger); } .chip.no .ic { opacity: .55; }
  #pBar { width: 120px; height: 2px; background: rgba(255,255,255,.12); border-radius: 1px; overflow: hidden; } #pBar div { height: 100%; width: 0; background: var(--text); }
  #pMeter { width: 60px; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; } #pMeter div { height: 100%; background: var(--accent); }

  #notice { position: absolute; top: 74px; left: 0; width: 100%; text-align: center; opacity: 0; transition: opacity .7s; }
  #notice.show { opacity: 1; transition: opacity .3s; }
  #nSmall { font-size: 11px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #nSmall .ic { width: 18px; height: 18px; }
  #nBig { font-family: var(--serif); font-size: 22px; margin-top: 3px; }
  #banner { position: absolute; top: 31%; left: 0; width: 100%; text-align: center; opacity: 0; transition: opacity 1s; padding: 0 16px; }
  #banner.show { opacity: 1; transition: opacity .5s; }
  #banner h2 { font-family: var(--serif); font-weight: normal; font-size: 40px; letter-spacing: .06em; color: #e6dfd0; }
  #banner p { font-size: 15px; color: var(--dim); margin-top: 6px; font-style: italic; font-family: var(--serif); }
  #banner.danger h2 { color: #d8574a; text-shadow: 0 0 22px rgba(200,40,30,.55); }
  #banner.level h2 { font-size: 30px; color: var(--accent); }
  #toast { position: absolute; top: 69%; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 14px; color: var(--text); opacity: 0; transition: opacity .4s; padding: 0 16px; }
  #toast.show { opacity: 1; transition: opacity .15s; }
  #keyhint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; font-size: 13px; color: var(--dim); opacity: 0; transition: opacity .8s; white-space: nowrap; }
  #keyhint.show { opacity: 1; }
  #keyhint span { display: flex; align-items: center; gap: 6px; }
  #saveIcon { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--faint); opacity: 0; transition: opacity .6s; margin-top: 36px; }
  #saveIcon.show { opacity: 1; }
  #buildBar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); pointer-events: auto; text-align: center; max-width: 96vw; }
  #buildName { font-size: 14px; margin-bottom: 6px; display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 22px; }
  #buildName .chip { font-size: 13px; }
  #buildItems { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .bi { position: relative; width: 54px; height: 54px; border-radius: 6px; border: none; background: rgba(10,9,8,.72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .bi img { width: 44px; height: 44px; }
  .bi.on { box-shadow: inset 0 0 0 1px var(--accent), 0 0 12px rgba(201,169,97,.25); }
  .bi.no img { opacity: .35; filter: grayscale(1); }
  .bi .lk { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; }
  #buildCats { display: flex; gap: 14px; justify-content: center; margin-top: 7px; font-size: 12px; color: var(--faint); }
  #buildCats span { cursor: pointer; } #buildCats span.on { color: var(--text); }
  #buildKeys { margin-top: 6px; font-size: 11px; color: var(--faint); display: flex; gap: 14px; justify-content: center; }

  /* ---------- screens ---------- */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.82); text-align: center; z-index: 10; padding: 16px; overflow-y: auto; animation: ovIn .25s ease-out; }
  @keyframes ovIn { from { opacity: 0; } }
  .overlay h1 { font-family: var(--serif); font-weight: normal; font-size: 46px; letter-spacing: .08em; color: #e6dfd0; margin-bottom: 10px; }
  .menu { display: flex; flex-direction: column; gap: 4px; margin: 22px 0 10px; width: 260px; }
  .btn { font-size: 16px; letter-spacing: .04em; padding: 10px 14px; background: none; border: none; cursor: pointer; color: var(--dim); transition: color .15s, background .15s; border-radius: 4px; }
  .btn:hover, .btn:focus-visible { color: var(--text); background: rgba(255,255,255,.04); outline: none; }
  .btn.primary { color: var(--text); }
  .btn.small { font-size: 13px; padding: 6px 10px; }
  .btn.solid { background: rgba(201,169,97,.14); color: var(--text); box-shadow: inset 0 0 0 1px rgba(201,169,97,.4); }
  .btn.solid:hover { background: rgba(201,169,97,.25); }
  .btn:disabled { opacity: .3; cursor: default; background: none; }
  .row-btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  #menu { background: radial-gradient(ellipse at center 45%, rgba(10,6,4,.35), rgba(0,0,0,.9)); }
  #menu h1 { font-size: 66px; letter-spacing: .22em; color: #9c2a20; text-shadow: 0 0 30px rgba(160,20,10,.6); margin-right: -.22em; }
  #saveInfo { font-size: 12px; color: var(--faint); margin-top: -2px; }
  #btnDelete { font-size: 12px; color: var(--faint); margin-top: 18px; }
  .cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 18px 0 8px; }
  .card { width: 230px; padding: 20px 18px; border-radius: 6px; border: none; background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; text-align: left; color: var(--dim); font-size: 13px; line-height: 1.5; transition: background .15s, box-shadow .15s; }
  .card h2 { font-family: var(--serif); font-weight: normal; font-size: 22px; color: var(--text); margin-bottom: 6px; }
  .card.hardcore h2 { color: #d8574a; }
  .card:hover, .card:focus-visible { background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(201,169,97,.5); outline: none; }
  .card .rec { margin-top: 10px; color: var(--faint); font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .card .rec .ic { width: 16px; height: 16px; opacity: .7; }
  .warn { color: var(--danger); font-size: 12px; min-height: 16px; }
  #create .wrap { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; align-items: flex-start; margin-top: 8px; }
  #preview { border-radius: 6px; background: radial-gradient(#191b15, #050505); }
  .opts { text-align: left; width: 330px; }
  .opt { margin: 0 0 12px; } .opt label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .opt input[type=text] { font: 17px var(--ui); background: rgba(255,255,255,.04); color: var(--text); border: none; border-bottom: 1px solid rgba(216,210,196,.25); padding: 6px 2px; width: 100%; outline: none; }
  .opt input[type=text]:focus { border-bottom-color: var(--accent); }
  .choices { display: flex; flex-wrap: wrap; gap: 4px; }
  .choices button { background: rgba(255,255,255,.03); border: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); padding: 4px 9px; font-size: 13px; cursor: pointer; border-radius: 3px; text-transform: capitalize; }
  .choices button.on { color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }
  .choices button.sw { width: 24px; height: 24px; padding: 0; border-radius: 50%; }
  .choices button.sw.on { box-shadow: 0 0 0 2px #000, 0 0 0 3px var(--accent); }
  .controls { display: grid; grid-template-columns: auto auto; gap: 8px 16px; margin: 16px 0; font-size: 14px; text-align: left; color: var(--dim); align-items: center; }
  .controls > span:nth-child(odd) { text-align: right; }
  #settings .opt { width: 320px; text-align: left; }
  #settings label.tg { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); margin: 6px 0; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }

  /* panels: backpack, storage, crafting */
  .sheetWrap { justify-content: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.88)); }
  .sheet { width: min(860px, 96vw); max-height: 90vh; display: flex; flex-direction: column; background: var(--panel); border-radius: 8px; box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.8); text-align: left; animation: sheetIn .22s ease-out; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  #tabs { display: flex; gap: 2px; padding: 10px 12px 0; }
  #tabs button { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--faint); padding: 8px 12px; font-size: 14px; cursor: pointer; border-radius: 5px 5px 0 0; }
  #tabs button .ic { width: 20px; height: 20px; opacity: .45; }
  #tabs button.on { color: var(--text); background: rgba(255,255,255,.04); } #tabs button.on .ic { opacity: 1; }
  #tabs .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .sheetBody { padding: 18px; overflow-y: auto; flex: 1; border-top: 1px solid var(--line); }
  .sheetHead { display: flex; align-items: center; gap: 10px; padding: 14px 18px; font-family: var(--serif); font-size: 19px; }
  .sheetHead .ic { width: 30px; height: 30px; }
  .sheetHead .sub { font-family: var(--ui); font-size: 13px; color: var(--dim); }
  .sheetHead .x { margin-left: auto; font-family: var(--ui); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 58px); gap: 6px; }
  .slot { position: relative; width: 58px; height: 58px; border-radius: 6px; background: var(--slot); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .12s, box-shadow .12s; border: none; }
  .slot img { width: 42px; height: 42px; }
  .slot:hover { background: rgba(255,250,235,.07); }
  .slot.sel { box-shadow: inset 0 0 0 1px var(--accent); background: rgba(201,169,97,.08); }
  .slot.empty { cursor: default; } .slot.empty:hover { background: var(--slot); }
  .slot .q { position: absolute; right: 4px; bottom: 2px; font-size: 12px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
  .slot .fill { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 2px; background: rgba(255,255,255,.08); border-radius: 1px; } .slot .fill div { height: 100%; background: rgba(216,210,196,.45); }
  .slot .fill.full div { background: var(--danger); }
  .slot .pips { position: absolute; left: 5px; top: 4px; display: flex; gap: 2px; } .slot .pips i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .slot.eq { width: 74px; height: 58px; } .slot.eq img { width: 52px; height: 52px; }
  .slot.flashOk { animation: pop .45s ease-out; }
  @keyframes pop { 30% { transform: scale(1.12); background: rgba(201,169,97,.25); } }
  .bpLayout { display: flex; gap: 22px; flex-wrap: wrap; }
  .bpLeft { display: flex; flex-direction: column; gap: 6px; }
  .bpRight { flex: 1; min-width: 260px; }
  .divider { height: 1px; background: var(--line); margin: 8px 0; }
  .detail { margin-top: 16px; min-height: 64px; display: flex; align-items: center; gap: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .detail img { width: 52px; height: 52px; }
  .detail .nm { font-size: 16px; } .detail .sm { font-size: 13px; color: var(--dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .detail .act { margin-left: auto; }
  .stLayout { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .stSide { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .stSide > .ic { width: 34px; height: 34px; opacity: .8; }
  .stSide .grid { grid-template-columns: repeat(4, 58px); }
  .stMid { display: flex; flex-direction: column; gap: 8px; }
  .arrow { width: 44px; height: 36px; border-radius: 5px; border: none; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); font-size: 18px; cursor: pointer; }
  .arrow:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .hintline { margin-top: 14px; text-align: center; font-size: 12px; color: var(--faint); }
  .filters { display: flex; gap: 4px; margin-left: 16px; }
  .filters button { width: 34px; height: 34px; border-radius: 5px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .filters button .ic { width: 22px; height: 22px; opacity: .35; } .filters button.on { background: rgba(255,255,255,.06); } .filters button.on .ic { opacity: 1; }
  .recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; }
  .rc { position: relative; border-radius: 7px; background: rgba(255,250,235,.03); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: background .12s, box-shadow .12s, transform .12s; border: none; }
  .rc:hover { background: rgba(255,250,235,.06); }
  .rc.ok { box-shadow: inset 0 0 0 1px rgba(201,169,97,.35); }
  .rc.off { cursor: default; } .rc.off > img { opacity: .4; filter: grayscale(.8); } .rc.off .nm { color: var(--dim); }
  .rc > img { width: 50px; height: 50px; }
  .rc .nm { font-size: 14px; text-align: center; }
  .rc .lv { position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--accent); }
  .rc .lk { position: absolute; top: 7px; left: 8px; display: flex; align-items: center; gap: 2px; font-size: 11px; color: var(--dim); } .rc .lk .ic { width: 15px; height: 15px; }
  .rc .cost { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .rc.made { animation: pop .5s ease-out; }
  @media (max-height: 820px), (max-width: 1100px) {
    #crafting .sheet { width: min(1000px, 97vw); max-height: 96vh; }
    #crafting .sheetHead { padding: 8px 14px; }
    #crafting .sheetBody { padding: 10px 12px; }
    .recipes { grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); gap: 6px; }
    .rc { flex-direction: row; align-items: center; gap: 8px; padding: 5px 8px; text-align: left; min-height: 48px; }
    .rc > img { width: 34px; height: 34px; flex: none; }
    .rc .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rc .nm { font-size: 13px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

// AUDIO MANAGER (Web Audio synthesis, positional)
// =====================================================================
const Sound = {
  ctx: null, master: null, bus: null, filter: null, noise: null, windGain: null, rainGain: null,
  introBus: null, staticSrc: null, staticGain: null, volume: 0.7, muffled: false,
  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended' && Game.state !== 'paused') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = 'lowpass';
    this.filter.frequency.value = 20000;
    this.filter.connect(this.master);
    this.master.connect(this.ctx.destination);
    this.bus = this.filter;
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.windGain = this.loopNoise('lowpass', 380, 0);
    const lfo = this.ctx.createOscillator();
    lfo.frequency.value = 0.08;
    const lg = this.ctx.createGain();
    lg.gain.value = 0.03;
    lfo.connect(lg); lg.connect(this.windGain.gain); lfo.start();
    this.rainGain = this.loopNoise('highpass', 1000, 0);
  },
  setVolume(v) {
    this.volume = v;
    if (this.master) this.master.gain.value = v;
  },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  t() { return this.ctx.currentTime; },
  loopNoise(type, freq, vol) {
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = this.noise; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.filter);
    s.start();
    return g;
  },
  indoorK: 0, reverb: null, revGain: null,
  // indoors: outside weather is muffled and the room adds a short reverb tail
  setIndoor(k) {
    this.indoorK = k;
    if (!this.ctx) return;
    if (!this.reverb && this.ctx.createConvolver) {
      const c = this.ctx, len = Math.floor(c.sampleRate * 0.7), buf = c.createBuffer(2, len, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      this.reverb = c.createConvolver(); this.reverb.buffer = buf;
      this.revGain = c.createGain(); this.revGain.gain.value = 0;
      this.filter.connect(this.reverb); this.reverb.connect(this.revGain); this.revGain.connect(this.master);
    }
    if (this.revGain) this.revGain.gain.setTargetAtTime(0.28 * k, this.t(), 0.3);
  },
  setAmbience(rain, wind, muffle) {
    if (!this.ctx) return;
    const t = this.t(), out = 1 - 0.65 * this.indoorK;
    this.rainGain.gain.setTargetAtTime(rain * 0.3 * out, t, 0.8);
    this.windGain.gain.setTargetAtTime(wind * out, t, 1.2);
    this.filter.frequency.setTargetAtTime(muffle ? 2600 : 20000, t, 0.5);
  },
  // Positional output: stereo pan relative to facing, low-pass when behind the player.
  at(x, y, maxD = 1000) {
    const dx = x - Player.x, dy = y - Player.y, d = Math.hypot(dx, dy);
    const k = clamp(1 - d / maxD, 0, 1);
    const rel = wrapAngle(Math.atan2(dy, dx) - Player.aim);
    const c = this.ctx;
    let out = this.bus;
    if (Math.cos(rel) < -0.1) {
      const f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = lerp(6000, 900, clamp(-Math.cos(rel), 0, 1));
      f.connect(out);
      out = f;
    }
    if (c.createStereoPanner) {
      const p = c.createStereoPanner();
      p.pan.value = d < 20 ? 0 : clamp(Math.sin(rel), -1, 1) * 0.9;
      p.connect(out);
      out = p;
    }
    return { out, k: k * k };
  },
  panned(pan) {
    if (!this.ctx.createStereoPanner) return this.bus;
    const p = this.ctx.createStereoPanner();
    p.pan.value = clamp(pan, -1, 1);
    p.connect(this.bus);
    return p;
  },
  noiseBurst(t, dur, vol, type, freq, dest, q = 1) {
    if (vol <= 0.0005) return;
    const c = this.ctx;
    const src = c.createBufferSource();
    src.buffer = this.noise;
    const f = c.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(Math.max(vol, 0.0011), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || this.bus);
    src.start(t, dur < 0.5 ? Math.random() * 1.4 : 0);
    src.stop(t + Math.min(dur, 1.95) + 0.02);
  },
  tone(t, type, f0, f1, dur, vol, dest) {
    if (vol <= 0.0002) return;
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.bus);
    o.start(t); o.stop(t + dur + 0.02);
  },
  flat(t, type, f, dur, vol, dest) {
    const c = this.ctx;
    const o = c.createOscillator(); o.type = type; o.frequency.value = f;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.01, dur / 3));
    g.gain.setValueAtTime(vol, t + Math.max(dur - 0.02, dur * 0.6));
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(dest || this.bus);
    o.start(t); o.stop(t + dur + 0.02);
  },
  whoosh(f0, f1, dur, vol, dest) {
    if (!this.ok()) return;
    const c = this.ctx, t = this.t();
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.bus);
    s.start(t, Math.random()); s.stop(t + dur + 0.02);
  },
  osc(t, type, f0, f1, dur, vol, out, vib = 0, vibF = 6) {
    const c = this.ctx;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    let lfo = null;
    if (vib) {
      lfo = c.createOscillator(); lfo.frequency.value = vibF;
      const lg = c.createGain(); lg.gain.value = vib;
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    }
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.08, dur / 4));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || this.bus);
    o.start(t); o.stop(t + dur + 0.05);
    return g;
  },

  // ---------------- UI / player ----------------
  click() {
    if (!this.ok()) return;
    const t = this.t();
    this.tone(t, 'square', 2300, 1800, 0.025, 0.12);
    this.noiseBurst(t, 0.02, 0.2, 'highpass', 4000);
  },
  uiClick() {
    if (!this.ok()) return;
    this.tone(this.t(), 'triangle', 900, 700, 0.05, 0.06);
  },
  uiDeny() {
    if (!this.ok()) return;
    const t = this.t();
    this.tone(t, 'square', 220, 160, 0.12, 0.06);
  },
  chime() {
    if (!this.ok()) return;
    const t = this.t();
    [660, 880, 1320].forEach((f, i) => this.tone(t + i * 0.07, 'triangle', f, f, 0.3, 0.16));
  },
  levelUp() {
    if (!this.ok()) return;
    const t = this.t();
    [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(t + i * 0.09, 'triangle', f, f, 0.5, 0.17));
  },
  skillBuy() {
    if (!this.ok()) return;
    const t = this.t();
    this.tone(t, 'sine', 523, 1047, 0.3, 0.16);
    this.tone(t + 0.08, 'triangle', 784, 784, 0.4, 0.12);

  flareBurn(dur) {
    if (!this.ok()) return;
    const c = this.ctx, t = this.t();
    const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2800; f.Q.value = 0.8;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.1);
    g.gain.setValueAtTime(0.1, t + dur - 0.5);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);

    s.start(t); s.stop(t + dur + 0.05);
  },

  // ---------------- world / zombies ----------------
  groan(x, y, vol = 0.3, deep = 1) {
    if (!this.ok()) return;
    const { out, k } = this.at(x, y, 950);
    if (k <= 0.003) return;
    const c = this.ctx, t = this.t(), dur = rand(0.8, 1.6);
    const base = rand(65, 115) / deep;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(base, t);
    o.frequency.linearRampToValueAtTime(base * rand(0.6, 0.85), t + dur);
    const lfo = c.createOscillator(); lfo.frequency.value = rand(5, 10);
    const lg = c.createGain(); lg.gain.value = base * 0.09;
    lfo.connect(lg); lg.connect(o.frequency);
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rand(350, 700) / deep; f.Q.value = 2.2;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol * k, t + 0.18);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(out);
    o.start(t); lfo.start(t); o.stop(t + dur); lfo.stop(t + dur);
    this.noiseBurst(t, dur * 0.8, vol * 0.4 * k, 'bandpass', 320, out, 1.5);
  },
  screech(x, y, vol = 0.5) {

    g.disconnect();
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 1.6;
    g.connect(f); f.connect(out);

  // ---------------- TV intro ----------------
  startIntroBus() {
    if (!this.ctx) return;
    this.introBus = this.ctx.createGain();
    this.introBus.connect(this.filter);
    this.bus = this.introBus;
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 700;
    const g = c.createGain(); g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(this.filter);
    s.start();
    this.staticSrc = s;
    this.staticGain = g;
  },
  resetIntroBus() {
    if (!this.introBus) return;
    const old = this.introBus;
    old.gain.setTargetAtTime(0, this.t(), 0.02);
    setTimeout(() => { try { old.disconnect(); } catch (e) { /* already gone */ } }, 500);
    this.introBus = this.ctx.createGain();
    this.introBus.connect(this.filter);
    this.bus = this.introBus;
  },
  endIntro() {
    if (!this.ctx) return;
    if (this.introBus) {
      const old = this.introBus;
      old.gain.setTargetAtTime(0, this.t(), 0.05);
      setTimeout(() => { try { old.disconnect(); } catch (e) { /* already gone */ } }, 600);
      this.introBus = null;
    }
    this.bus = this.filter;
    if (this.staticSrc) {
      const s = this.staticSrc;
      this.staticGain.gain.setTargetAtTime(0, this.t(), 0.05);
      setTimeout(() => { try { s.stop(); } catch (e) { /* already stopped */ } }, 500);
      this.staticSrc = null;
      this.staticGain = null;
    }
  },
  setStatic(v) { if (this.staticGain) this.staticGain.gain.setTargetAtTime(v, this.t(), 0.03); },
  powerOn() {
    if (!this.ok()) return;
    const t = this.t();
    this.tone(t, 'sine', 110, 50, 0.6, 0.3);
    this.noiseBurst(t, 0.25, 0.3, 'highpass', 2500);
  },
  powerOff() {
    if (!this.ok()) return;
    const t = this.t();
    this.tone(t, 'sine', 900, 50, 0.4, 0.12, this.filter);
    this.noiseBurst(t, 0.15, 0.25, 'highpass', 3000, this.filter);
  },
  tvClick() {
    if (!this.ok()) return;
    const t = this.t();
    this.tone(t, 'square', 2300, 1800, 0.025, 0.12, this.filter);
    this.noiseBurst(t, 0.08, 0.3, 'highpass', 2000, this.filter);
  },
  jingle() {
    if (!this.ok()) return;
    const t = this.t();
    [523, 659, 784, 1047, 988, 1047, 1319].forEach((f, i) => this.tone(t + i * 0.11, 'triangle', f, f, 0.25, 0.16));
    this.tone(t + 0.8, 'sine', 1568, 1568, 0.9, 0.1);
  },
  applause(dur, vol = 0.5) {
    if (!this.ok()) return;
    const t = this.t(), n = Math.floor(dur * 45);
    for (let i = 0; i < n; i++) {
      const k = Math.random();
      this.noiseBurst(t + k * dur, 0.03, vol * 0.4 * (0.5 + Math.sin(Math.PI * k)), 'bandpass', rand(1200, 4000), null, 1.5);
    }
  },
  crash() {
    if (!this.ok()) return;
    const t = this.t();
    this.noiseBurst(t, 0.5, 1, 'lowpass', 2500);
    this.tone(t, 'sine', 90, 40, 0.4, 0.8);
    this.noiseBurst(t + 0.05, 0.3, 0.5, 'highpass', 3000);
  },
  tvScream(vol = 0.3, base = 700, dur = 0.9, pan = 0, at = 0) {
    if (!this.ok()) return;
    const t = this.t() + at, out = this.panned(pan);
    for (const [type, mul, v] of [['sawtooth', 1, 1], ['triangle', 1.5, 0.6]]) {
      const g = this.osc(t, type, base * mul, base * mul * 1.15, dur, vol * v, null, base * 0.06, 7);
      g.disconnect();
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 1.8;
      g.connect(f); f.connect(out);
    }
  },
  tvGroan(pan, vol) {
    if (!this.ok()) return;
    const t = this.t(), out = this.panned(pan), base = rand(70, 110);
    this.osc(t, 'sawtooth', base, base * 0.7, 1.2, vol, out, base * 0.09, 7);
  },
  crowdPanic(dur) {
    if (!this.ok()) return;
    for (let i = 0; i < 12; i++) this.tvScream(rand(0.06, 0.16), rand(500, 1150), rand(0.5, 1.2), rand(-1, 1), rand(0, dur));
    this.noiseBurst(this.t(), Math.min(dur, 1.9), 0.25, 'lowpass', 450);
  },
  newsSting() {
    if (!this.ok()) return;
    const c = this.ctx, t = this.t();
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2000; f.connect(this.bus);
    for (const fr of [196, 247, 294]) this.tone(t, 'sawtooth', fr, fr, 0.25, 0.07, f);
    for (const fr of [262, 330, 392]) this.tone(t + 0.28, 'sawtooth', fr, fr, 1.0, 0.08, f);
    this.tone(t + 0.28, 'sine', 70, 45, 0.6, 0.5);
  },
  tvSiren(dur) {
    if (!this.ok()) return;
    const c = this.ctx, t = this.t();
    const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = 760;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.4;
    const lg = c.createGain(); lg.gain.value = 190;
    lfo.connect(lg); lg.connect(o.frequency);
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.3);
    g.gain.setValueAtTime(0.06, t + dur - 0.3);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(this.panned(-0.4));
    o.start(t); lfo.start(t); o.stop(t + dur); lfo.stop(t + dur);
  },
  gunBurst(n, gap, vol) {
    if (!this.ok()) return;
    const t = this.t();
    for (let i = 0; i < n; i++) {
      const t0 = t + i * gap + rand(0, gap * 0.3);
      this.noiseBurst(t0, 0.14, vol, 'lowpass', 1700);
      this.tone(t0, 'sine', 130, 40, 0.1, vol * 0.6);
    }
  },
  explosionFar() {
    if (!this.ok()) return;
    const t = this.t();
    this.noiseBurst(t, 1.6, 0.9, 'lowpass', 500);
    this.tone(t, 'sine', 70, 25, 1.0, 0.8);
  },
  glassBreak() {
    if (!this.ok()) return;
    const t = this.t();
    for (let i = 0; i < 7; i++) this.noiseBurst(t + i * 0.03, 0.14, 0.4, 'highpass', rand(3000, 7000));
    this.tone(t, 'triangle', 3200, 1500, 0.3, 0.1);
  },
  fireCrackle(dur) {
    if (!this.ok()) return;
    const t = this.t();
    for (let i = 0; i < dur * 16; i++) this.noiseBurst(t + rand(0, dur), 0.02, rand(0.05, 0.18), 'highpass', rand(1500, 4000));
    this.noiseBurst(t, Math.min(dur, 1.9), 0.12, 'lowpass', 600);
  },
  testTone(dur) {
    if (!this.ok()) return;
    this.flat(this.t() + 0.2, 'sine', 1000, dur, 0.04);
  },
  eas() {
    if (!this.ok()) return;
    const t = this.t();
    for (let b = 0; b < 3; b++) for (let k = 0; k < 16; k++) this.flat(t + b * 0.45 + k * 0.022, 'square', k % 2 ? 2083 : 1563, 0.022, 0.035);
    this.flat(t + 1.5, 'sine', 853, 2.8, 0.06);
    this.flat(t + 1.5, 'sine', 960, 2.8, 0.06);
  },
};

// =====================================================================
// WORLD: seeded generation, static collision grid, resource nodes,
// locations/buildings, containers, discovery (fog of war)
// =====================================================================
const GRID_CELL = 200;
const FOG_CELL = 100;
const FOG_N = WORLD / FOG_CELL;

function lakeR(a) { return LAKE.r * (1 + 0.1 * Math.sin(3 * a + 0.7) + 0.06 * Math.sin(5 * a + 2.1) + 0.035 * Math.sin(7 * a + 0.3)); }
function inLake(x, y, pad = 0) {
  const dx = x - LAKE.x, dy = y - LAKE.y;
  return Math.hypot(dx, dy) < lakeR(Math.atan2(dy, dx)) + pad;
}
function distToPolyline(pts, x, y) {
  let best = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
    const dx = bx - ax, dy = by - ay;
    const k = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy), 0, 1);
    best = Math.min(best, dist(x, y, ax + dx * k, ay + dy * k));
  }
  return best;
}
const distToRoads = (x, y) => Math.min(...ROADS.map(r => distToPolyline(r, x, y)));
const SHORE_S = LAKE.y + lakeR(Math.PI / 2);
const DOCK = [
  { x: LAKE.x - 30, y: SHORE_S - 160, w: 60, h: 205 },
  { x: LAKE.x - 70, y: SHORE_S - 225, w: 140, h: 70 },
];
const onDock = (x, y) => DOCK.some(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
const inWater = (x, y) => inLake(x, y) && !onDock(x, y);

const World = {
  seed: 1, rng: null,
  buildings: [], openings: [], rects: [], circles: [], gates: [], containers: [], nodes: [], cars: [], camps: [], grass: [],
  firepits: [], props: [], locs: [], fog: null, grid: new Map(),
  decor: { bushes: [], tufts: [], leaves: [], logs: [] },

  generate(seed) {
    this.seed = seed;
    const R = this.rng = new RNG(seed);
    this.buildings = []; this.openings = []; this.rects = []; this.circles = []; this.gates = []; this.containers = [];
    this.nodes = []; this.cars = []; this.camps = []; this.grass = []; this.firepits = []; this.props = []; this.locs = [];
    this.decor = { bushes: [], tufts: [], leaves: [], logs: [] };
    this.fog = new Uint8Array(FOG_N * FOG_N);

    for (const def of LOC_DEFS) this.buildLocation(def, R);

    // cars along roads
    let carId = 0;
    for (const road of ROADS) {
      for (let i = 0; i < road.length - 1; i++) {
        const [ax, ay] = road[i], [bx, by] = road[i + 1];
        const segLen = dist(ax, ay, bx, by);
        const n = Math.floor(segLen / 700);
        for (let k = 0; k < n; k++) {
          if (!R.chance(0.65)) continue;
          const t = R.range(0.15, 0.85);
          const x = lerp(ax, bx, t), y = lerp(ay, by, t);
          if (dist(x, y, BASE_C.x, BASE_C.y) < 500 || this.nearLocation(x, y, 120)) continue;
          const ang = Math.atan2(by - ay, bx - ax) + (R.chance(0.5) ? Math.PI : 0) + R.range(-0.4, 0.4);
          const side = R.chance(0.5) ? 1 : -1;
          const cx = x - Math.sin(ang) * 26 * side, cy = y + Math.cos(ang) * 26 * side;
          this.addCar(cx, cy, ang, R.pick(['#5a6a7a', '#7a2a22', '#3a4a3a', '#8a8070', '#2a3a5a', '#6a5a3a', '#4a4a52']), carId++);
        }
      }
    }
    // campsites
    for (const c of CAMP_DEFS) {
      this.firepits.push({ x: c.x, y: c.y });
      this.camps.push(c);
      for (const [ox, oy, r] of [[-62, -44, 30], [58, -54, 24]]) {
        const t = { x: c.x + ox, y: c.y + oy, r, color: R.pick(['#a0521e', '#2a5a8a', '#3a6a3a', '#8a2a2a', '#c08020', '#4a4a8a']), kind: 'dome' };
        this.props.push(t);
        this.circles.push(t);
      }
      this.addContainer({ x: c.x + 18, y: c.y + 34, w: 20, h: 22, kind: 'camp', look: 'pack', label: 'Backpack' });
    }
    // lake dock crates
    this.addContainer({ x: LAKE.x - 62, y: SHORE_S - 218, w: 26, h: 20, kind: 'fuel', look: 'crate', label: 'Boat crate' });
    this.addContainer({ x: LAKE.x + 36, y: SHORE_S - 218, w: 26, h: 20, kind: 'household', look: 'crate', label: 'Tackle box' });

    // base starting clutter: none (the base is built by the player)
    // trees
    const reserved = (x, y, pad) => {
      if (inLake(x, y, pad + 40)) return true;
      if (dist(x, y, BASE_C.x, BASE_C.y) < 330 + pad) return true;
      if (this.nearLocation(x, y, 110 + pad)) return true;
      for (const c of this.camps) if (dist(x, y, c.x, c.y) < 150 + pad) return true;
      return distToRoads(x, y) < 70 + pad;
    };
    this.reserved = reserved;
    let tries = 0;
    while (this.nodes.filter(n => n.type === 'tree').length < 1150 && tries++ < 9000) {
      const x = R.range(60, WORLD - 60), y = R.range(60, WORLD - 60), canopy = R.range(55, 95);
      if (reserved(x, y, 20)) continue;
      const near = this.queryNodes(x, y, 140).some(t => t.type === 'tree' && dist(t.x, t.y, x, y) < (t.canopy + canopy) * 0.5);
      if (near) continue;
      const chunks = R.int(4, 6);
      this.addNode({ type: 'tree', x, y, r: R.range(10, 16), canopy, sprite: R.int(0, 7), rot: R.range(0, TAU), chunks, max: chunks, regrow: 0 });
    }
    for (let i = 0, made = 0; i < 2000 && made < 150; i++) {
      const x = R.range(80, WORLD - 80), y = R.range(80, WORLD - 80);
      if (reserved(x, y, 0)) continue;
      const chunks = R.int(4, 6);
      this.addNode({ type: 'rock', x, y, r: R.range(18, 28), chunks, max: chunks, rot: R.range(0, TAU), shade: R.pick(['#5a5a56', '#64625a', '#4e4f4a']), regrow: 0 });
      made++;
    }
    for (let i = 0, made = 0; i < 2000 && made < 90; i++) {
      let x, y;
      if (R.chance(0.6)) {
        const road = R.pick(ROADS), seg = R.int(0, road.length - 2);
        const t = R.next();
        x = lerp(road[seg][0], road[seg + 1][0], t) + R.range(-110, 110);
        y = lerp(road[seg][1], road[seg + 1][1], t) + R.range(-110, 110);
      } else { x = R.range(80, WORLD - 80); y = R.range(80, WORLD - 80); }
      if (x < 60 || y < 60 || x > WORLD - 60 || y > WORLD - 60 || inLake(x, y, 20) || dist(x, y, BASE_C.x, BASE_C.y) < 380 || this.nearLocation(x, y, 60)) continue;
      const chunks = R.int(3, 4);
      this.addNode({ type: 'scrap', x, y, r: 16, chunks, max: chunks, rot: R.range(0, TAU), regrow: 0 });
      made++;
    }
    // a few guaranteed resources near the base for Day 1
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + 0.4, d = R.range(380, 520);
      const x = BASE_C.x + Math.cos(a) * d, y = BASE_C.y + Math.sin(a) * d;
      if (distToRoads(x, y) < 70) continue;
      const chunks = R.int(4, 5);
      this.addNode({ type: 'tree', x, y, r: 13, canopy: R.range(60, 80), sprite: R.int(0, 7), rot: R.range(0, TAU), chunks, max: chunks, regrow: 0 });
    }
    this.addNode({ type: 'rock', x: BASE_C.x - 430, y: BASE_C.y + 120, r: 24, chunks: 5, max: 5, rot: 0.3, shade: '#5a5a56', regrow: 0 });
    this.addNode({ type: 'scrap', x: BASE_C.x + 410, y: BASE_C.y + 200, r: 16, chunks: 3, max: 3, rot: 1, regrow: 0 });

    // grass patches
    for (let i = 0; i < 900 && this.grass.length < 70; i++) {
      const x = R.range(100, WORLD - 100), y = R.range(100, WORLD - 100), r = R.range(70, 150);
      if (reserved(x, y, r * 0.5) || this.grass.some(g => dist(g.x, g.y, x, y) < g.r + r)) continue;
      const blades = [];
      for (let k = 0, n = Math.floor(r * r * 0.011); k < n; k++) {
        const a = R.range(0, TAU), d = Math.sqrt(R.next()) * r;
        blades.push([x + Math.cos(a) * d, y + Math.sin(a) * d, R.range(0, TAU), R.range(9, 17), R.int(0, 2), R.range(0, 6)]);
      }
      this.grass.push({ x, y, r, blades });
    }
    // decor
    for (let i = 0; i < 520; i++) {
      const x = R.range(0, WORLD), y = R.range(0, WORLD);
      if (!reserved(x, y, 0)) this.decor.bushes.push({ x, y, s: R.range(0.6, 1.2), sprite: R.int(0, 4), rot: R.range(0, TAU) });
    }
    for (let i = 0; i < 3200; i++) {
      const x = R.range(0, WORLD), y = R.range(0, WORLD);
      if (inLake(x, y, 10) || this.buildingAt(x, y) || distToRoads(x, y) < 50) continue;
      const blades = [];
      for (let k = 0, n = R.int(4, 7); k < n; k++) { const a = R.range(0, TAU), l = R.range(5, 11); blades.push([Math.cos(a) * l, Math.sin(a) * l]); }
      this.decor.tufts.push({ x, y, c: R.pick(['#3e5a26', '#4a6a2c', '#2f4a1e', '#556b2f']), blades });
    }
    for (let i = 0; i < 2200; i++) {
      const x = R.range(0, WORLD), y = R.range(0, WORLD);
      if (inLake(x, y) || this.buildingAt(x, y)) continue;
      this.decor.leaves.push({ x, y, rot: R.range(0, TAU), c: R.pick(['#5a3a1a', '#6b4a1c', '#7a5020', '#4a3012', '#665522']) });
    }
    for (let i = 0; i < 80; i++) {
      const x = R.range(0, WORLD), y = R.range(0, WORLD);
      if (!reserved(x, y, 40)) this.decor.logs.push({ x, y, len: R.range(60, 130), r: R.range(7, 12), rot: R.range(0, TAU) });
    }
    this.lakeRipples = [];
    for (let i = 0; i < 10; i++) {
      const a = R.range(0, TAU), r = lakeR(a) * R.range(0.1, 0.8);
      this.lakeRipples.push({ x: LAKE.x + Math.cos(a) * r, y: LAKE.y + Math.sin(a) * r, p: R.next() });
    }
    this.rebuildGrid();
  },

  nearLocation(x, y, pad) {
    for (const l of this.locs) {
      const fx = l.fence ? l.fence.rect : l;
      if (x > fx.x - pad && x < fx.x + fx.w + pad && y > fx.y - pad && y < fx.y + fx.h + pad) return true;
    }
    return false;
  },

  addNode(n) {
    n.id = this.nodes.length;
    this.nodes.push(n);
  },
  addContainer(c) {
    c.id = this.containers.length;
    c.looted = false;
    c.lootedDay = -99;
    this.containers.push(c);
    return c;
  },
  addCar(x, y, rot, color, id) {
    const car = { x, y, rot, color, id, sprite: null, circles: [] };
    const dx = Math.cos(rot), dy = Math.sin(rot);
    car.circles = [-28, 0, 28].map(o => ({ x: x + dx * o, y: y + dy * o, r: 21 }));
    this.circles.push(...car.circles);
    const tx = x - dx * 64, ty = y - dy * 64;
    car.trunk = this.addContainer({ x: tx - 14, y: ty - 14, w: 28, h: 28, kind: 'car', look: 'trunk', label: 'Car trunk', car: id });
    this.cars.push(car);
  },

  buildLocation(def, R) {
    const loc = { ...def, discovered: false, cx: def.x + def.w / 2, cy: def.y + def.h / 2 };
    this.locs.push(loc);
    const b = { loc, name: def.name, x: def.x, y: def.y, w: def.w, h: def.h, t: 14, openings: [], walls: [], roofA: 1, roofIdx: def.roof, kind: def.kind || 'house', lanterns: [] };
    const mk = (type, side, f) => {
      const len = type === 'door' ? 64 : 52;
      const pos = side === 'N' || side === 'S' ? b.x + f * b.w : b.y + f * b.h;
      let cx, cy, nx = 0, ny = 0, rect;
      const t = b.t;
      if (side === 'N') { cx = pos; cy = b.y + t / 2; ny = -1; rect = { x: pos - len / 2, y: b.y, w: len, h: t }; }
      if (side === 'S') { cx = pos; cy = b.y + b.h - t / 2; ny = 1; rect = { x: pos - len / 2, y: b.y + b.h - t, w: len, h: t }; }
      if (side === 'W') { cx = b.x + t / 2; cy = pos; nx = -1; rect = { x: b.x, y: pos - len / 2, w: t, h: len }; }
      if (side === 'E') { cx = b.x + b.w - t / 2; cy = pos; nx = 1; rect = { x: b.x + b.w - t, y: pos - len / 2, w: t, h: len }; }
      return { building: b, type, side, cx, cy, nx, ny, len, rect };
    };
    b.openings.push(mk('door', def.door[0], def.door[1]));
    for (const [s, f] of def.windows) b.openings.push(mk('window', s, f));
    const { x, y, w, h, t } = b;
    const horiz = (side, wy) => {
      const gaps = b.openings.filter(o => o.side === side).map(o => [o.rect.x, o.rect.x + o.rect.w]).sort((a, c) => a[0] - c[0]);
      let s = x;
      for (const [a, c] of gaps) { b.walls.push({ x: s, y: wy, w: a - s, h: t }); s = c; }
      b.walls.push({ x: s, y: wy, w: x + w - s, h: t });
    };
    const vert = (side, wx) => {
      const gaps = b.openings.filter(o => o.side === side).map(o => [o.rect.y, o.rect.y + o.rect.h]).sort((a, c) => a[0] - c[0]);
      let s = y;
      for (const [a, c] of gaps) { b.walls.push({ x: wx, y: s, w: t, h: a - s }); s = c; }
      b.walls.push({ x: wx, y: s, w: t, h: y + h - s });
    };
    horiz('N', y); horiz('S', y + h - t); vert('W', x); vert('E', x + w - t);
    this.buildings.push(b);
    this.openings.push(...b.openings);
    this.rects.push(...b.walls);
    for (const o of b.openings) if (o.type === 'window') { o.rect.win = true; this.rects.push(o.rect); }
    if (b.w * b.h > 50000) b.lanterns.push({ x: x + w * 0.3, y: y + h * 0.5 }, { x: x + w * 0.7, y: y + h * 0.5 });

    // container slots along interior walls, avoiding the door
    const door = b.openings[0];
    const slots = [];
    const m = t + 6;
    const cw = 26, ch = 20;
    const nx = Math.max(2, Math.floor((w - 2 * m) / 70)), ny = Math.max(2, Math.floor((h - 2 * m) / 70));
    for (let i = 0; i < nx; i++) {
      const sx = x + m + (i / (nx - 1)) * (w - 2 * m - cw);
      slots.push({ x: sx, y: y + m, w: cw, h: ch }, { x: sx, y: y + h - m - ch, w: cw, h: ch });
    }
    for (let i = 1; i < ny - 1; i++) {
      const sy = y + m + (i / (ny - 1)) * (h - 2 * m - ch);
      slots.push({ x: x + m, y: sy, w: ch, h: cw }, { x: x + w - m - ch, y: sy, w: ch, h: cw });
    }
    const free = slots.filter(s => dist(s.x + s.w / 2, s.y + s.h / 2, door.cx, door.cy) > 70);
    for (let i = free.length - 1; i > 0; i--) { const j = R.int(0, i); [free[i], free[j]] = [free[j], free[i]]; }
    let si = 0;
    const take = () => free[si++ % free.length];
    const lookFor = kind => ({ medical: 'cabinet', police: 'locker', military: 'mil', fuel: 'can', hardware: 'toolbox', industrial: 'crate', food: 'shelf', church: 'chest' }[kind] || 'drawer');
    for (const c of def.containers) {
      if (Array.isArray(c)) {
        for (let k = 0; k < c[1]; k++) this.addContainer({ ...take(), kind: c[0], look: lookFor(c[0]), label: c[0] === 'food' ? 'Shelf' : c[0] === 'medical' ? 'Cabinet' : 'Container', loc: def.id });
      } else if (c.note !== undefined) {
        const s = take();
        this.addContainer({ x: s.x + 4, y: s.y + 4, w: 16, h: 12, kind: 'note', look: 'note', note: c.note, label: 'Note', loc: def.id });
      } else if (c.fixed) {
        let s = take();
        if (def.kind === 'lumber' && c.fixed.weapon === 'lumberaxe') s = { x: x + w / 2 - 16, y: y + h + 60, w: 32, h: 32 };
        this.addContainer({ ...s, kind: 'fixed', look: c.lock ? 'lockbox' : 'special', fixed: c.fixed, lock: c.lock || null, label: c.label, loc: def.id });
      }
    }

    // location-specific props
    if (def.fence) {
      const p = def.fence.pad;
      const fr = { x: x - p, y: y - p, w: w + 2 * p, h: h + 2 * p };
      const gw = 90, ft = 8;
      const segs = [];
      const gx = fr.x + fr.w / 2 - gw / 2, gy = fr.y + fr.h / 2 - gw / 2;
      const side = def.fence.gate;
      if (side === 'N') { segs.push({ x: fr.x, y: fr.y, w: gx - fr.x, h: ft }, { x: gx + gw, y: fr.y, w: fr.x + fr.w - gx - gw, h: ft }); }
      else segs.push({ x: fr.x, y: fr.y, w: fr.w, h: ft });
      if (side === 'S') { segs.push({ x: fr.x, y: fr.y + fr.h - ft, w: gx - fr.x, h: ft }, { x: gx + gw, y: fr.y + fr.h - ft, w: fr.x + fr.w - gx - gw, h: ft }); }
      else segs.push({ x: fr.x, y: fr.y + fr.h - ft, w: fr.w, h: ft });
      segs.push({ x: fr.x, y: fr.y, w: ft, h: fr.h }, { x: fr.x + fr.w - ft, y: fr.y, w: ft, h: fr.h });
      const gate = { x: gx, y: side === 'N' ? fr.y : fr.y + fr.h - ft, w: gw, h: ft, lock: def.fence.lock, open: false, loc: def.id };
      loc.fence = { rect: fr, segs, gate };
      this.rects.push(...segs);
      this.gates.push(gate);
      for (let i = 0; i < 4; i++) this.props.push({ kind: 'floodpole', x: fr.x + (i % 2 ? fr.w - 20 : 20), y: fr.y + (i < 2 ? 20 : fr.h - 20) });
    }
    if (def.kind === 'gas') {
      const cp = { kind: 'canopy', x: x - 20, y: y + h + 40, w: w + 40, h: 120 };
      this.props.push(cp);

    }
    if (def.kind === 'church') {
      for (let i = 0; i < 12; i++) this.props.push({ kind: 'grave', x: x + w + 50 + (i % 3) * 40, y: y + 60 + Math.floor(i / 3) * 70, rot: R.range(-0.2, 0.2) });

    if (def.kind === 'checkpoint' || def.kind === 'military') {

        if (def.kind === 'checkpoint') { this.props.push(sb); this.circles.push(sb); }
      }
      const tents = def.kind === 'military' ? [[-120, -110], [w + 40, -100]] : [[-130, 20]];
      for (const [ox, oy] of tents) {

    }
    if (def.kind === 'lumber') {
      for (const [ox, oy, pw, ph] of [[-170, 10, 110, 44], [w + 50, -20, 44, 110]]) {
        const pile = { kind: 'logpile', x: x + ox, y: y + oy, w: pw, h: ph };
        this.props.push(pile);
        this.rects.push(pile);
      }
      this.firepits.push({ x: x - 80, y: y + h + 120 });
      for (let i = 0; i < 4; i++) {
        const sx = x + R.range(-200, w + 200), sy = y + R.range(h + 40, h + 260);
        this.addNode({ type: 'woodpile', x: sx, y: sy, r: 18, chunks: 4, max: 4, rot: R.range(0, TAU), regrow: 0 });
      }

    if (def.kind === 'tower') {
      const tw = { kind: 'radiotower', x: x + w + 110, y: y + h / 2, r: 34 };
      this.props.push(tw);

    if (def.kind === 'hospital') this.props.push({ kind: 'ambulance', x: x + w / 2 - 120, y: y - 70, rot: 0 });
    if (def.id === 'police') this.props.push({ kind: 'policecar', x: x + w + 80, y: y + 60, rot: Math.PI / 2 });
  },

  rebuildGrid() {
    this.grid = new Map();
    const add = (x0, y0, x1, y1, kind, obj) => {
      const cx0 = Math.floor(x0 / GRID_CELL), cy0 = Math.floor(y0 / GRID_CELL);
      const cx1 = Math.floor(x1 / GRID_CELL), cy1 = Math.floor(y1 / GRID_CELL);
      for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {
        const k = cx * 1000 + cy;
        let cell = this.grid.get(k);
        if (!cell) { cell = { circles: [], rects: [], nodes: [] }; this.grid.set(k, cell); }
        cell[kind].push(obj);
      }
    };
    for (const c of this.circles) add(c.x - c.r, c.y - c.r, c.x + c.r, c.y + c.r, 'circles', c);
    for (const r of this.rects) add(r.x, r.y, r.x + r.w, r.y + r.h, 'rects', r);
    for (const g of this.gates) add(g.x, g.y, g.x + g.w, g.y + g.h, 'rects', g);
    for (const n of this.nodes) add(n.x - 40, n.y - 40, n.x + 40, n.y + 40, 'nodes', n);
  },
  cellsNear(x, y, r, fn) {
    const cx0 = Math.floor((x - r) / GRID_CELL), cy0 = Math.floor((y - r) / GRID_CELL);
    const cx1 = Math.floor((x + r) / GRID_CELL), cy1 = Math.floor((y + r) / GRID_CELL);
    for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {
      const cell = this.grid.get(cx * 1000 + cy);
      if (cell) fn(cell);
    }
  },
  queryNodes(x, y, r) {
    const out = [];
    const seen = new Set();
    const cx0 = Math.floor((x - r) / GRID_CELL), cy0 = Math.floor((y - r) / GRID_CELL);
    const cx1 = Math.floor((x + r) / GRID_CELL), cy1 = Math.floor((y + r) / GRID_CELL);
    for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {
      const cell = this.grid.get(cx * 1000 + cy);
      if (!cell) continue;
      for (const n of cell.nodes) if (!seen.has(n)) { seen.add(n); out.push(n); }
    }
    if (!this.grid.size) return this.nodes.filter(n => dist(n.x, n.y, x, y) < r + 40);
    return out;
  },
  nodeSolid(n) {
    if (n.type === 'tree') return n.chunks > 0 ? n.r : 7;
    if (n.type === 'rock') return n.chunks > 0 ? n.r * (0.55 + 0.45 * n.chunks / n.max) : 0;
    return 0;
  },
  collide(o, who) {
    this.cellsNear(o.x, o.y, o.r + 4, cell => {
      for (const c of cell.circles) pushOutCircle(o, c);
      for (const r of cell.rects) {
        if (r.lock !== undefined && r.open) continue;
        pushOutRect(o, r);
      }
      for (const n of cell.nodes) {
        const sr = this.nodeSolid(n);
        if (sr > 0) pushOutCircle(o, { x: n.x, y: n.y, r: sr });
      }
    });
    if (who !== 'bullet') {
      o.x = clamp(o.x, o.r, WORLD - o.r);
      o.y = clamp(o.y, o.r, WORLD - o.r);
    }
  },
  // first static blocker hit along a segment: returns t or null
  // light = true: windows let light through
  rayHit(x1, y1, x2, y2, light = false) {
    let best = null;
    const minx = Math.min(x1, x2), maxx = Math.max(x1, x2), miny = Math.min(y1, y2), maxy = Math.max(y1, y2);
    const cx0 = Math.floor(minx / GRID_CELL), cy0 = Math.floor(miny / GRID_CELL);
    const cx1 = Math.floor(maxx / GRID_CELL), cy1 = Math.floor(maxy / GRID_CELL);
    for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {
      const cell = this.grid.get(cx * 1000 + cy);
      if (!cell) continue;
      for (const c of cell.circles) { const t = segCircle(x1, y1, x2, y2, c.x, c.y, c.r); if (t !== null && (best === null || t < best)) best = t; }
      for (const r of cell.rects) {
        if (r.lock !== undefined || (light && r.win)) continue;
        const t = segRect(x1, y1, x2, y2, r);
        if (t !== null && (best === null || t < best)) best = t;
      }
      for (const n of cell.nodes) {
        if (n.type !== 'tree' || n.chunks <= 0) continue;
        const t = segCircle(x1, y1, x2, y2, n.x, n.y, n.r);
        if (t !== null && (best === null || t < best)) best = t;
      }
    }
    return best;
  },
  buildingAt(x, y) {
    for (const b of this.buildings) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) return b;
    return null;
  },
  inGrass(x, y) {
    for (const g of this.grass) if (Math.abs(g.x - x) < g.r && Math.abs(g.y - y) < g.r && dist(x, y, g.x, g.y) < g.r * 0.92) return true;
    return false;
  },
  reveal(x, y, r) {
    const c0x = Math.max(0, Math.floor((x - r) / FOG_CELL)), c1x = Math.min(FOG_N - 1, Math.floor((x + r) / FOG_CELL));
    const c0y = Math.max(0, Math.floor((y - r) / FOG_CELL)), c1y = Math.min(FOG_N - 1, Math.floor((y + r) / FOG_CELL));
    for (let cx = c0x; cx <= c1x; cx++) for (let cy = c0y; cy <= c1y; cy++) {
      if (dist(cx * FOG_CELL + 50, cy * FOG_CELL + 50, x, y) < r) this.fog[cy * FOG_N + cx] = 1;
    }
  },
  revealed(x, y) {
    const cx = Math.floor(x / FOG_CELL), cy = Math.floor(y / FOG_CELL);
    return cx >= 0 && cy >= 0 && cx < FOG_N && cy < FOG_N && this.fog[cy * FOG_N + cx] === 1;
  },
  checkDiscovery() {
    for (const l of this.locs) {
      if (l.discovered) continue;
      const rr = Math.max(l.w, l.h) / 2 + 220;
      if (dist(Player.x, Player.y, l.cx, l.cy) < rr) {
        l.discovered = true;
        Prog.addXP(l.xp, 'discover');
        UI.notice('Discovered', l.name);
        Objectives.on('discover', l.id);
        Sound.chime();
        Game.stats.locations++;
      }
    }
  },
  dailyRegrow(day) {
    const restockDays = Prog.rank('scavking') ? 3 : 5;
    for (const n of this.nodes) {
      if (n.chunks <= 0 && n.regrow && day >= n.regrow) { n.chunks = n.max; n.regrow = 0; }
    }
    for (const c of this.containers) {
      if (!c.looted || c.kind === 'fixed' || c.kind === 'note') continue;
      if (day - c.lootedDay >= restockDays && Math.random() < 0.35) { c.looted = false; c.rummaged = true; }
    }
  },
};

// ---------- sprite generation (visual only) ----------

  makeGround() {

    const wrap = fn => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) fn(ox, oy); };
    for (let i = 0; i < 70; i++) {
      const x = rand(0, S), y = rand(0, S), r = rand(25, 80);

      wrap((ox, oy) => {

        gr.addColorStop(0, `rgba(${col},0.55)`);

        g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);

    for (let i = 0; i < 5000; i++) {
      const x = rand(0, S), y = rand(0, S), s = rand(1, 2.6);
      g.fillStyle = pick(specks);
      wrap((ox, oy) => g.fillRect(x + ox, y + oy, s, s));
    }
    g.lineWidth = 1;
    for (let i = 0; i < 1400; i++) {
      const x = rand(0, S), y = rand(0, S), a = rand(0, TAU), l = rand(3, 7);
      g.strokeStyle = pick(['#324a22', '#3d5628', '#28391a', '#46602c']);
      wrap((ox, oy) => line(g, x + ox, y + oy, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l));
    }

  },
  makeCanopy(kind) {
    const S = 220, c = makeCanvas(S, S), g = c.getContext('2d'), m = S / 2;
    if (kind === 'pine') {
      for (let L = 0; L < 6; L++) {
        const R = 100 * (1 - (L / 6) * 0.85), pts = 14 + L * 2;
        g.beginPath();
        for (let i = 0; i <= pts * 2; i++) {
          const a = (i / (pts * 2)) * TAU + L * 0.3;
          const rr = (i % 2 === 0 ? R : R * 0.72) * rand(0.93, 1.04);
          g.lineTo(m + Math.cos(a) * rr, m + Math.sin(a) * rr);
        }
        g.closePath();
        const s = 16 + L * 7;
        g.fillStyle = `rgb(${(s * 0.55) | 0},${(s + 14) | 0},${(s * 0.5) | 0})`;

      for (let i = 0; i < 22; i++) {

        gr.addColorStop(0, pick(['#3d5a28', '#44602c', '#36522a', '#4a5a26']));
        gr.addColorStop(1, '#12200b');
        g.fillStyle = gr;

  makeBush() {

  roof(b) {

      g.fillStyle = '#5a3f26'; g.fillRect(w / 2 - 26, hh / 2 - 16, 52, 32);

// ---------- transient effects ----------
const FX = {
  particles: [], decals: [], floaters: [], screenBlood: [], flashes: [], pickups: [],
  shakeT: 0, hurtT: 0, muzzleT: 0, muzzleBig: false,
  reset() {
    this.particles = []; this.decals = []; this.floaters = []; this.screenBlood = []; this.flashes = []; this.pickups = [];
    this.shakeT = 0; this.hurtT = 0; this.muzzleT = 0;
  },
  burst(kind, x, y, n, colors, speed = [60, 240], life = [0.3, 0.7], size = [1.5, 3], dir = null, spread = Math.PI) {
    if (this.particles.length > 900) return;
    for (let i = 0; i < n; i++) {
      const a = dir === null ? rand(0, TAU) : dir + rand(-spread, spread), s = rand(speed[0], speed[1]);
      this.particles.push({ kind, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life[0], life[1]), size: rand(size[0], size[1]), color: pick(colors), rot: rand(0, TAU), vr: rand(-12, 12) });
    }
  },
  blood(x, y, n, dir = null, spread = Math.PI) {
    this.burst('blood', x, y, n, ['#8a0000', '#a30d0d', '#6b0000', '#b31414', '#5a0000'], [60, 260], [0.25, 0.6], [1.5, 3.2], dir, spread);
  },
  decal(x, y, r, color) {
    const blobs = [];
    for (let i = 0; i < 5; i++) blobs.push([rand(-r, r) * 0.7, rand(-r, r) * 0.7, rand(r * 0.3, r * 0.7)]);
    this.decals.push({ x, y, c: color, blobs });
    if (this.decals.length > 260) this.decals.shift();
  },
  floater(x, y, text, color = '#e8d27a') { this.floaters.push({ x, y, text, color, t: 1.6 }); },
  // "+12 9mm Handgun Ammo" rising above the player; repeats of the same item merge
  pickupText(key, text, n, name) {
    const last = this.pickups.find(p => p.key === key && p.age < 0.9 && p.n !== null && n !== null);
    if (last) { last.n += n; last.text = `${last.n > 0 ? '+' : ''}${last.n} ${name}`; last.age = Math.min(last.age, 0.3); return; }
    this.pickups.push({ key, text, n, age: 0 });
    if (this.pickups.length > 4) this.pickups.shift();
  },
  shake(v) { if (Settings.shake) this.shakeT = Math.max(this.shakeT, v); },
  screenSplat() {
    const x = rand(W * 0.1, W * 0.9), y = rand(H * 0.1, H * 0.75), r = rand(30, 70), blobs = [], drips = [];
    for (let i = 0; i < 7; i++) blobs.push([rand(-r, r), rand(-r * 0.6, r * 0.6), rand(r * 0.2, r * 0.5)]);
    for (let i = 0; i < 4; i++) drips.push([rand(-r * 0.6, r * 0.6), rand(30, 110), rand(3, 7)]);
    this.screenBlood.push({ x, y, r, blobs, drips, life: 4 });
    if (this.screenBlood.length > 6) this.screenBlood.shift();
  },
  update(dt) {
    this.shakeT = Math.max(0, this.shakeT - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.muzzleT = Math.max(0, this.muzzleT - dt);
    for (const p of this.particles) {
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const drag = p.kind === 'smoke' ? 0.97 : 0.9;
      p.vx *= drag; p.vy *= drag;
      p.rot += p.vr * dt;
      if (p.kind === 'smoke') p.size += dt * 10;
      if (p.kind === 'blood' && p.life <= 0 && Math.random() < 0.18) this.decal(p.x, p.y, rand(3, 6), 'rgba(90,0,0,0.6)');
    }
    this.particles = this.particles.filter(p => p.life > 0);
    for (const f of this.floaters) { f.t -= dt; f.y -= dt * 22; }
    for (const p of this.pickups) p.age += dt;
    this.pickups = this.pickups.filter(p => p.age < 1.9);
    this.floaters = this.floaters.filter(f => f.t > 0);
    for (const s of this.screenBlood) s.life -= dt;
    this.screenBlood = this.screenBlood.filter(s => s.life > 0);
    for (const f of this.flashes) f.t -= dt;
    this.flashes = this.flashes.filter(f => f.t > 0);
  },
};

// ---------- derived stats (recomputed whenever skills/perks/gear change) ----------
const FLASH_TIERS = [null, { range: 430, cone: 0.42, name: 'Old Flashlight' }, { range: 530, cone: 0.5, name: 'Tactical Flashlight' }, { range: 640, cone: 0.56, name: 'Military Flashlight' }];
const Stats = {
  S: {},
  compute() {
    const r = id => Prog.rank(id), p = id => Prog.hasPerk(id), d = Game.diff || DIFFICULTY.regular;
    const night = Clock.isNight();
    const S = this.S;
    S.maxHp = 100 + d.playerHp + r('tough') * 15;
    S.maxSta = 100 + r('endurance') * 15;
    S.staRegen = 20 * (1 + r('endurance') * 0.1);
    S.speed = 168 * (1 + r('fleet') * 0.06) * (p('nightowl') && night ? 1.12 : 1);
    S.sprintCost = 24 * (1 - r('lightweight') * 0.2);
    S.carryMul = (1 + r('mule') * 0.2 + r('bigpockets') * 0.2 + (p('packrat') ? 0.3 : 0)) * [1, 1.25, 1.6][Inv.backpack || 0];
    S.dmgFire = 1 + r('firepower') * 0.08;
    S.dmgMelee = 1 + r('brawler') * 0.15;
    S.crit = 0.03 + r('deadshot') * 0.07 + (p('deadeye') ? 0.05 : 0);
    S.critMul = 2.5 + (p('deadeye') ? 0.5 : 0);
    S.meleeCrit = 0.05 + r('cleaver') * 0.1;
    S.spreadMul = 1 - r('steady') * 0.12;
    S.reloadMul = 1 - r('reload') * 0.12;
    S.magMul = 1 + r('mags') * 0.2;
    S.rateMul = 1 / (1 + r('trigger') * 0.12);
    S.pierce = r('piercing');
    S.dmgTaken = 1 - r('thickskin') * 0.06;
    S.healMul = (1 + r('medic') * 0.3) * (p('medicperk') ? 1.4 : 1) * d.healMul;
    const ft = FLASH_TIERS[Inv.flashTier || 1];
    S.flashRange = ft.range * (1 + r('bulbs') * 0.15) * (p('nightowl') && night ? 1.2 : 1);
    S.flashCone = ft.cone * (1 + r('widebeam') * 0.18);
    S.flashFail = d.flashFail * (1 - r('reliable') * 0.35) * (Inv.flashTier === 3 ? 0.6 : 1);
    S.nightVision = 120 + r('nighteyes') * 55;
    if (Player.onTower) { S.flashRange *= 1.75; S.flashCone *= 1.75; S.nightVision *= 1.5; }
    S.detectMul = 1 - r('shadow') * 0.12;
    S.harvest = 1 + r('lumberjack') * 0.35;
    S.mine = 1 + r('prospector') * 0.35;
    S.structCost = (1 - r('carpentry') * 0.1) * (p('builder') ? 0.85 : 1);
    S.structHp = (1 + r('fortify') * 0.15) * d.structHpMul;
    S.repairCost = 1 - r('handyman') * 0.3;
    S.powerMul = 1 - r('electrician') * 0.2;
    S.genBonus = r('powereng') * 20;
    S.fuelMul = 1 - r('powereng') * 0.25;
    S.trapMul = 1 + r('trapper') * 0.4;
    S.lootMul = (1 + r('keeneye') * 0.15) * d.lootMul;
    S.ammoFind = (1 + r('quartermaster') * 0.25) * d.ammoMul;
    S.regen = (r('recovery') ? r('recovery') * 0.6 : 0) + (p('survivor') ? 0.5 : 0);
    Player.maxHp = S.maxHp;
    Player.maxSta = S.maxSta;
    Player.hp = Math.min(Player.hp, S.maxHp);
